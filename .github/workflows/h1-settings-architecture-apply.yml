name: Increment H1 full-screen settings architecture

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/h1-settings-architecture-apply.yml

permissions:
  contents: write

jobs:
  apply-h1-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Apply guarded H1 settings transformations
        run: python3 .maintenance/h1_settings_architecture_apply.py
      - name: Guard diff
        run: |
          git diff --check
          grep -q 'internal fun AppSettingsScreen' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          ! grep -q 'internal fun AppSettingsDialog' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -q 'Slider(' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -q 'Respuesta háptica · dispositivo' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -q 'CharacterHapticSettingsProviderV4(store = hapticPreferencesStore)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/MainActivity.kt
          ! grep -q 'CharacterHapticSettingsProviderV4(store = hapticStore)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterPcSettingsContextV4.kt
          grep -q 'Perfil del dispositivo' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterPcSuccessorSettingsV4.kt
      - name: Focused compile and tests
        run: gradle :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit H1 product and self-remove helper
        run: |
          rm -f .github/workflows/h1-settings-architecture-apply.yml .maintenance/h1_settings_architecture_apply.py
          rmdir .maintenance 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add Increment H1 full-screen application settings'
          git push origin HEAD:implementation/phase4a-successor-cycle
