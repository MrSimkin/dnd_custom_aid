name: Temporary M5 consolidation gate

on:
  push:
    branches:
      - tmp/phase4-m5-consolidation

permissions:
  contents: write

jobs:
  consolidate-and-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-m5-consolidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply bounded cleanup and re-audit M4 traceability
        run: python .github/tmp_m5_consolidate.py

      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore

      - name: Run shared tests and application builds
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace

      - name: Type-check backend
        working-directory: backend
        run: npm install && npm run check

      - name: Record candidate-prep APK identity
        run: |
          test -f androidApp/build/outputs/apk/debug/androidApp-debug.apk
          sha256sum androidApp/build/outputs/apk/debug/androidApp-debug.apk
          stat --printf='APK_SIZE_BYTES=%s\n' androidApp/build/outputs/apk/debug/androidApp-debug.apk

      - name: Commit accepted helper-free M5 cleanup tree
        run: |
          rm .github/tmp_m5_consolidate.py .github/workflows/tmp-m5-consolidate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: remove superseded Phase 4 Android surfaces'
          git push origin HEAD:tmp/phase4-m5-consolidation
