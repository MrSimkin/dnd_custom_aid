name: Increment I1 tablet shell apply

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/i1-tablet-shell-apply.yml

permissions:
  contents: write

jobs:
  apply-i1-tablet-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Guard helper boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/i1-tablet-shell-apply.yml"
          test "$(git rev-parse HEAD^:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterAdaptiveShellV4.kt)" = "275360c47acb027e4000eb6617ff1bc149a3050d"
          test "$(git rev-parse HEAD^:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterLayoutContextV4.kt)" = "def4ebf695db180690b0c0e144c6e4030ec80b5a"
          test "$(git rev-parse HEAD^:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterResponsivePreferencesV4.kt)" = "533fcac0619e0cfebb71b657794704b35a167977"
      - name: Write tablet-first composition policy
        shell: bash
        run: |
          set -euo pipefail
          cat > androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterLayoutContextV4.kt <<'EOF'
          package io.github.mrsimkin.dndcustomaid.android

          import android.content.res.Configuration
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.platform.LocalConfiguration

          internal enum class CharacterFormFactorV4 {
              PHONE_PORTRAIT,
              PHONE_LANDSCAPE,
              TABLET_PORTRAIT,
              TABLET_LANDSCAPE,
          }

          internal data class CharacterLayoutContextV4(
              val formFactor: CharacterFormFactorV4,
          ) {
              val isPhone: Boolean
                  get() = formFactor == CharacterFormFactorV4.PHONE_PORTRAIT ||
                      formFactor == CharacterFormFactorV4.PHONE_LANDSCAPE

              val isTablet: Boolean
                  get() = !isPhone

              val isLandscape: Boolean
                  get() = formFactor == CharacterFormFactorV4.PHONE_LANDSCAPE ||
                      formFactor == CharacterFormFactorV4.TABLET_LANDSCAPE
          }

          internal const val CHARACTER_TABLET_MIN_SHORT_SIDE_DP = 600

          internal fun characterFormFactorV4(
              screenWidthDp: Int,
              screenHeightDp: Int,
              landscape: Boolean,
          ): CharacterFormFactorV4 {
              val tablet = minOf(screenWidthDp, screenHeightDp) >= CHARACTER_TABLET_MIN_SHORT_SIDE_DP
              return when {
                  tablet && landscape -> CharacterFormFactorV4.TABLET_LANDSCAPE
                  tablet -> CharacterFormFactorV4.TABLET_PORTRAIT
                  landscape -> CharacterFormFactorV4.PHONE_LANDSCAPE
                  else -> CharacterFormFactorV4.PHONE_PORTRAIT
              }
          }

          @Composable
          internal fun characterLayoutContextV4(): CharacterLayoutContextV4 {
              val configuration = LocalConfiguration.current
              return CharacterLayoutContextV4(
                  formFactor = characterFormFactorV4(
                      screenWidthDp = configuration.screenWidthDp,
                      screenHeightDp = configuration.screenHeightDp,
                      landscape = configuration.orientation == Configuration.ORIENTATION_LANDSCAPE,
                  ),
              )
          }

          internal fun characterNavigationPresentationForLayoutV4(
              context: CharacterLayoutContextV4,
          ): CharacterNavigationPresentationV4 = when (context.formFactor) {
              CharacterFormFactorV4.TABLET_LANDSCAPE -> CharacterNavigationPresentationV4.SIDE_RAIL
              CharacterFormFactorV4.PHONE_PORTRAIT,
              CharacterFormFactorV4.PHONE_LANDSCAPE,
              CharacterFormFactorV4.TABLET_PORTRAIT,
              -> CharacterNavigationPresentationV4.TOP_TABS
          }
          EOF

          cat > androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterResponsivePreferencesV4.kt <<'EOF'
          package io.github.mrsimkin.dndcustomaid.android

          import androidx.compose.runtime.Composable
          import androidx.compose.ui.platform.LocalDensity

          @Composable
          internal fun requestedCardColumnsV4(): Int {
              val layoutContext = characterLayoutContextV4()
              val preferences = LocalUiPreferencesV4.current
              return when (layoutContext.formFactor) {
                  CharacterFormFactorV4.PHONE_PORTRAIT -> preferences.phonePortraitColumns
                  CharacterFormFactorV4.PHONE_LANDSCAPE -> preferences.phoneLandscapeColumns
                  CharacterFormFactorV4.TABLET_PORTRAIT -> preferences.tabletPortraitColumns
                  CharacterFormFactorV4.TABLET_LANDSCAPE -> preferences.tabletLandscapeColumns
              }
          }

          @Composable
          internal fun constrainedCardColumnsV4(
              wide: Boolean,
              phoneMax: Int = 2,
              wideMax: Int = 4,
          ): Int {
              val layoutContext = characterLayoutContextV4()
              val requested = requestedCardColumnsV4()
              val baseMax = if (layoutContext.isTablet && wide) wideMax else phoneMax
              if (!layoutContext.isTablet || !wide) {
                  return requested.coerceIn(1, baseMax.coerceAtLeast(1))
              }

              val fontScale = LocalDensity.current.fontScale
              val tabletReadableMax = when (layoutContext.formFactor) {
                  CharacterFormFactorV4.TABLET_PORTRAIT -> when {
                      fontScale >= 1.60f -> 1
                      fontScale >= 1.35f -> minOf(2, baseMax)
                      else -> baseMax
                  }
                  CharacterFormFactorV4.TABLET_LANDSCAPE -> when {
                      fontScale >= 1.80f -> 1
                      fontScale >= 1.50f -> minOf(2, baseMax)
                      fontScale >= 1.30f -> minOf(3, baseMax)
                      else -> baseMax
                  }
                  else -> baseMax
              }
              return requested.coerceIn(1, tabletReadableMax.coerceAtLeast(1))
          }
          EOF

          cat > androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterAdaptiveShellV4.kt <<'EOF'
          package io.github.mrsimkin.dndcustomaid.android

          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.PaddingValues
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.fillMaxHeight
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.width
          import androidx.compose.foundation.layout.widthIn
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.NavigationRail
          import androidx.compose.material3.NavigationRailItem
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.saveable.rememberSaveableStateHolder
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import io.github.mrsimkin.dndcustomaid.shared.character.CharacterModuleKind
          import io.github.mrsimkin.dndcustomaid.shared.character.CharacterSheetTabKey

          @Composable
          internal fun CharacterAdaptiveShellV4(
              navigationPresentation: CharacterNavigationPresentationV4,
              selectedTab: CharacterTabV4,
              spellcasterEnabled: Boolean,
              visibleModules: Set<CharacterModuleKind>,
              tabOrder: List<CharacterSheetTabKey> = CharacterSheetTabKey.entries,
              onSelect: (CharacterTabV4) -> Unit,
              header: @Composable () -> Unit,
              content: @Composable () -> Unit,
          ) {
              val layoutContext = characterLayoutContextV4()
              val effectiveTabOrder = LocalCharacterPcSettingsContextV4.current
                  ?.successorState
                  ?.preferences
                  ?.tabOrder
                  ?: tabOrder
              val tabletStateHolder = rememberSaveableStateHolder()

              Column(modifier = Modifier.fillMaxSize()) {
                  // D01: the compact identity/save header remains outside all scrolling tab content.
                  header()

                  when (layoutContext.formFactor) {
                      CharacterFormFactorV4.PHONE_PORTRAIT,
                      CharacterFormFactorV4.PHONE_LANDSCAPE,
                      -> when (navigationPresentation) {
                          CharacterNavigationPresentationV4.TOP_TABS -> {
                              CharacterTopTabStripV4(
                                  selectedTab = selectedTab,
                                  spellcasterEnabled = spellcasterEnabled,
                                  visibleModules = visibleModules,
                                  tabOrder = effectiveTabOrder,
                                  onSelect = onSelect,
                              )
                              Box(modifier = Modifier.fillMaxWidth().weight(1f)) {
                                  content()
                              }
                          }

                          CharacterNavigationPresentationV4.SIDE_RAIL -> {
                              Row(modifier = Modifier.fillMaxWidth().weight(1f)) {
                                  CharacterNavigationRailV4(
                                      selectedTab = selectedTab,
                                      spellcasterEnabled = spellcasterEnabled,
                                      visibleModules = visibleModules,
                                      tabOrder = effectiveTabOrder,
                                      onSelect = onSelect,
                                      railWidth = 112.dp,
                                  )
                                  Box(modifier = Modifier.fillMaxHeight().weight(1f)) {
                                      content()
                                  }
                              }
                          }
                      }

                      CharacterFormFactorV4.TABLET_PORTRAIT -> {
                          CharacterTopTabStripV4(
                              selectedTab = selectedTab,
                              spellcasterEnabled = spellcasterEnabled,
                              visibleModules = visibleModules,
                              tabOrder = effectiveTabOrder,
                              onSelect = onSelect,
                          )
                          Box(
                              modifier = Modifier.fillMaxWidth().weight(1f),
                              contentAlignment = Alignment.TopCenter,
                          ) {
                              Box(
                                  modifier = Modifier
                                      .widthIn(max = 1040.dp)
                                      .fillMaxSize()
                                      .padding(horizontal = appSpacingV4(8.dp)),
                              ) {
                                  tabletStateHolder.SaveableStateProvider("tablet-tab-${selectedTab.name}") {
                                      content()
                                  }
                              }
                          }
                      }

                      CharacterFormFactorV4.TABLET_LANDSCAPE -> {
                          val fontScale = LocalDensity.current.fontScale
                          val railWidth = when {
                              fontScale >= 1.60f -> 148.dp
                              fontScale >= 1.30f -> 132.dp
                              else -> 116.dp
                          }
                          Row(modifier = Modifier.fillMaxWidth().weight(1f)) {
                              CharacterNavigationRailV4(
                                  selectedTab = selectedTab,
                                  spellcasterEnabled = spellcasterEnabled,
                                  visibleModules = visibleModules,
                                  tabOrder = effectiveTabOrder,
                                  onSelect = onSelect,
                                  railWidth = railWidth,
                              )
                              Box(
                                  modifier = Modifier.fillMaxHeight().weight(1f),
                                  contentAlignment = Alignment.TopCenter,
                              ) {
                                  Box(
                                      modifier = Modifier
                                          .widthIn(max = 1480.dp)
                                          .fillMaxSize()
                                          .padding(horizontal = appSpacingV4(10.dp)),
                                  ) {
                                      tabletStateHolder.SaveableStateProvider("tablet-tab-${selectedTab.name}") {
                                          content()
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun CharacterNavigationRailV4(
              selectedTab: CharacterTabV4,
              spellcasterEnabled: Boolean,
              visibleModules: Set<CharacterModuleKind>,
              tabOrder: List<CharacterSheetTabKey>,
              onSelect: (CharacterTabV4) -> Unit,
              railWidth: Dp,
          ) {
              val tabs = visibleCharacterTabsV4(spellcasterEnabled, visibleModules, tabOrder)

              NavigationRail(
                  modifier = Modifier.fillMaxHeight().width(railWidth),
              ) {
                  LazyColumn(
                      modifier = Modifier.fillMaxSize(),
                      contentPadding = PaddingValues(vertical = 4.dp),
                  ) {
                      items(tabs, key = CharacterTabV4::name) { tab ->
                          NavigationRailItem(
                              selected = tab == selectedTab,
                              onClick = { onSelect(tab) },
                              icon = {
                                  Text(
                                      text = characterTabRailMarkV4(tab),
                                      style = MaterialTheme.typography.labelMedium,
                                      maxLines = 1,
                                  )
                              },
                              label = {
                                  Text(
                                      text = tab.label,
                                      style = MaterialTheme.typography.labelSmall,
                                      maxLines = 2,
                                      overflow = TextOverflow.Ellipsis,
                                  )
                              },
                              alwaysShowLabel = true,
                              modifier = Modifier.fillMaxWidth().padding(horizontal = 2.dp),
                          )
                      }
                  }
              }
          }

          private fun characterTabRailMarkV4(tab: CharacterTabV4): String = when (tab) {
              CharacterTabV4.OVERVIEW -> "GE"
              CharacterTabV4.SKILLS -> "HA"
              CharacterTabV4.COMBAT -> "CO"
              CharacterTabV4.DICE -> "TD"
              CharacterTabV4.MANAGEMENT -> "GT"
              CharacterTabV4.EQUIPMENT -> "EQ"
              CharacterTabV4.BACKGROUND -> "TR"
              CharacterTabV4.TRAITS -> "RA"
              CharacterTabV4.SPELLS -> "CJ"
              CharacterTabV4.ARTIFICER -> "AR"
              CharacterTabV4.FORMS -> "FO"
              CharacterTabV4.TECHNIQUES -> "TÉ"
              CharacterTabV4.METAMAGIC -> "ME"
              CharacterTabV4.PACTS -> "PA"
              CharacterTabV4.COMPANIONS -> "CP"
              CharacterTabV4.NOTES -> "NO"
          }
          EOF
      - name: Guard product diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterAdaptiveShellV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterLayoutContextV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterResponsivePreferencesV4.kt | sort)"
          test "$changed" = "$expected"
      - name: Focused compile and shared tests
        run: ./gradlew :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit I1 product and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/i1-tablet-shell-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterAdaptiveShellV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterLayoutContextV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterResponsivePreferencesV4.kt \
                  .github/workflows/i1-tablet-shell-apply.yml
          git commit -m 'feat: add Increment I1 tablet-first adaptive shell'
          git push origin HEAD:implementation/phase4a-successor-cycle
