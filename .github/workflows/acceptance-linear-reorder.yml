name: Linear reorder acceptance repair

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/acceptance-linear-reorder.yml

permissions:
  contents: write

jobs:
  repair-linear-reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Guard acceptance boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f .maintenance/acceptance_linear_reorder.py
          test "$(git rev-parse HEAD:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCollectionPrimitivesV4.kt)" = "af0cb9b085da4815485a6f78dc553471368ca628"
          test "$(git rev-parse HEAD:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterNotesTabV4.kt)" = "a6b8db503d9f10bdf2763af0e9142008cafe27dc"
          test "$(git rev-parse HEAD:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt)" = "8f3368249340b45f5df38eaf8bb05489952d1da8"
          test "$(git rev-parse HEAD:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt)" = "6211df902d6267b6201b0d9211709b7885fcabb3"
      - name: Apply linear reorder repair
        run: python3 .maintenance/acceptance_linear_reorder.py
      - name: Guard product diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCollectionPrimitivesV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterNotesTabV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt | sort)"
          test "$changed" = "$expected"
          grep -q 'note-linear-reorder' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterNotesTabV4.kt
          grep -q 'trait-linear-reorder' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt
          grep -q 'equipment-ordinary-linear-reorder' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt
      - name: Focused compile and shared tests
        run: gradle :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .maintenance/acceptance_linear_reorder.py
          rm .github/workflows/acceptance-linear-reorder.yml
          rmdir .maintenance 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use linear reorder mode for multi-column collections'
          git push origin HEAD:implementation/phase4a-successor-cycle
