name: Pre-QA UX repair pass 6 helper

on:
  push:
    branches:
      - implementation/phase4-preqa-ux-repair

permissions:
  contents: write

env:
  REVIEW_VERSION: "0.4.0-preqa.6"
  REVIEW_BUILD: "40600"
  REVIEW_APK: "DND_Custom_Aid_0.4.0-preqa.6_Build_40600_debug.apk"
  REVIEW_ARTIFACT: "DND-Custom-Aid-0.4.0-preqa.6-build-40600-debug"

jobs:
  repair:
    if: github.event.head_commit.message == 'Execute durable pre-QA UX repair pass 6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply fail-closed repair pass
        run: python tools/preqa_ux_pass6.py

      - name: Verify repair shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'versionCode = 40600' androidApp/build.gradle.kts
          grep -q 'versionName = "0.4.0-preqa.6"' androidApp/build.gradle.kts
          grep -q 'constrainedCardColumnsV4(wide = wide, phoneMax = 2, wideMax = 4)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatTabV4.kt
          grep -q 'constrainedCardColumnsV4(wide = wide, phoneMax = 2, wideMax = 4)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt
          grep -q 'constrainedCardColumnsV4(wide = wide, phoneMax = 2, wideMax = 4)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterNotesTabV4.kt
          grep -q 'phoneMax = if (special) 2 else 3' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt
          grep -q 'wideMax = if (special) 3 else 5' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt
          grep -q 'val columns = if (wide) 6 else 3' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt
          grep -q 'maxWidth >= 1100.dp -> 7' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSupercompactV4.kt
          grep -q 'padding(horizontal = appSpacingV4(3.dp), vertical = appSpacingV4(4.dp))' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterLayoutV4.kt
          for f in \
            CharacterCombatTabV4.kt \
            CharacterTraitsClosureV4.kt \
            CharacterEquipmentClosureV4.kt \
            CharacterNotesTabV4.kt \
            CharacterSupercompactV4.kt; do
            if grep -E 'Arrangement\.spacedBy\([0-9]+\.dp\)' "androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/$f"; then
              echo "Raw focused Arrangement spacing remains in $f" >&2
              exit 1
            fi
          done
          grep -q '.imePadding()' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatTabV4.kt
          grep -q '.imePadding()' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt
          grep -q '.imePadding()' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt
          grep -q '.imePadding()' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterNotesTabV4.kt
          grep -q '.imePadding()' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellsTabV4.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: "false"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore

      - name: Build and test Kotlin surfaces
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Type-check backend
        working-directory: backend
        run: npm install --no-package-lock && npm run check

      - name: Prepare identified review APK
        run: |
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "$RUNNER_TEMP/$REVIEW_APK"
          echo "APK_SHA256=$(sha256sum "$RUNNER_TEMP/$REVIEW_APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c%s "$RUNNER_TEMP/$REVIEW_APK")" >> "$GITHUB_ENV"

      - name: Upload review APK
        uses: actions/upload-artifact@v7
        with:
          name: DND-Custom-Aid-0.4.0-preqa.6-build-40600-debug
          path: ${{ runner.temp }}/DND_Custom_Aid_0.4.0-preqa.6_Build_40600_debug.apk
          if-no-files-found: error

      - name: Remove temporary repair infrastructure
        run: |
          cp tools/preqa_checkpoint_pass6.py "$RUNNER_TEMP/preqa_checkpoint_pass6.py"
          rm -f tools/preqa_ux_pass6.py tools/preqa_checkpoint_pass6.py
          rm -f .github/workflows/preqa-ux-pass6-audit.yml .github/workflows/preqa-ux-pass6-helper.yml

      - name: Commit tested product repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement pre-QA UX repair pass 6"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Write owner-required pass checkpoint
        run: python "$RUNNER_TEMP/preqa_checkpoint_pass6.py"

      - name: Commit checkpoint
        run: |
          git add docs/PROJECT_STATE.md docs/checkpoints
          git commit -m "Checkpoint pre-QA UX repair pass 6"

      - name: Push tested repair and checkpoint
        run: git push origin HEAD:implementation/phase4-preqa-ux-repair
