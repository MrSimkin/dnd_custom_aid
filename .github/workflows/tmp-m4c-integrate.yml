name: Temporary M4c character-list integration

on:
  push:
    branches:
      - tmp/phase4-m4c-character-list

permissions:
  contents: write

jobs:
  integrate-and-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-m4c-character-list
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact M4c character-list patch
        run: python .github/tmp_m4c_integrate.py

      - name: Verify I18 reachability and authority use
        run: |
          grep -F 'characterListClassSummary(character.classes)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterUi.kt
          grep -F 'characterListFreshnessLabel(character.updatedAtEpochSeconds, nowEpochSeconds)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterUi.kt
          grep -F 'closureState.portraitRef' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterUi.kt
          test "$(grep -F 'closureRepository = characterClosureRepository,' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/MainActivity.kt | wc -l)" -ge 3

      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore

      - name: Run shared tests and application builds
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace

      - name: Type-check backend
        working-directory: backend
        run: |
          npm install
          npm run check

      - name: Commit accepted M4c product tree and remove temporary helpers
        run: |
          rm .github/tmp_m4c_integrate.py .github/workflows/tmp-m4c-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterUi.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/MainActivity.kt \
                  .github/tmp_m4c_integrate.py \
                  .github/workflows/tmp-m4c-integrate.yml
          git commit -m 'feat: integrate M4c character-list completeness'
          git push origin HEAD:tmp/phase4-m4c-character-list
