name: Temporary Phase4A Material3 pre-P12 audit repair

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/tmp-phase4a-material3-prep12-audit-repair.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0

      - name: Apply guarded P3/P4 Material 3 geometry repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          editor_path = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt')
          editor = editor_path.read_text()
          editor = replace_once(
              editor,
              '''@Composable
          private fun ReadOnlyTrainingV4(training: SkillTraining) {
              Surface(
                  modifier = Modifier.width(44.dp).heightIn(min = 34.dp),
                  shape = MaterialTheme.shapes.small,
                  border = BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant),
                  color = MaterialTheme.colorScheme.surface,
              ) {
                  Box(contentAlignment = Alignment.Center) { TrainingGlyphV4(training) }
              }
          }
          ''',
              '''@Composable
          private fun ReadOnlyTrainingV4(training: SkillTraining) {
              // M3 interactive buttons reserve a 48dp layout/touch footprint even when their
              // visible control is requested smaller. Keep the custom projection visually 44x34,
              // but reserve the same footprint so ordinary/custom skill rows align exactly.
              Box(
                  modifier = Modifier.width(48.dp).heightIn(min = 48.dp, max = 48.dp),
                  contentAlignment = Alignment.Center,
              ) {
                  Surface(
                      modifier = Modifier.width(44.dp).heightIn(min = 34.dp, max = 34.dp),
                      shape = MaterialTheme.shapes.small,
                      border = BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant),
                      color = MaterialTheme.colorScheme.surface,
                  ) {
                      Box(contentAlignment = Alignment.Center) { TrainingGlyphV4(training) }
                  }
              }
          }
          ''',
              'P3 read-only training footprint',
          )
          editor_path.write_text(editor)

          combat_path = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatSuccessorV4.kt')
          combat = combat_path.read_text()
          combat = replace_once(
              combat,
              'import androidx.compose.foundation.layout.fillMaxWidth\n',
              'import androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.heightIn\n',
              'P4 heightIn import',
          )
          combat = replace_once(
              combat,
              '''        Box(modifier = Modifier.weight(0.55f)) {
              OutlinedButton(onClick = { signExpanded = true }, modifier = Modifier.fillMaxWidth()) {
                  Text(if (parsed.negativeDice) "−" else "+")
              }
          ''',
              '''        Box(modifier = Modifier.weight(0.55f)) {
              OutlinedButton(
                  onClick = { signExpanded = true },
                  modifier = Modifier.fillMaxWidth().heightIn(min = 48.dp, max = 48.dp),
                  contentPadding = PaddingValues(horizontal = 4.dp, vertical = 0.dp),
              ) {
                  Text(if (parsed.negativeDice) "−" else "+")
              }
          ''',
              'P4 sign selector',
          )
          combat = replace_once(
              combat,
              '''            modifier = Modifier.weight(0.9f),
              label = { Text("Cant.") },
          ''',
              '''            modifier = Modifier.weight(0.9f).heightIn(min = 48.dp, max = 48.dp),
              label = { Text("Cant.") },
          ''',
              'P4 quantity field',
          )
          combat = replace_once(
              combat,
              '''        Box(modifier = Modifier.weight(1f)) {
              OutlinedButton(onClick = { dieMenuExpanded = true }, modifier = Modifier.fillMaxWidth()) {
                  val sides = parsed.sides.toIntOrNull()
                  Text(if (!otherSides && sides in STANDARD_DIE_SIDES_V4) "d$sides" else "Otro…")
              }
          ''',
              '''        Box(modifier = Modifier.weight(1f)) {
              OutlinedButton(
                  onClick = { dieMenuExpanded = true },
                  modifier = Modifier.fillMaxWidth().heightIn(min = 48.dp, max = 48.dp),
                  contentPadding = PaddingValues(horizontal = 4.dp, vertical = 0.dp),
              ) {
                  val sides = parsed.sides.toIntOrNull()
                  Text(if (!otherSides && sides in STANDARD_DIE_SIDES_V4) "d$sides" else "Otro…")
              }
          ''',
              'P4 die selector',
          )
          combat = replace_once(
              combat,
              '''        OutlinedTextField(
              value = parsed.modifier,
              onValueChange = { value -> updateDraft(parsed.copy(modifier = sanitizeSignedIntegerInputV4(value))) },
              modifier = Modifier.weight(1f),
              label = { Text("Mod.") },
          ''',
              '''        OutlinedTextField(
              value = parsed.modifier,
              onValueChange = { value -> updateDraft(parsed.copy(modifier = sanitizeSignedIntegerInputV4(value))) },
              modifier = Modifier.weight(1f).heightIn(min = 48.dp, max = 48.dp),
              label = { Text("Mod.") },
          ''',
              'P4 modifier field',
          )
          combat = replace_once(
              combat,
              '''            modifier = Modifier.fillMaxWidth(),
              label = { Text("Caras del dado") },
          ''',
              '''            modifier = Modifier.fillMaxWidth().heightIn(min = 48.dp, max = 48.dp),
              label = { Text("Caras del dado") },
          ''',
              'P4 custom die field',
          )
          combat = replace_once(
              combat,
              '''        Box(modifier = Modifier.weight(1f)) {
              OutlinedButton(onClick = { expanded = true }, modifier = Modifier.fillMaxWidth()) {
                  Text(when {
                      customMode -> "Otro…"
                      standard != null -> standard
                      else -> "Tipo de daño"
                  })
              }
          ''',
              '''        Box(modifier = Modifier.weight(1f)) {
              OutlinedButton(
                  onClick = { expanded = true },
                  modifier = Modifier.fillMaxWidth().heightIn(min = 48.dp, max = 48.dp),
                  contentPadding = PaddingValues(horizontal = 6.dp, vertical = 0.dp),
              ) {
                  Text(when {
                      customMode -> "Otro…"
                      standard != null -> standard
                      else -> "Tipo de daño"
                  })
              }
          ''',
              'P4 damage type selector',
          )
          combat = replace_once(
              combat,
              '''                modifier = Modifier.weight(1f),
                  label = { Text("Otro tipo") },
          ''',
              '''                modifier = Modifier.weight(1f).heightIn(min = 48.dp, max = 48.dp),
                  label = { Text("Otro tipo") },
          ''',
              'P4 custom damage type field',
          )
          combat = replace_once(
              combat,
              '''        modifier = Modifier.fillMaxWidth(),
              label = { Text("Daño plano") },
          ''',
              '''        modifier = Modifier.fillMaxWidth().heightIn(min = 48.dp, max = 48.dp),
              label = { Text("Daño plano") },
          ''',
              'P4 flat damage field',
          )
          combat_path.write_text(combat)

          audit_path = Path('docs/checkpoints/2026-09-12_PHASE4A_MATERIAL3_AUDIT_BEFORE_P12.md')
          audit_path.write_text('''# Phase 4A — Material 3 audit before P12

Date: 2026-09-12
Branch: `implementation/phase4a-successor-cycle`
Pre-audit HEAD: `0e7ae6b8e07681273feb4abf952868c33f3e06a9`

## Scope and authority

This checkpoint records the PC-side P1–P11 Material 3 audit requested before P12. It is not DM-side discovery. `Material 3` here means Jetpack Compose `androidx.compose.material3`. The audit compares current production Compose code with the approved Phase 4A repair decisions and distinguishes M3 usage from M3 defaults that actually control unwanted geometry.

## Results

| P | Surface | M3 relevant? | Classification | Action |
|---|---|---|---|---|
| P1 | Canonical HP state across General/Combate/shared state | No material geometry dependency | UNRELATED TO MATERIAL 3 | None. State synchronization is model/wiring work. |
| P2 | `Daño / Curar` operational row | Yes | SAFE WITH CUSTOMIZATION | Explicit compact field height, project spacing and bounded operational layout retained. |
| P3 | Habilidades ordinary/custom rows | Yes | REPAIR RECOMMENDED → REPAIRED | Ordinary M3 `OutlinedButton` reserves a 48dp interactive layout footprint while the custom read-only projection was only 44x34. Custom projection now keeps its 44x34 visible control inside a matching 48dp footprint, preserving current behavior while restoring row alignment. |
| P4 | Structured damage editor | Yes | REPAIR RECOMMENDED → REPAIRED | Stock M3 controls were allowed to impose their default vertical geometry/padding on the compact dice grammar. Relevant dice/type controls are now explicitly constrained to a 48dp compact interaction height and selector padding is reduced. |
| P5 | Combate quick-reference fixed region | Yes, mostly decorative/container | SAFE WITH CUSTOMIZATION | Region sizing, padding and responsive behavior are project-controlled. |
| P6 | Direct drag reorder | Low | SAFE WITH CUSTOMIZATION | Drag geometry is Foundation/pointer/measurement driven; M3 surfaces do not control reorder mechanics. |
| P7 | Provenance/origin editor | Yes | SAFE WITH CUSTOMIZATION | Compact project `BasicTextField`/surface/menu primitives already override the relevant stock field geometry. |
| P8 | Trasfondo photo tile/viewer | Yes, container only | SAFE WITH CUSTOMIZATION | Tile aspect ratio and viewer bounds are explicit; low-level dialog is used where full-screen behavior is needed. |
| P9 | Shared editor sizing / IME-safe editor | Yes | SAFE WITH CUSTOMIZATION | Uses low-level `Dialog(usePlatformDefaultWidth = false)` plus explicit width/height/IME/navigation bounds rather than stock alert-dialog geometry. |
| P10 | Settings density / pseudo-icons | Yes | SAFE WITH CUSTOMIZATION | Density deliberately scales project whitespace while preserving text/icon usability floors; graphical controls replace pseudo-icons. |
| P11 | Theme selector | Yes | SAFE WITH CUSTOMIZATION | Custom surface cards, explicit swatches/selection indicator and responsive 2/3/4-column layout avoid stock selector geometry. |

## Shared-root-cause conclusion

There is no evidence that Material 3 itself should be removed or globally suppressed. The recurring risk is using full stock control geometry where the approved PC surface is intentionally compact. Global disabling of M3 minimum interaction sizing would be unsafe and would contradict P10's usability-floor decision. The durable policy is therefore local: preserve comfortable interaction footprints, but explicitly control visible geometry/padding on compact PC controls.

## Repairs applied before P12

1. P3: aligned the custom-skill training projection with the 48dp layout footprint imposed by the ordinary M3 training selector without enlarging its 44x34 visible glyph surface or changing its read-only ownership semantics.
2. P4: constrained the structured-damage dice/type controls to a 48dp compact interaction height and reduced selector content padding. No damage model, parsing rule, persistence rule, or selector choice changed.

## Verification / remaining QA

Automated verification is required on the resulting repair commit. Physical owner-device QA remains pending and must not be inferred from automation. Particular owner-device checks remain phone-landscape row density, text/label clipping at high font scale, and P3 ordinary/custom visual alignment.

## Continuation point

After this audit-repair commit is green, continue directly with P12: replace the current INFO-mode menu behavior in `CharacterHelpV4` with the approved anchored/floating rich contextual tooltip behavior. P12 owner-device QA remains separate.
''')
          PY

      - name: Commit guarded audit repairs and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatSuccessorV4.kt
          git add docs/checkpoints/2026-09-12_PHASE4A_MATERIAL3_AUDIT_BEFORE_P12.md
          git rm .github/workflows/tmp-phase4a-material3-prep12-audit-repair.yml
          git commit -m "repair: harden P3 P4 compact Material3 geometry"
          git push origin HEAD:implementation/phase4a-successor-cycle
