name: One-time Batch F2 equipment UI

on:
  push:
    branches:
      - implementation/phase4-character-closure

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply guarded F2 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          script = Path('.github/scripts/apply_batch_f2.py')
          text = script.read_text()
          old = '    expected=3,\n)\nreplace_once(\n'
          new = '    expected=1,\n)\nreplace_once(\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one F2 primary guard marker, found {text.count(old)}')
          script.write_text(text.replace(old, new, 1))
          PY
          python .github/scripts/apply_batch_f2.py
          python - <<'PY'
          from pathlib import Path
          path = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt')
          text = path.read_text()
          old = '''            CharacterEquipmentDraftV4(\n                items = stored.inventoryItems,\n                currencies = stored.currencies,\n            ),\n'''
          new = '''            CharacterEquipmentDraftV4(\n                items = stored.inventoryItems,\n                currencies = stored.currencies,\n                inventoryUsage = closureState.inventoryUsage,\n            ),\n'''
          if text.count(old) != 2:
              raise SystemExit(f'Expected two F2 baseline/reset blocks, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Remove one-time scaffolding
        run: rm .github/scripts/apply_batch_f2.py .github/workflows/integrate-batch-f2.yml
      - name: Verify whitespace
        run: git diff --check
      - name: Commit F2 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate Batch F2 equipment and currencies UI'
          git push
