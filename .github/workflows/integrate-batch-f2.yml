name: One-time Batch F2 equipment UI

on:
  push:
    branches:
      - implementation/phase4-character-closure

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply guarded F2 patch
        run: python .github/scripts/apply_batch_f2.py
      - name: Remove one-time scaffolding
        run: rm .github/scripts/apply_batch_f2.py .github/workflows/integrate-batch-f2.yml
      - name: Verify whitespace
        run: git diff --check
      - name: Commit F2 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate Batch F2 equipment and currencies UI'
          git push
