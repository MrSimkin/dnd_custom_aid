name: P7 source integration patch

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/p7-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: "false"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Apply exact P7 source patch
        run: python3 .github/p7_source_patch.py
      - name: Diff sanity
        run: git diff --check && git diff --stat
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Validate patched Kotlin surfaces
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace
      - name: Commit and push source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt
          git commit -m "feat: integrate P7 provenance into Rasgos editor"
          git push origin HEAD:implementation/phase4a-successor-cycle
