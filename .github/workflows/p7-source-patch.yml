name: P7 source integration patch

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/p7-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply P7 Rasgos source integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: "false"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Patch P7 source boundaries
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}\n--- OLD ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          def replace_between(path, start, end, replacement):
              p = Path(path)
              text = p.read_text()
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{path}: start marker not found: {start}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"{path}: end marker not found: {end}")
              p.write_text(text[:start_index] + replacement + text[end_index:])

          editor = "androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt"
          traits = "androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt"

          replace_once(
              editor,
              '''    var traitsDraftJson by rememberSaveable(characterId.toString(), "traits") {
              mutableStateOf(characterTraitsToJsonV4(stored.traits))
          }
          var spellcastingDraftJson by rememberSaveable(characterId.toString(), "spellcasting") {''',
              '''    var traitsDraftJson by rememberSaveable(characterId.toString(), "traits") {
              mutableStateOf(characterTraitsToJsonV4(stored.traits))
          }
          var traitProvenanceDraftJson by rememberSaveable(characterId.toString(), "trait-provenance-p7") {
              mutableStateOf(characterTraitProvenanceToJsonP7V4(successorState.traitProvenance))
          }
          var spellcastingDraftJson by rememberSaveable(characterId.toString(), "spellcasting") {''',
          )
          replace_once(
              editor,
              '''    val backgroundDraft = remember(backgroundDraftJson) { characterBackgroundFromJsonV4(backgroundDraftJson) }
          val traitsDraft = remember(traitsDraftJson) { characterTraitsFromJsonV4(traitsDraftJson) }
          val spellcastingDraft = remember(spellcastingDraftJson) { characterSpellcastingDraftFromJsonV4(spellcastingDraftJson) }''',
              '''    val backgroundDraft = remember(backgroundDraftJson) { characterBackgroundFromJsonV4(backgroundDraftJson) }
          val traitsDraft = remember(traitsDraftJson) { characterTraitsFromJsonV4(traitsDraftJson) }
          val traitProvenanceDraft = remember(traitProvenanceDraftJson) {
              characterTraitProvenanceFromJsonP7V4(traitProvenanceDraftJson)
          }
          val spellcastingDraft = remember(spellcastingDraftJson) { characterSpellcastingDraftFromJsonV4(spellcastingDraftJson) }''',
          )
          replace_once(
              editor,
              '''    val storedBackgroundDraftJson = remember(stored) { characterBackgroundToJsonV4(stored.background) }
          val storedTraitsDraftJson = remember(stored) { characterTraitsToJsonV4(stored.traits) }
          val storedSpellcastingDraftJson = remember(stored) {''',
              '''    val storedBackgroundDraftJson = remember(stored) { characterBackgroundToJsonV4(stored.background) }
          val storedTraitsDraftJson = remember(stored) { characterTraitsToJsonV4(stored.traits) }
          val storedTraitProvenanceDraftJson = remember(successorState.traitProvenance) {
              characterTraitProvenanceToJsonP7V4(successorState.traitProvenance)
          }
          val storedSpellcastingDraftJson = remember(stored) {''',
          )
          replace_once(
              editor,
              '''            backgroundDraftJson != storedBackgroundDraftJson ||
                  traitsDraftJson != storedTraitsDraftJson ||
                  spellcastingDraftJson != storedSpellcastingDraftJson ||''',
              '''            backgroundDraftJson != storedBackgroundDraftJson ||
                  traitsDraftJson != storedTraitsDraftJson ||
                  traitProvenanceDraftJson != storedTraitProvenanceDraftJson ||
                  spellcastingDraftJson != storedSpellcastingDraftJson ||''',
          )
          replace_once(
              editor,
              '''    fun updateTraits(updated: List<io.github.mrsimkin.dndcustomaid.shared.character.CharacterTrait>) {
              traitsDraftJson = characterTraitsToJsonV4(updated)
              savedMessage = null
          }

          fun updateSpellcasting(updated: CharacterSpellcastingDraftV4) {''',
              '''    fun updateTraits(updated: List<io.github.mrsimkin.dndcustomaid.shared.character.CharacterTrait>) {
              traitsDraftJson = characterTraitsToJsonV4(updated)
              savedMessage = null
          }

          fun updateTraitProvenance(
              updated: List<io.github.mrsimkin.dndcustomaid.shared.character.CharacterTraitProvenance>,
          ) {
              traitProvenanceDraftJson = characterTraitProvenanceToJsonP7V4(updated)
              savedMessage = null
          }

          fun updateSpellcasting(updated: CharacterSpellcastingDraftV4) {''',
          )
          replace_once(
              editor,
              '''        val savedSpellcastingProfiles = characterSpellcastingProfilesFromJsonV4(spellcastingProfilesDraftJson)
              .filter { it.sourceId in liveSpellSourceIds }
          pcSettingsContext?.onSuccessorStateChange?.invoke(
              successorState.copy(
                  combatDamage = savedDamageProfiles,
                  spellcastingProfiles = savedSpellcastingProfiles,
              ),
          )
          combatDamageDraftJson = characterCombatDamageProfilesToJsonV4(savedDamageProfiles)
          spellcastingProfilesDraftJson = characterSpellcastingProfilesToJsonV4(savedSpellcastingProfiles)
          val liveTraitIds = stored.traits.mapTo(mutableSetOf()) { it.id }''',
              '''        val savedSpellcastingProfiles = characterSpellcastingProfilesFromJsonV4(spellcastingProfilesDraftJson)
              .filter { it.sourceId in liveSpellSourceIds }
          val liveTraitIds = stored.traits.mapTo(mutableSetOf()) { it.id }
          val savedTraitProvenance = characterTraitProvenanceFromJsonP7V4(traitProvenanceDraftJson)
              .filter { it.traitId in liveTraitIds }
          pcSettingsContext?.onSuccessorStateChange?.invoke(
              successorState.copy(
                  combatDamage = savedDamageProfiles,
                  spellcastingProfiles = savedSpellcastingProfiles,
                  traitProvenance = savedTraitProvenance,
              ),
          )
          combatDamageDraftJson = characterCombatDamageProfilesToJsonV4(savedDamageProfiles)
          spellcastingProfilesDraftJson = characterSpellcastingProfilesToJsonV4(savedSpellcastingProfiles)
          traitProvenanceDraftJson = characterTraitProvenanceToJsonP7V4(savedTraitProvenance)''',
          )
          replace_once(
              editor,
              '''        backgroundDraftJson = characterBackgroundToJsonV4(stored.background)
          traitsDraftJson = characterTraitsToJsonV4(stored.traits)
          spellcastingDraftJson = characterSpellcastingDraftToJsonV4(''',
              '''        backgroundDraftJson = characterBackgroundToJsonV4(stored.background)
          traitsDraftJson = characterTraitsToJsonV4(stored.traits)
          traitProvenanceDraftJson = characterTraitProvenanceToJsonP7V4(savedTraitProvenance)
          spellcastingDraftJson = characterSpellcastingDraftToJsonV4(''',
          )
          replace_once(
              editor,
              '''                        CharacterTabV4.TRAITS -> CharacterTraitsClosureTabV4(
                              traits = traitsDraft,
                              classes = settingsSheet.classes,
                              background = backgroundDraft,
                              closureState = closureState,
                              persistedTraitIds = stored.traits.mapTo(mutableSetOf()) { it.id },
                              resources = stored.resources,
                              onTraitsChange = ::updateTraits,
                              onClosureStateChange = ::persistStructuralClosureState,''',
              '''                        CharacterTabV4.TRAITS -> CharacterTraitsClosureTabV4(
                              traits = traitsDraft,
                              classes = settingsSheet.classes,
                              background = backgroundDraft,
                              successorState = successorState,
                              traitProvenance = traitProvenanceDraft,
                              closureState = closureState,
                              persistedTraitIds = stored.traits.mapTo(mutableSetOf()) { it.id },
                              resources = stored.resources,
                              onTraitsChange = ::updateTraits,
                              onTraitProvenanceChange = ::updateTraitProvenance,
                              onClosureStateChange = ::persistStructuralClosureState,''',
          )

          replace_once(
              traits,
              '''import io.github.mrsimkin.dndcustomaid.shared.character.CharacterQuickAccessKind
          import io.github.mrsimkin.dndcustomaid.shared.character.CharacterResource''',
              '''import io.github.mrsimkin.dndcustomaid.shared.character.CharacterQuickAccessKind
          import io.github.mrsimkin.dndcustomaid.shared.character.CharacterProvenanceKind
          import io.github.mrsimkin.dndcustomaid.shared.character.CharacterSuccessorState
          import io.github.mrsimkin.dndcustomaid.shared.character.CharacterTraitProvenance
          import io.github.mrsimkin.dndcustomaid.shared.character.CharacterResource''',
          )
          replace_once(
              traits,
              '''    background: CharacterBackground,
              closureState: CharacterClosureState,
              persistedTraitIds: Set<Uuid>,
              resources: List<CharacterResource>,
              onTraitsChange: (List<CharacterTrait>) -> Unit,
              onClosureStateChange: (CharacterClosureState) -> Unit,''',
              '''    background: CharacterBackground,
              successorState: CharacterSuccessorState,
              traitProvenance: List<CharacterTraitProvenance>,
              closureState: CharacterClosureState,
              persistedTraitIds: Set<Uuid>,
              resources: List<CharacterResource>,
              onTraitsChange: (List<CharacterTrait>) -> Unit,
              onTraitProvenanceChange: (List<CharacterTraitProvenance>) -> Unit,
              onClosureStateChange: (CharacterClosureState) -> Unit,''',
          )
          replace_once(
              traits,
              '''    var editorOpen by rememberSaveable { mutableStateOf(false) }
              var editingId by rememberSaveable { mutableStateOf<String?>(null) }
              var editorName by rememberSaveable { mutableStateOf("") }
              var editorSource by rememberSaveable { mutableStateOf("") }
              var editorCustomOrigin by rememberSaveable("trait-custom-origin") { mutableStateOf(false) }
              var editorTypeName by rememberSaveable { mutableStateOf(CharacterTraitType.OTHER.name) }
              var editorDescription by rememberSaveable { mutableStateOf("") }''',
              '''    var editorOpen by rememberSaveable { mutableStateOf(false) }
              var editingId by rememberSaveable { mutableStateOf<String?>(null) }
              var editorTraitId by rememberSaveable { mutableStateOf("") }
              var editorName by rememberSaveable { mutableStateOf("") }
              var editorProvenanceJson by rememberSaveable("trait-provenance-p7-editor") { mutableStateOf("") }
              var editorDescription by rememberSaveable { mutableStateOf("") }''',
          )
          replace_once(
              traits,
              '''    fun beginAdd() {
              if (!structuralEditingEnabled) return
              editingId = null
              editorName = ""
              editorSource = ""
              editorCustomOrigin = false
              editorTypeName = CharacterTraitType.OTHER.name
              editorDescription = ""
              editorNotes = ""
              editorMaxUses = ""
              editorSpentUses = "0"
              editorRecovery = ""
              editorActivationName = ""
              editorOpen = true
          }''',
              '''    fun beginAdd() {
              if (!structuralEditingEnabled) return
              val newTraitId = Uuid.random()
              editingId = null
              editorTraitId = newTraitId.toString()
              editorName = ""
              editorProvenanceJson = characterTraitProvenanceToJsonP7V4(
                  listOf(
                      newTraitProvenanceForKindP7V4(
                          traitId = newTraitId,
                          kind = CharacterProvenanceKind.OTHER,
                          classes = classes,
                          successorState = successorState,
                      ),
                  ),
              )
              editorDescription = ""
              editorNotes = ""
              editorMaxUses = ""
              editorSpentUses = "0"
              editorRecovery = ""
              editorActivationName = ""
              editorOpen = true
          }''',
          )
          replace_once(
              traits,
              '''    fun beginEdit(trait: CharacterTrait) {
              if (!structuralEditingEnabled) return
              editingId = trait.id.toString()
              editorName = trait.name
              editorSource = trait.source
              val originOptions = traitOriginOptionsG5(trait.type, classes, background)
              editorCustomOrigin = originOptions.isNotEmpty() && trait.source.isNotBlank() &&
                  originOptions.none { it.label.equals(trait.source.trim(), ignoreCase = true) }
              editorTypeName = trait.type.name
              editorDescription = trait.description
              editorNotes = trait.notes.orEmpty()
              editorMaxUses = trait.maxUses?.toString().orEmpty()
              editorSpentUses = trait.spentUses.toString()
              editorRecovery = trait.recovery.orEmpty()
              editorActivationName = trait.activation?.name.orEmpty()
              editorOpen = true
          }''',
              '''    fun beginEdit(trait: CharacterTrait) {
              if (!structuralEditingEnabled) return
              editingId = trait.id.toString()
              editorTraitId = trait.id.toString()
              editorName = trait.name
              editorProvenanceJson = characterTraitProvenanceToJsonP7V4(
                  listOf(
                      traitProvenanceDraftP7V4(
                          trait = trait,
                          existing = traitProvenance.firstOrNull { it.traitId == trait.id },
                          classes = classes,
                          successorState = successorState,
                      ),
                  ),
              )
              editorDescription = trait.description
              editorNotes = trait.notes.orEmpty()
              editorMaxUses = trait.maxUses?.toString().orEmpty()
              editorSpentUses = trait.spentUses.toString()
              editorRecovery = trait.recovery.orEmpty()
              editorActivationName = trait.activation?.name.orEmpty()
              editorOpen = true
          }''',
          )
          replace_once(
              traits,
              '''    fun duplicate(trait: CharacterTrait) {
              if (!structuralEditingEnabled) return
              val duplicated = duplicateCharacterTrait(
                  source = trait,
                  newId = Uuid.random(),
                  sortOrder = traits.size,
              )
              onTraitsChange(normalize(traits + duplicated))
          }''',
              '''    fun duplicate(trait: CharacterTrait) {
              if (!structuralEditingEnabled) return
              val duplicated = duplicateCharacterTrait(
                  source = trait,
                  newId = Uuid.random(),
                  sortOrder = traits.size,
              )
              val sourceProvenance = traitProvenanceDraftP7V4(
                  trait = trait,
                  existing = traitProvenance.firstOrNull { it.traitId == trait.id },
                  classes = classes,
                  successorState = successorState,
              )
              onTraitsChange(normalize(traits + duplicated))
              onTraitProvenanceChange(
                  traitProvenance.filterNot { it.traitId == duplicated.id } +
                      sourceProvenance.copy(traitId = duplicated.id),
              )
          }''',
          )

          replace_between(
              traits,
              "    if (editorOpen && structuralEditingEnabled) {",
              "    deleteId?.takeIf { structuralEditingEnabled }?.let { id ->",
              '''    if (editorOpen && structuralEditingEnabled) {
              val editorTraitUuid = runCatching { Uuid.parse(editorTraitId) }.getOrElse { Uuid.random() }
              val selectedProvenance = characterTraitProvenanceFromJsonP7V4(editorProvenanceJson)
                  .singleOrNull()
                  ?: newTraitProvenanceForKindP7V4(
                      traitId = editorTraitUuid,
                      kind = CharacterProvenanceKind.OTHER,
                      classes = classes,
                      successorState = successorState,
                  )
              val selectedActivation = editorActivationName.takeIf { it.isNotBlank() }?.let { raw ->
                  runCatching { CharacterActivationType.valueOf(raw) }.getOrNull()
              }
              val parsedMaxUses = editorMaxUses.trim().takeIf { it.isNotEmpty() }?.toIntOrNull()
              val parsedSpentUses = editorSpentUses.trim().toIntOrNull()
              val maxUsesValid = editorMaxUses.isBlank() || (parsedMaxUses != null && parsedMaxUses > 0)
              val spentUsesValid = if (editorMaxUses.isBlank()) {
                  true
              } else {
                  parsedMaxUses != null && parsedSpentUses != null && parsedSpentUses in 0..parsedMaxUses
              }
              val provenanceValid = traitProvenanceIsValidP7V4(selectedProvenance, classes, successorState)
              val valid = editorName.trim().isNotEmpty() && maxUsesValid && spentUsesValid && provenanceValid

              TraitEditorDialogG1(
                  title = if (editingId == null) "Añadir rasgo" else "Editar rasgo",
                  name = editorName,
                  provenance = selectedProvenance,
                  classes = classes,
                  successorState = successorState,
                  description = editorDescription,
                  notes = editorNotes,
                  maxUses = editorMaxUses,
                  spentUses = editorSpentUses,
                  recovery = editorRecovery,
                  activation = selectedActivation,
                  valid = valid,
                  onNameChange = { editorName = it },
                  onProvenanceChange = { updated ->
                      editorProvenanceJson = characterTraitProvenanceToJsonP7V4(listOf(updated))
                  },
                  onDescriptionChange = { editorDescription = it },
                  onNotesChange = { editorNotes = it },
                  onMaxUsesChange = { editorMaxUses = traitUnsignedIntegerG1(it) },
                  onSpentUsesChange = { editorSpentUses = traitUnsignedIntegerG1(it).ifBlank { "0" } },
                  onRecoveryChange = { editorRecovery = it },
                  onActivationChange = { editorActivationName = it?.name.orEmpty() },
                  onDismiss = { editorOpen = false },
                  onApply = {
                      val existing = editingId?.let { id -> traits.firstOrNull { it.id.toString() == id } }
                      val traitId = existing?.id ?: editorTraitUuid
                      val provenance = normalizeTraitProvenanceP7V4(selectedProvenance.copy(traitId = traitId))
                      val maxUses = parsedMaxUses
                      val spentUses = if (maxUses == null) 0 else requireNotNull(parsedSpentUses).coerceIn(0, maxUses)
                      val trait = CharacterTrait(
                          id = traitId,
                          name = editorName.trim(),
                          source = traitProvenanceDisplaySourceP7V4(provenance, classes, successorState),
                          type = traitTypeForProvenanceKindP7V4(provenance.kind),
                          description = editorDescription,
                          notes = editorNotes.trim().takeIf { it.isNotEmpty() },
                          maxUses = maxUses,
                          spentUses = spentUses,
                          recovery = editorRecovery.trim().takeIf { it.isNotEmpty() },
                          activation = selectedActivation,
                          sortOrder = existing?.sortOrder ?: traits.size,
                          pinned = existing?.pinned ?: false,
                      )
                      val updated = if (existing == null) {
                          traits + trait
                      } else {
                          traits.map { item -> if (item.id == existing.id) trait else item }
                      }
                      onTraitsChange(normalize(updated))
                      onTraitProvenanceChange(
                          traitProvenance.filterNot { it.traitId == traitId } + provenance,
                      )
                      editorOpen = false
                  },
              )
          }

          ''',
          )
          replace_once(
              traits,
              '''                onConfirm = {
                      onTraitsChange(normalize(traits.filterNot { it.id == target.id }))
                      haptic(CharacterHapticEventV4.DESTRUCTIVE)
                      deleteId = null
                  },''',
              '''                onConfirm = {
                      onTraitsChange(normalize(traits.filterNot { it.id == target.id }))
                      onTraitProvenanceChange(traitProvenance.filterNot { it.traitId == target.id })
                      haptic(CharacterHapticEventV4.DESTRUCTIVE)
                      deleteId = null
                  },''',
          )

          replace_between(
              traits,
              "@Composable\nprivate fun TraitEditorDialogG1(",
              "@Composable\nprivate fun TraitsResourcesCardG2(",
              '''@Composable
          private fun TraitEditorDialogG1(
              title: String,
              name: String,
              provenance: CharacterTraitProvenance,
              classes: List<CharacterClassLevel>,
              successorState: CharacterSuccessorState,
              description: String,
              notes: String,
              maxUses: String,
              spentUses: String,
              recovery: String,
              activation: CharacterActivationType?,
              valid: Boolean,
              onNameChange: (String) -> Unit,
              onProvenanceChange: (CharacterTraitProvenance) -> Unit,
              onDescriptionChange: (String) -> Unit,
              onNotesChange: (String) -> Unit,
              onMaxUsesChange: (String) -> Unit,
              onSpentUsesChange: (String) -> Unit,
              onRecoveryChange: (String) -> Unit,
              onActivationChange: (CharacterActivationType?) -> Unit,
              onDismiss: () -> Unit,
              onApply: () -> Unit,
          ) {
              var activationMenuOpen by rememberSaveable { mutableStateOf(false) }

              CharacterImeSafeEditorDialog(
                  title = title,
                  onCancel = onDismiss,
                  onSave = onApply,
                  saveEnabled = valid,
              ) {
                  OutlinedTextField(
                      value = name,
                      onValueChange = onNameChange,
                      label = { Text("Nombre") },
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true,
                  )
                  CharacterTraitProvenanceEditorP7V4(
                      provenance = provenance,
                      classes = classes,
                      successorState = successorState,
                      onChange = onProvenanceChange,
                  )
                  Column {
                      Text("Activación", style = MaterialTheme.typography.labelSmall)
                      androidx.compose.foundation.layout.Box {
                          OutlinedButton(onClick = { activationMenuOpen = true }, modifier = Modifier.fillMaxWidth()) {
                              Text(activation?.let(::traitActivationLabelG1) ?: "Sin especificar")
                          }
                          DropdownMenu(expanded = activationMenuOpen, onDismissRequest = { activationMenuOpen = false }) {
                              DropdownMenuItem(
                                  text = { Text("Sin especificar") },
                                  onClick = {
                                      onActivationChange(null)
                                      activationMenuOpen = false
                                  },
                              )
                              CharacterActivationType.entries.forEach { option ->
                                  DropdownMenuItem(
                                      text = { Text(traitActivationLabelG1(option)) },
                                      onClick = {
                                          onActivationChange(option)
                                          activationMenuOpen = false
                                      },
                                  )
                              }
                          }
                      }
                  }
                  OutlinedTextField(
                      value = description,
                      onValueChange = onDescriptionChange,
                      label = { Text("Descripción") },
                      modifier = Modifier.fillMaxWidth(),
                      minLines = characterCompactTextAreaMinLinesV4(2),
                      maxLines = 7,
                  )
                  OutlinedTextField(
                      value = notes,
                      onValueChange = onNotesChange,
                      label = { Text("Notas") },
                      modifier = Modifier.fillMaxWidth(),
                      minLines = characterCompactTextAreaMinLinesV4(2),
                      maxLines = 5,
                  )
                  Row(horizontalArrangement = Arrangement.spacedBy(appSpacingV4(6.dp))) {
                      OutlinedTextField(
                          value = maxUses,
                          onValueChange = onMaxUsesChange,
                          label = { Text("Usos máximos") },
                          modifier = Modifier.weight(1f),
                          singleLine = true,
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                      )
                      OutlinedTextField(
                          value = spentUses,
                          onValueChange = onSpentUsesChange,
                          label = { Text("Gastados") },
                          modifier = Modifier.weight(1f),
                          singleLine = true,
                          enabled = maxUses.isNotBlank(),
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                      )
                  }
                  OutlinedTextField(
                      value = recovery,
                      onValueChange = onRecoveryChange,
                      label = { Text("Recuperación") },
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true,
                  )
                  CharacterInlineValidationMessage(
                      when {
                          name.trim().isEmpty() -> "El nombre no puede quedar vacío."
                          maxUses.isNotBlank() && (maxUses.toIntOrNull() == null || maxUses.toInt() <= 0) ->
                              "Los usos máximos deben ser un entero mayor que 0."
                          maxUses.isNotBlank() &&
                              (spentUses.toIntOrNull() == null || spentUses.toInt() !in 0..(maxUses.toIntOrNull() ?: 0)) ->
                              "Los usos gastados deben estar entre 0 y el máximo."
                          !traitProvenanceIsValidP7V4(provenance, classes, successorState) ->
                              "Selecciona un origen que pertenezca al personaje o conserva una relación anterior no disponible."
                          else -> null
                      },
                  )
              }
          }

          ''',
          )

          for path in (editor, traits):
              data = Path(path).read_text()
              if "editorCustomOrigin" in data or "editorTypeName" in data:
                  raise SystemExit(f"{path}: legacy Trait editor state remains")
          PY
      - name: Diff sanity
        run: git diff --check && git diff --stat
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Validate patched Kotlin surfaces
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace
      - name: Commit and push source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt
          git commit -m "feat: integrate P7 provenance into Rasgos editor"
          git push origin HEAD:implementation/phase4a-successor-cycle
