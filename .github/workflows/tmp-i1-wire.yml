name: I1 one-shot adaptive shell wiring

on:
  push:
    branches:
      - tmp/phase4-i1-adaptive-shell-wire-final4
    paths:
      - .github/workflows/tmp-i1-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-i1-adaptive-shell-wire-final4
          fetch-depth: 0

      - name: Apply anchor-checked I1 wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          main_path = Path("androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/MainActivity.kt")
          main = main_path.read_text()
          main = replace_once(
              main,
              '    private val uiPreferencesStore by lazy { UiPreferencesStore(applicationContext) }\n',
              '    private val uiPreferencesStore by lazy { UiPreferencesStore(applicationContext) }\n'
              '    private val characterNavigationPreferenceStore by lazy { CharacterNavigationPreferenceStore(applicationContext) }\n',
              'main store',
          )
          main = replace_once(
              main,
              '                    characterClosureRepository = characterClosureRepository,\n'
              '                    preferences = preferences,\n',
              '                    characterClosureRepository = characterClosureRepository,\n'
              '                    characterNavigationPreferenceStore = characterNavigationPreferenceStore,\n'
              '                    preferences = preferences,\n',
              'main app invocation',
          )
          main = replace_once(
              main,
              '    characterClosureRepository: CharacterClosureRepository,\n'
              '    preferences: UiPreferences,\n',
              '    characterClosureRepository: CharacterClosureRepository,\n'
              '    characterNavigationPreferenceStore: CharacterNavigationPreferenceStore,\n'
              '    preferences: UiPreferences,\n',
              'main app signature',
          )
          main = replace_once(
              main,
              '                    closureRepository = characterClosureRepository,\n'
              '                    preferences = preferences,\n',
              '                    closureRepository = characterClosureRepository,\n'
              '                    navigationPreferenceStore = characterNavigationPreferenceStore,\n'
              '                    preferences = preferences,\n',
              'editor invocation',
          )
          main_path.write_text(main)

          editor_path = Path("androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt")
          editor = editor_path.read_text()
          editor = replace_once(
              editor,
              'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.getValue\n',
              'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.LaunchedEffect\nimport androidx.compose.runtime.getValue\n',
              'editor LaunchedEffect import',
          )
          editor = replace_once(
              editor,
              '    closureRepository: CharacterClosureRepository,\n'
              '    preferences: UiPreferences,\n',
              '    closureRepository: CharacterClosureRepository,\n'
              '    navigationPreferenceStore: CharacterNavigationPreferenceStore,\n'
              '    preferences: UiPreferences,\n',
              'editor signature',
          )
          editor = replace_once(
              editor,
              '    var selectedTabName by rememberSaveable(characterId.toString()) {\n'
              '        mutableStateOf(CharacterTabV4.OVERVIEW.name)\n'
              '    }\n',
              '    var selectedTabName by rememberSaveable(characterId.toString(), "selected-tab") {\n'
              '        mutableStateOf(\n'
              '            navigationPreferenceStore.loadLastTabName(characterId)\n'
              '                ?: CharacterTabV4.OVERVIEW.name,\n'
              '        )\n'
              '    }\n',
              'selected tab initialization',
          )
          editor = replace_once(
              editor,
              '    val selectedTab = resolvedCharacterTabV4(\n'
              '        savedTabName = selectedTabName,\n'
              '        spellcasterEnabled = stored.spellcasterEnabled,\n'
              '        visibleModules = visibleModules,\n'
              '    )\n'
              '    val savable = draft.toSheetOrNull(stored, blankRequiredAsZero = true) != null\n',
              '    val selectedTab = resolvedCharacterTabV4(\n'
              '        savedTabName = selectedTabName,\n'
              '        spellcasterEnabled = stored.spellcasterEnabled,\n'
              '        visibleModules = visibleModules,\n'
              '    )\n'
              '    LaunchedEffect(characterId, selectedTab.name) {\n'
              '        if (selectedTabName != selectedTab.name) {\n'
              '            selectedTabName = selectedTab.name\n'
              '        }\n'
              '        navigationPreferenceStore.saveLastTabName(characterId, selectedTab.name)\n'
              '    }\n'
              '    val savable = draft.toSheetOrNull(stored, blankRequiredAsZero = true) != null\n',
              'selected tab persistence',
          )
          editor = replace_once(
              editor,
              '                val wide = maxWidth >= 700.dp\n'
              '                Column(modifier = Modifier.fillMaxSize()) {\n'
              '                    EditorHeaderV4(\n'
              '                        characterName = draft.name,\n'
              '                        stored = stored,\n'
              '                        savedMessage = savedMessage,\n'
              '                        hasUnsavedChanges = hasUnsavedChanges,\n'
              '                        savable = savable,\n'
              '                        onBack = ::requestBack,\n'
              '                        onSave = ::save,\n'
              '                        onOpenSettings = { showPcSettings = true },\n'
              '                    )\n'
              '                    CharacterTopTabStripV4(\n'
              '                        selectedTab = selectedTab,\n'
              '                        spellcasterEnabled = stored.spellcasterEnabled,\n'
              '                        visibleModules = visibleModules,\n'
              '                        onSelect = { selectedTabName = it.name },\n'
              '                    )\n'
              '                    when (selectedTab) {\n',
              '                val navigationPresentation = characterNavigationPresentationForWidthV4(maxWidth.value)\n'
              '                val wide = maxWidth >= 700.dp\n'
              '                CharacterAdaptiveShellV4(\n'
              '                    navigationPresentation = navigationPresentation,\n'
              '                    selectedTab = selectedTab,\n'
              '                    spellcasterEnabled = stored.spellcasterEnabled,\n'
              '                    visibleModules = visibleModules,\n'
              '                    onSelect = { selectedTabName = it.name },\n'
              '                    header = {\n'
              '                        EditorHeaderV4(\n'
              '                            characterName = draft.name,\n'
              '                            stored = stored,\n'
              '                            savedMessage = savedMessage,\n'
              '                            hasUnsavedChanges = hasUnsavedChanges,\n'
              '                            savable = savable,\n'
              '                            onBack = ::requestBack,\n'
              '                            onSave = ::save,\n'
              '                            onOpenSettings = { showPcSettings = true },\n'
              '                        )\n'
              '                    },\n'
              '                ) {\n'
              '                    when (selectedTab) {\n',
              'adaptive shell opening',
          )
          editor_path.write_text(editor)

          nav_path = Path("androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterNavigationStateV4.kt")
          nav = nav_path.read_text()
          nav = replace_once(
              nav,
              'internal const val CHARACTER_NAVIGATION_RAIL_MIN_WIDTH_DP = 840f\n',
              'internal const val CHARACTER_NAVIGATION_RAIL_MIN_WIDTH_DP = 900f\n',
              'rail width threshold',
          )
          nav_path.write_text(nav)
          PY

      - name: Commit one-shot product change
        shell: bash
        run: |
          rm .github/workflows/tmp-i1-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/MainActivity.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterNavigationStateV4.kt \
                  .github/workflows/tmp-i1-wire.yml
          git diff --cached --check
          git commit -m "feat: wire I1 adaptive shell and last-tab restoration"
          git push origin HEAD:tmp/phase4-i1-adaptive-shell-wire-final4
