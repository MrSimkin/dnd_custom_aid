name: F repair residual audit once

on:
  push:
    paths:
      - '.github/workflows/f-repair-residual-audit-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Audit repaired F invariants and residual density patterns
        run: python3 .github/f-repair-residual-audit-once.py
      - name: Record audit and self-remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/f-repair-residual-audit-once.yml
          rm .github/f-repair-residual-audit-once.py
          git add .github/workflows/f-repair-residual-audit-once.yml .github/f-repair-residual-audit-once.py
          git commit -m 'chore: complete F repair residual audit'
          git push
