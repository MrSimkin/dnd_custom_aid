name: Phase4A P14 transition back guard

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/phase4a-p14-back-guard.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - name: Guard background Back handlers during Table Mode transition
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt"); t=p.read_text(); a="BackHandler(enabled = !showSupercompact && showPcSettings)"; b="BackHandler(enabled = !showSupercompact && showPcSettings && !confirmTableModeTransition)"; assert t.count(a)==1, t.count(a); t=t.replace(a,b,1); a="enabled = !showSupercompact && !showPcSettings && !confirmUnsavedLeave && !confirmBlankNumbers && !confirmDisableSpellcasting,"; b="enabled = !showSupercompact && !showPcSettings && !confirmUnsavedLeave && !confirmBlankNumbers && !confirmDisableSpellcasting && !confirmTableModeTransition,"; assert t.count(a)==1, t.count(a); p.write_text(t.replace(a,b,1))'
          git diff --check
      - name: Commit repair and remove helper
        shell: bash
        run: |
          rm .github/workflows/phase4a-p14-back-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: guard P14 transition navigation"
          git push origin HEAD:implementation/phase4a-successor-cycle
