name: One-time advance project state to Batch E

on:
  push:
    branches:
      - implementation/phase4-character-closure
    paths:
      - .github/workflows/advance-project-state-batch-e.yml

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4-character-closure
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Advance PROJECT_STATE
        run: python scripts/advance_project_state_to_batch_e.py
      - name: Remove one-time scaffolding
        run: |
          rm scripts/advance_project_state_to_batch_e.py
          rm .github/workflows/advance-project-state-batch-e.yml
      - name: Verify whitespace
        run: git diff --check
      - name: Commit project state advance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: advance Phase 4 execution to Batch E"
          git push origin HEAD:implementation/phase4-character-closure
