name: I2b2a guarded transition and read-only patch

on:
  push:
    branches:
      - tmp/phase4-i2b-table-mode
    paths:
      - .github/workflows/tmp-i2b2a-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-i2b-table-mode
          fetch-depth: 0
      - name: Apply guarded I2b2a patch
        shell: bash
        run: python .github/i2b2a_patch.py
      - name: Commit product patch and remove helpers
        shell: bash
        run: |
          rm .github/i2b2a_patch.py .github/workflows/tmp-i2b2a-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterPcSettingsClosureV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterNotesTabV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterBackgroundTabV4.kt \
                  .github/i2b2a_patch.py .github/workflows/tmp-i2b2a-apply.yml
          git diff --cached --check
          git commit -m "feat: harden Table mode transition and read-only surfaces"
          git push origin HEAD:tmp/phase4-i2b-table-mode
