name: Reorder migration once

on:
  push:
    paths:
      - '.github/workflows/reorder-migration-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Migrate audited card reorder implementations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android')

          def function_span(text: str, name: str):
              marker = f'private fun {name}('
              start = text.index(marker)
              comp = text.rfind('@Composable', 0, start)
              if comp >= 0 and start - comp < 40:
                  start = comp
              nxt = text.find('\n@Composable\n', start + 12)
              if nxt < 0:
                  nxt = len(text)
              return start, nxt

          def remove_line_matching(block: str, pattern: str):
              return re.sub(r'^.*' + pattern + r'.*\n', '', block, flags=re.MULTILINE)

          def remove_stable_handle(block: str):
              idx = block.find('StableDragHandle(')
              if idx < 0:
                  raise RuntimeError('StableDragHandle not found')
              line_start = block.rfind('\n', 0, idx) + 1
              prev_end = line_start - 1
              prev_start = block.rfind('\n', 0, prev_end) + 1
              prev = block[prev_start:prev_end].strip()
              wrapped = prev.startswith('if (') and prev.endswith('{')
              start = prev_start if wrapped else line_start

              depth = 0
              in_string = False
              escaped = False
              seen = False
              end_call = None
              for i in range(idx, len(block)):
                  ch = block[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                      continue
                  if ch == '(':
                      depth += 1
                      seen = True
                  elif ch == ')':
                      depth -= 1
                      if seen and depth == 0:
                          end_call = i + 1
                          break
              if end_call is None:
                  raise RuntimeError('Could not balance StableDragHandle call')
              end = block.find('\n', end_call)
              end = len(block) if end < 0 else end + 1
              if wrapped:
                  m = re.match(r'\s*}\s*\n?', block[end:])
                  if not m:
                      raise RuntimeError('Expected closing brace after StableDragHandle')
                  end += m.end()
              return block[:start] + block[end:]

          def replace_call(block: str, call_name: str, replacement: str):
              idx = block.find(call_name + '(')
              if idx < 0:
                  raise RuntimeError(f'{call_name} not found')
              depth = 0
              in_string = False
              escaped = False
              seen = False
              end = None
              for i in range(idx + len(call_name), len(block)):
                  ch = block[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                      continue
                  if ch == '(':
                      depth += 1
                      seen = True
                  elif ch == ')':
                      depth -= 1
                      if seen and depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise RuntimeError(f'Could not balance {call_name}')
              return block[:idx] + replacement + block[end:]

          def migrate_direct(path: str, function_name: str, enabled: str):
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              s, e = function_span(text, function_name)
              block = text[s:e]
              block = remove_line_matching(block, r'val reorderStepPx = ')
              block = remove_stable_handle(block)
              needle = '.characterDragFeedbackV4(dragState)'
              if needle not in block:
                  raise RuntimeError(f'{path}/{function_name}: drag feedback insertion point absent')
              replacement = f'''.characterMeasuredReorderDragV4(\n                    enabled = {enabled},\n                    onHaptic = onHaptic,\n                    onMove = onMove,\n                    onVisualStateChange = {{ state ->\n                        dragging = state.active\n                        accumulatedDrag = state.offsetY\n                    }},\n                )\n                {needle}'''
              block = block.replace(needle, replacement, 1)
              text = text[:s] + block + text[e:]
              p.write_text(text, encoding='utf-8')

          direct = [
              ('CharacterArtificeModuleV4.kt', 'ArtificeRowH1', 'reorderEnabled'),
              ('CharacterClassOptionModulesV4.kt', 'ClassOptionRowH2', 'reorderEnabled'),
              ('CharacterCombatTabV4.kt', 'CombatEntryCardV4', 'structuralEditingEnabled'),
              ('CharacterCompanionsModuleV4.kt', 'CompanionRowH3', 'reorderEnabled'),
              ('CharacterEquipmentClosureV4.kt', 'EquipmentDenseItemF2', 'canReorder'),
              ('CharacterFormsModuleV4.kt', 'FormRowH1', 'reorderEnabled'),
              ('CharacterSpellListClosureV4.kt', 'SpellRowG2', 'reorderEnabled'),
              ('CharacterTraitsClosureV4.kt', 'TraitCardG1', 'canReorder'),
          ]
          for spec in direct:
              migrate_direct(*spec)

          # Existing shared-primitive users still used fixed dp thresholds and while loops.
          for path, function_name, enabled in [
              ('CharacterCombatSuccessorV4.kt', 'CharacterCombatSuccessorCardV4', 'structuralEditingEnabled'),
              ('CharacterNotesTabV4.kt', 'CharacterNoteCardV4', 'structuralEditingEnabled'),
          ]:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              s, e = function_span(text, function_name)
              block = text[s:e]
              block = remove_line_matching(block, r'val (stepPx|reorderStepPx) = ')
              measured = f'''characterMeasuredReorderDragV4(\n                                enabled = {enabled},\n                                onHaptic = onHaptic,\n                                onMove = onMove,\n                                onVisualStateChange = {{ state ->\n                                    dragging = state.active\n                                    accumulatedDrag = state.offsetY\n                                }},\n                            )'''
              block = replace_call(block, 'characterLongPressDragV4', measured)
              text = text[:s] + block + text[e:]
              p.write_text(text, encoding='utf-8')

          # Spell-source manager: thread the existing character haptic setting and make the row itself draggable.
          p = ROOT / 'CharacterSpellsTabV4.kt'
          text = p.read_text(encoding='utf-8')
          anchor = '    val selectedSource = selectedSourceId?.let { selectedId ->\n'
          if 'val sourceManagerHaptic = rememberCharacterHapticHookV4(hapticsEnabled)' not in text:
              text = text.replace(anchor, '    val sourceManagerHaptic = rememberCharacterHapticHookV4(hapticsEnabled)\n\n' + anchor, 1)
          text = text.replace(
              '            onDismiss = { managerOpen = false },\n        )',
              '            onDismiss = { managerOpen = false },\n            onHaptic = sourceManagerHaptic,\n        )',
              1,
          )
          text = text.replace(
              '    onDelete: (CharacterSpellcastingSource) -> Unit,\n    onDismiss: () -> Unit,\n)',
              '    onDelete: (CharacterSpellcastingSource) -> Unit,\n    onDismiss: () -> Unit,\n    onHaptic: (CharacterHapticEventV4) -> Unit,\n)',
              1,
          )
          text = text.replace(
              '                            onDelete = { onDelete(source) },\n                        )',
              '                            onDelete = { onDelete(source) },\n                            onHaptic = onHaptic,\n                        )',
              1,
          )
          text = text.replace(
              '    onEdit: () -> Unit,\n    onDelete: () -> Unit,\n) {\n    var accumulatedDrag by remember(source.id)',
              '    onEdit: () -> Unit,\n    onDelete: () -> Unit,\n    onHaptic: (CharacterHapticEventV4) -> Unit,\n) {\n    var accumulatedDrag by remember(source.id)',
              1,
          )
          s, e = function_span(text, 'SourceManagerRowV4')
          block = text[s:e]
          block = remove_line_matching(block, r'val reorderStepPx = ')
          block = remove_stable_handle(block)
          old = '''        modifier = Modifier\n            .fillMaxWidth()\n            .clickable(onClick = onEdit),'''
          new = '''        modifier = Modifier\n            .fillMaxWidth()\n            .characterMeasuredReorderDragV4(\n                enabled = true,\n                onHaptic = onHaptic,\n                onMove = onMove,\n                onVisualStateChange = { state ->\n                    dragging = state.active\n                    accumulatedDrag = state.offsetY\n                },\n            )\n            .characterDragFeedbackV4(\n                CharacterDragVisualStateV4(\n                    active = dragging,\n                    offsetY = accumulatedDrag,\n                    showDropBefore = dragging && accumulatedDrag < 0f,\n                    showDropAfter = dragging && accumulatedDrag > 0f,\n                ),\n            )\n            .clickable(onClick = onEdit),'''
          if old not in block:
              raise RuntimeError('SourceManagerRowV4 surface insertion point absent')
          block = block.replace(old, new, 1)
          text = text[:s] + block + text[e:]
          p.write_text(text, encoding='utf-8')

          # No feature card may keep a direct detector or visible drag handle after migration.
          offenders = []
          for p in sorted(ROOT.glob('*.kt')):
              if p.name in {'CharacterCardInteractionV4.kt', 'IconControls.kt'}:
                  continue
              t = p.read_text(encoding='utf-8')
              if 'detectDragGesturesAfterLongPress' in t or 'StableDragHandle(' in t:
                  offenders.append(p.name)
          if offenders:
              raise RuntimeError('Legacy drag implementations remain: ' + ', '.join(offenders))
          PY
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Compile migrated Android UI
        run: gradle :androidApp:compileDebugKotlin --stacktrace
      - name: Commit migration and self-remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/reorder-migration-once.yml
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android .github/workflows/reorder-migration-once.yml
          git commit -m 'fix: migrate cards to measured whole-card reorder'
          git push
