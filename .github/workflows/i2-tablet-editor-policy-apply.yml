name: Increment I2 tablet editor policy

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/i2-tablet-editor-policy-apply.yml

permissions:
  contents: write

jobs:
  apply-i2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Guard I2 source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/i2-tablet-editor-policy-apply.yml"
          test "$(git rev-parse HEAD^:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt)" = "205b23d8e5cd5581ef263f9c67a09e8ec18c2704"
          test "$(git rev-parse HEAD^:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt)" = "8c0464c33650de944507629fdc18d7243b1b1c86"
          test "$(git rev-parse HEAD^:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterArtificeModuleV4.kt)" = "414524a1d61553a68a14430e7ac3f2546cbf69f7"
          test "$(git rev-parse HEAD^:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterFormsModuleV4.kt)" = "c8cbf7d8c6571afd24ae77d7c9a00ea4d4dffddc"
          test "$(git rev-parse HEAD^:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterClassOptionModulesV4.kt)" = "5703126320dc52525cd57a2ccc87fcf2255729a9"
          test "$(git rev-parse HEAD^:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCompanionsModuleV4.kt)" = "890689f6f803a996e9a024145748e4421040d8f2"
      - name: Apply tablet editor visibility policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          base = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android')
          simple = [
              'CharacterSpellListClosureV4.kt',
              'CharacterArtificeModuleV4.kt',
              'CharacterFormsModuleV4.kt',
              'CharacterClassOptionModulesV4.kt',
              'CharacterCompanionsModuleV4.kt',
          ]
          needle = '    if (wide) {\n        Row('
          replacement = '''    val sideEditorVisible = wide && editorOpen && structuralEditingEnabled &&
              characterLayoutContextV4().formFactor == CharacterFormFactorV4.TABLET_LANDSCAPE

          if (sideEditorVisible) {
              Row('''
          for name in simple:
              path = base / name
              text = path.read_text()
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one wide editor branch, found {count}')
              path.write_text(text.replace(needle, replacement, 1))

          path = base / 'CharacterEquipmentClosureV4.kt'
          text = path.read_text()
          anchor = '    val equippedItems = draft.items.filter { it.equipped }.sortedBy { it.sortOrder }\n'
          if text.count(anchor) != 1:
              raise SystemExit('Equipment: equippedItems anchor mismatch')
          text = text.replace(
              anchor,
              anchor + '    val sideEditorVisible = wide && editorOpen && structuralEditingEnabled &&\n' +
              '        characterLayoutContextV4().formFactor == CharacterFormFactorV4.TABLET_LANDSCAPE\n',
              1,
          )
          replacements = {
              'horizontalArrangement = Arrangement.spacedBy(appSpacingV4(if (wide) 8.dp else 0.dp)),':
                  'horizontalArrangement = Arrangement.spacedBy(appSpacingV4(if (sideEditorVisible) 8.dp else 0.dp)),',
              'modifier = if (wide) Modifier.weight(1f).fillMaxHeight() else Modifier.fillMaxSize(),':
                  'modifier = if (sideEditorVisible) Modifier.weight(1f).fillMaxHeight() else Modifier.fillMaxSize(),',
              '        if (wide && structuralEditingEnabled) {\n            EquipmentEditorPanelF3(':
                  '        if (sideEditorVisible) {\n            EquipmentEditorPanelF3(',
              '    if (editorOpen && !wide && structuralEditingEnabled) {':
                  '    if (editorOpen && !sideEditorVisible && structuralEditingEnabled) {',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Equipment: expected one occurrence of {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Guard I2 product diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterArtificeModuleV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterClassOptionModulesV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCompanionsModuleV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterFormsModuleV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt | sort)"
          test "$changed" = "$expected"
      - name: Focused compile and shared tests
        run: gradle :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit I2 product and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/i2-tablet-editor-policy-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterArtificeModuleV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterClassOptionModulesV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCompanionsModuleV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterFormsModuleV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt \
                  .github/workflows/i2-tablet-editor-policy-apply.yml
          git commit -m 'feat: make tablet detail panes contextual in Increment I2'
          git push origin HEAD:implementation/phase4a-successor-cycle
