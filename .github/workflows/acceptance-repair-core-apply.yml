name: Owner acceptance core repair

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/acceptance-repair-core-apply.yml

permissions:
  contents: write

jobs:
  apply-core-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Guard acceptance boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "21bad8d90ca319f2a4a65ca51e08c3b4df6c528f"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/acceptance-repair-core-apply.yml"
          test "$(git rev-parse HEAD^:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterHelpProvenanceV4.kt)" = "182ca6f6975ec79bc12d283e97ee779345f3a576"
          test "$(git rev-parse HEAD^:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt)" = "5c849a57ab7b860eef63223d3b279673382e6d4a"
          test "$(git rev-parse HEAD^:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterNotesTabV4.kt)" = "a6b8db503d9f10bdf2763af0e9142008cafe27dc"
          test "$(git rev-parse HEAD^:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt)" = "8f3368249340b45f5df38eaf8bb05489952d1da8"
          test "$(git rev-parse HEAD^:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCollectionPrimitivesV4.kt)" = "af0cb9b085da4815485a6f78dc553471368ca628"
          test "$(git rev-parse HEAD^:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt)" = "c9802af364ae7c50c59a53f431907903e370fb8a"
      - name: Apply source and linear reorder repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          provenance = 'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterHelpProvenanceV4.kt'
          replace_once(provenance,
          '''    onOriginKeyChange: (String?) -> Unit,
              onCustomOriginChange: (String) -> Unit,
              modifier: Modifier = Modifier,
              allowedTypes: List<CharacterOriginTypeV4> = CharacterOriginTypeV4.entries,
          ) {''',
          '''    onOriginKeyChange: (String?) -> Unit,
              onCustomOriginChange: (String) -> Unit,
              modifier: Modifier = Modifier,
              allowedTypes: List<CharacterOriginTypeV4> = CharacterOriginTypeV4.entries,
              allowCustomOriginOption: Boolean = false,
              customOriginSelected: Boolean = false,
              onCustomOriginSelectedChange: (Boolean) -> Unit = {},
          ) {''')
          replace_once(provenance,
          '''                                    onOriginTypeChange(option)
                                              onOriginKeyChange(null)
                                          }
                                          typeMenuOpen = false''',
          '''                                    onOriginTypeChange(option)
                                              onOriginKeyChange(null)
                                              onCustomOriginSelectedChange(false)
                                          }
                                          typeMenuOpen = false''')
          replace_once(provenance,
          '''            if (originType == CharacterOriginTypeV4.OTHER || options.isEmpty()) {''',
          '''            if (
                  originType == CharacterOriginTypeV4.OTHER ||
                  options.isEmpty() ||
                  (allowCustomOriginOption && customOriginSelected)
              ) {''')
          replace_once(provenance,
          '''                                onClick = {
                                          onOriginKeyChange(option.key)
                                          originMenuOpen = false
                                      },
                                  )
                              }
                          }
                      }
                  }
              }
          }''',
          '''                                onClick = {
                                          onCustomOriginSelectedChange(false)
                                          onOriginKeyChange(option.key)
                                          originMenuOpen = false
                                      },
                                  )
                              }
                              if (allowCustomOriginOption) {
                                  DropdownMenuItem(
                                      text = { Text("Personalizado…") },
                                      onClick = {
                                          onOriginKeyChange(null)
                                          onCustomOriginChange("")
                                          onCustomOriginSelectedChange(true)
                                          originMenuOpen = false
                                      },
                                  )
                              }
                          }
                      }
                  }
              }
          }''')

          collection = 'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCollectionPrimitivesV4.kt'
          replace_once(collection,
          '''@Composable
          private fun CharacterCompactSearchV4(''',
          '''@Composable
          internal fun CharacterLinearReorderModeControlV4(
              active: Boolean,
              onToggle: () -> Unit,
              modifier: Modifier = Modifier,
          ) {
              CharacterToolbarChipV4(
                  text = if (active) "Listo" else "Reordenar",
                  selected = active,
                  onClick = onToggle,
                  modifier = modifier,
              )
          }

          @Composable
          private fun CharacterCompactSearchV4(''')

          traits = 'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt'
          replace_once(traits,
          '''import io.github.mrsimkin.dndcustomaid.shared.character.CharacterClosureState
          import io.github.mrsimkin.dndcustomaid.shared.character.CharacterCollectionQuery''',
          '''import io.github.mrsimkin.dndcustomaid.shared.character.CharacterBackground
          import io.github.mrsimkin.dndcustomaid.shared.character.CharacterClassLevel
          import io.github.mrsimkin.dndcustomaid.shared.character.CharacterClosureState
          import io.github.mrsimkin.dndcustomaid.shared.character.CharacterCollectionQuery''')
          replace_once(traits,
          '''internal fun CharacterTraitsClosureTabV4(
              traits: List<CharacterTrait>,
              closureState: CharacterClosureState,''',
          '''internal fun CharacterTraitsClosureTabV4(
              traits: List<CharacterTrait>,
              classes: List<CharacterClassLevel>,
              background: CharacterBackground,
              closureState: CharacterClosureState,''')
          replace_once(traits,
          '''    var groupingName by rememberSaveable { mutableStateOf(CharacterTraitGrouping.TYPE.name) }

              var editorOpen''',
          '''    var groupingName by rememberSaveable { mutableStateOf(CharacterTraitGrouping.TYPE.name) }
              var reorderMode by rememberSaveable("trait-linear-reorder") { mutableStateOf(false) }

              var editorOpen''')
          replace_once(traits,
          '''    var editorSource by rememberSaveable { mutableStateOf("") }
              var editorTypeName''',
          '''    var editorSource by rememberSaveable { mutableStateOf("") }
              var editorCustomOrigin by rememberSaveable("trait-custom-origin") { mutableStateOf(false) }
              var editorTypeName''')
          replace_once(traits,
          '''    val groups = groupCharacterTraits(visibleTraits, grouping)
              val canReorder = structuralEditingEnabled && query.searchText.isBlank() && query.activeFilterKeys.isEmpty()

              fun updateQuery(updated: CharacterCollectionQuery) {
                  searchText = updated.searchText
                  activeFiltersText = updated.activeFilterKeys.sorted().joinToString(TRAIT_FILTER_SEPARATOR_G1)
              }''',
          '''    val groups = groupCharacterTraits(visibleTraits, grouping)
              val reorderAvailable = structuralEditingEnabled && query.searchText.isBlank() && query.activeFilterKeys.isEmpty()
              val canReorder = reorderAvailable && reorderMode

              fun updateQuery(updated: CharacterCollectionQuery) {
                  reorderMode = false
                  searchText = updated.searchText
                  activeFiltersText = updated.activeFilterKeys.sorted().joinToString(TRAIT_FILTER_SEPARATOR_G1)
              }''')
          replace_once(traits,
          '''        editorSource = ""
                  editorTypeName = CharacterTraitType.OTHER.name''',
          '''        editorSource = ""
                  editorCustomOrigin = false
                  editorTypeName = CharacterTraitType.OTHER.name''')
          replace_once(traits,
          '''        editorSource = trait.source
                  editorTypeName = trait.type.name''',
          '''        editorSource = trait.source
                  val originOptions = traitOriginOptionsG5(trait.type, classes, background)
                  editorCustomOrigin = originOptions.isNotEmpty() && trait.source.isNotBlank() &&
                      originOptions.none { it.label.equals(trait.source.trim(), ignoreCase = true) }
                  editorTypeName = trait.type.name''')
          replace_once(traits,
          '''                    TraitGroupingControlsG1(
                              grouping = grouping,
                              onGroupingChange = { groupingName = it.name },
                          )
                          if (!canReorder && visibleTraits.isNotEmpty()) {''',
          '''                    TraitGroupingControlsG1(
                              grouping = grouping,
                              onGroupingChange = {
                                  reorderMode = false
                                  groupingName = it.name
                              },
                          )
                          if (reorderAvailable && visibleTraits.size > 1) {
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                                  CharacterLinearReorderModeControlV4(
                                      active = reorderMode,
                                      onToggle = { reorderMode = !reorderMode },
                                  )
                              }
                              if (reorderMode) {
                                  CharacterHelpV4("Reordenación lineal: una columna temporal usa el arrastre vertical estable. Pulsa Listo para volver a tus columnas.")
                              }
                          }
                          if (!reorderAvailable && visibleTraits.isNotEmpty()) {''')
          replace_once(traits,
          '''                        val columns = constrainedCardColumnsV4(wide = wide, phoneMax = 2, wideMax = 4)''',
          '''                        val columns = if (reorderMode) 1 else constrainedCardColumnsV4(wide = wide, phoneMax = 2, wideMax = 4)''')
          replace_once(traits,
          '''            name = editorName,
                      source = editorSource,
                      type = selectedType,''',
          '''            name = editorName,
                      source = editorSource,
                      type = selectedType,
                      originOptionsForType = { originType ->
                          traitOriginOptionsG5(traitTypeForOriginG2(originType), classes, background)
                      },
                      customOriginSelected = editorCustomOrigin,''')
          replace_once(traits,
          '''            onNameChange = { editorName = it },
                      onSourceChange = { editorSource = it },
                      onTypeChange = { editorTypeName = it.name },''',
          '''            onNameChange = { editorName = it },
                      onSourceChange = { editorSource = it },
                      onCustomOriginSelectedChange = { editorCustomOrigin = it },
                      onTypeChange = {
                          editorTypeName = it.name
                          editorSource = ""
                          editorCustomOrigin = false
                      },''')
          replace_once(traits,
          '''    source: String,
              type: CharacterTraitType,
              description: String,''',
          '''    source: String,
              type: CharacterTraitType,
              originOptionsForType: (CharacterOriginTypeV4) -> List<CharacterOriginOptionV4>,
              customOriginSelected: Boolean,
              description: String,''')
          replace_once(traits,
          '''    onNameChange: (String) -> Unit,
              onSourceChange: (String) -> Unit,
              onTypeChange: (CharacterTraitType) -> Unit,''',
          '''    onNameChange: (String) -> Unit,
              onSourceChange: (String) -> Unit,
              onCustomOriginSelectedChange: (Boolean) -> Unit,
              onTypeChange: (CharacterTraitType) -> Unit,''')
          replace_once(traits,
          '''        CharacterProvenanceRowV4(
                  originType = traitOriginTypeG2(type),
                  originKey = null,
                  customOrigin = source,
                  optionsForType = { emptyList() },
                  onOriginTypeChange = { onTypeChange(traitTypeForOriginG2(it)) },
                  onOriginKeyChange = {},
                  onCustomOriginChange = onSourceChange,''',
          '''        val originType = traitOriginTypeG2(type)
                  val originOptions = originOptionsForType(originType)
                  val originKey = originOptions.firstOrNull { option ->
                      option.label.equals(source.trim(), ignoreCase = true)
                  }?.key
                  CharacterProvenanceRowV4(
                  originType = originType,
                  originKey = originKey,
                  customOrigin = source,
                  optionsForType = originOptionsForType,
                  onOriginTypeChange = { onTypeChange(traitTypeForOriginG2(it)) },
                  onOriginKeyChange = { key ->
                      originOptionsForType(originType)
                          .firstOrNull { it.key == key }
                          ?.let { onSourceChange(it.label) }
                  },
                  onCustomOriginChange = onSourceChange,
                  allowCustomOriginOption = true,
                  customOriginSelected = customOriginSelected || (source.isNotBlank() && originKey == null),
                  onCustomOriginSelectedChange = onCustomOriginSelectedChange,''')
          # Insert helper before filters.
          replace_once(traits,
          '''private fun traitFiltersG1(''',
          '''private fun traitOriginOptionsG5(
              type: CharacterTraitType,
              classes: List<CharacterClassLevel>,
              background: CharacterBackground,
          ): List<CharacterOriginOptionV4> = when (type) {
              CharacterTraitType.CLASS -> classes
                  .sortedBy { it.sortOrder }
                  .mapNotNull { classLevel ->
                      classLevel.name.trim().takeIf(String::isNotEmpty)?.let { name ->
                          CharacterOriginOptionV4("class:${classLevel.id}", name)
                      }
                  }
                  .distinctBy { it.label.lowercase() }
              CharacterTraitType.SPECIES_RACE -> background.race.trim().takeIf(String::isNotEmpty)
                  ?.let { listOf(CharacterOriginOptionV4("race", it)) }
                  .orEmpty()
              CharacterTraitType.BACKGROUND -> background.name.trim().takeIf(String::isNotEmpty)
                  ?.let { listOf(CharacterOriginOptionV4("background", it)) }
                  .orEmpty()
              CharacterTraitType.FEAT,
              CharacterTraitType.GIFT_BLESSING,
              CharacterTraitType.OTHER,
              -> emptyList()
          }

          private fun traitFiltersG1(''')

          editor = 'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt'
          replace_once(editor,
          '''                        CharacterTabV4.TRAITS -> CharacterTraitsClosureTabV4(
                              traits = traitsDraft,
                              closureState = closureState,''',
          '''                        CharacterTabV4.TRAITS -> CharacterTraitsClosureTabV4(
                              traits = traitsDraft,
                              classes = draft.classes,
                              background = backgroundDraft,
                              closureState = closureState,''')

          notes = 'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterNotesTabV4.kt'
          replace_once(notes,
          '''    var orderName by rememberSaveable("note-order") { mutableStateOf(CharacterPresentationOrder.MANUAL.name) }
              var editorOpen''',
          '''    var orderName by rememberSaveable("note-order") { mutableStateOf(CharacterPresentationOrder.MANUAL.name) }
              var reorderMode by rememberSaveable("note-linear-reorder") { mutableStateOf(false) }
              var editorOpen''')
          replace_once(notes,
          '''    val visibleCards = presentCharacterNotes(draft.cards, order, query)
              val canReorder = structuralEditingEnabled && order == CharacterPresentationOrder.MANUAL &&
                  query.searchText.isBlank() && query.activeFilterKeys.isEmpty()
              val noteColumns = constrainedCardColumnsV4(wide = wide, phoneMax = 2, wideMax = 4)''',
          '''    val visibleCards = presentCharacterNotes(draft.cards, order, query)
              val reorderAvailable = structuralEditingEnabled && order == CharacterPresentationOrder.MANUAL &&
                  query.searchText.isBlank() && query.activeFilterKeys.isEmpty()
              val canReorder = reorderAvailable && reorderMode
              val noteColumns = if (reorderMode) 1 else constrainedCardColumnsV4(wide = wide, phoneMax = 2, wideMax = 4)''')
          replace_once(notes,
          '''    fun updateQuery(updated: CharacterCollectionQuery) {
                  searchText = updated.searchText''',
          '''    fun updateQuery(updated: CharacterCollectionQuery) {
                  reorderMode = false
                  searchText = updated.searchText''')
          replace_once(notes,
          '''            onOrderChange = { orderName = it.name },''',
          '''            onOrderChange = {
                      reorderMode = false
                      orderName = it.name
                  },''')
          replace_once(notes,
          '''        item(key = "titled-notes-help") {
                  Column(verticalArrangement = Arrangement.spacedBy(appSpacingV4(3.dp))) {
                      CharacterHelpV4("Tarjetas opcionales para separar referencias concretas. La búsqueda revisa título y contenido.")
                      if (!canReorder && visibleCards.isNotEmpty()) {''',
          '''        item(key = "titled-notes-help") {
                  Column(verticalArrangement = Arrangement.spacedBy(appSpacingV4(3.dp))) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(appSpacingV4(5.dp)),
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          CharacterHelpV4(
                              "Tarjetas opcionales para separar referencias concretas. La búsqueda revisa título y contenido.",
                              modifier = Modifier.weight(1f),
                          )
                          if (reorderAvailable && visibleCards.size > 1) {
                              CharacterLinearReorderModeControlV4(
                                  active = reorderMode,
                                  onToggle = { reorderMode = !reorderMode },
                              )
                          }
                      }
                      if (reorderMode) {
                          CharacterHelpV4("Reordenación lineal: arrastra en una columna y pulsa Listo para volver a tus columnas.")
                      }
                      if (!reorderAvailable && visibleCards.isNotEmpty()) {''')

          equipment = 'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt'
          replace_once(equipment,
          '''    var ordinaryCollapsed by rememberSaveable { mutableStateOf(false) }
              var specialCollapsed by rememberSaveable { mutableStateOf(false) }

              var editorOpen''',
          '''    var ordinaryCollapsed by rememberSaveable { mutableStateOf(false) }
              var specialCollapsed by rememberSaveable { mutableStateOf(false) }
              var ordinaryReorderMode by rememberSaveable("equipment-ordinary-linear-reorder") { mutableStateOf(false) }
              var specialReorderMode by rememberSaveable("equipment-special-linear-reorder") { mutableStateOf(false) }

              var editorOpen''')
          replace_once(equipment,
          '''    fun updateQuery(updated: CharacterCollectionQuery) {
                  searchText = updated.searchText''',
          '''    fun updateQuery(updated: CharacterCollectionQuery) {
                  ordinaryReorderMode = false
                  specialReorderMode = false
                  searchText = updated.searchText''')
          replace_once(equipment,
          '''                onOrderChange = { ordinaryOrderName = it.name },
                          collapsed = ordinaryCollapsed,
                          onCollapsedChange = { ordinaryCollapsed = it },
                          canReorder = canReorderOrdinary,''',
          '''                onOrderChange = {
                              ordinaryReorderMode = false
                              ordinaryOrderName = it.name
                          },
                          collapsed = ordinaryCollapsed,
                          onCollapsedChange = { ordinaryCollapsed = it },
                          canReorder = canReorderOrdinary && ordinaryReorderMode,
                          reorderAvailable = canReorderOrdinary,
                          reorderModeActive = ordinaryReorderMode,
                          onReorderModeToggle = {
                              ordinaryReorderMode = !ordinaryReorderMode
                              if (ordinaryReorderMode) specialReorderMode = false
                          },''')
          replace_once(equipment,
          '''                onOrderChange = { specialOrderName = it.name },
                          collapsed = specialCollapsed,
                          onCollapsedChange = { specialCollapsed = it },
                          canReorder = canReorderSpecial,''',
          '''                onOrderChange = {
                              specialReorderMode = false
                              specialOrderName = it.name
                          },
                          collapsed = specialCollapsed,
                          onCollapsedChange = { specialCollapsed = it },
                          canReorder = canReorderSpecial && specialReorderMode,
                          reorderAvailable = canReorderSpecial,
                          reorderModeActive = specialReorderMode,
                          onReorderModeToggle = {
                              specialReorderMode = !specialReorderMode
                              if (specialReorderMode) ordinaryReorderMode = false
                          },''')
          replace_once(equipment,
          '''    canReorder: Boolean,
              queryActive: Boolean,
              wide: Boolean,''',
          '''    canReorder: Boolean,
              reorderAvailable: Boolean,
              reorderModeActive: Boolean,
              onReorderModeToggle: () -> Unit,
              queryActive: Boolean,
              wide: Boolean,''')
          replace_once(equipment,
          '''            if (order == CharacterPresentationOrder.MANUAL && queryActive) {
                      Text(
                          "Limpia búsqueda y filtros para reordenar manualmente.",
                          style = MaterialTheme.typography.labelSmall,
                      )
                  }
                  if (!collapsed) {''',
          '''            if (order == CharacterPresentationOrder.MANUAL && queryActive) {
                      Text(
                          "Limpia búsqueda y filtros para reordenar manualmente.",
                          style = MaterialTheme.typography.labelSmall,
                      )
                  }
                  if (reorderAvailable && items.size > 1) {
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                          CharacterLinearReorderModeControlV4(
                              active = reorderModeActive,
                              onToggle = onReorderModeToggle,
                          )
                      }
                      if (reorderModeActive) {
                          CharacterHelpV4("Reordenación lineal: una columna temporal usa el arrastre vertical estable.")
                      }
                  }
                  if (!collapsed) {''')
          replace_once(equipment,
          '''                    val columns = constrainedCardColumnsV4(
                          wide = wide,
                          phoneMax = if (special) 2 else 3,
                          wideMax = if (special) 3 else 5,
                      )''',
          '''                    val columns = if (reorderModeActive) {
                          1
                      } else {
                          constrainedCardColumnsV4(
                              wide = wide,
                              phoneMax = if (special) 2 else 3,
                              wideMax = if (special) 3 else 5,
                          )
                      }''')
          PY
      - name: Guard product diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCollectionPrimitivesV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterHelpProvenanceV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterNotesTabV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt | sort)"
          test "$changed" = "$expected"
      - name: Focused compile and shared tests
        run: gradle :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit core acceptance repair and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/acceptance-repair-core-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCollectionPrimitivesV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterHelpProvenanceV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterNotesTabV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt \
                  .github/workflows/acceptance-repair-core-apply.yml
          git commit -m 'fix: repair owner acceptance source and reorder issues'
          git push origin HEAD:implementation/phase4a-successor-cycle
