name: F origin domain once

on:
  push:
    paths:
      - '.github/workflows/f-origin-domain-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Apply guarded origin domain migration
        run: |
          python3 .github/f-origin-domain-once.py
          python3 .github/f-origin-migration-tests-fix.py
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Verify domain migration
        run: gradle :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit origin domain and self-remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/f-origin-domain-once.yml .github/f-origin-domain-once.py .github/f-origin-migration-tests-fix.py
          git add -A
          git commit -m 'feat: add typed spellcasting origins'
          git push
