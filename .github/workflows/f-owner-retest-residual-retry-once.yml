name: F residual owner-test repair retry once

on:
  push:
    paths:
      - '.github/workflows/f-owner-retest-residual-retry-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 4
      - name: Guard retry ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "implementation/phase4a-successor-cycle"
          test "$(git rev-parse HEAD^)" = "45a7d80a398f1b3f0d9b44abec5bd9632378cb13"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Correct failed helper and apply residual repair
        run: |
          python3 .github/f-residual-retry-fix.py
          python3 .github/f-owner-retest-residual-once.py
      - name: Guard residual invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -R '\.height(characterCompactSingleLineFieldHeightV4())' androidApp/src/main/kotlin
          grep -q 'characterMeasuredGridReorderDragV4' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCardInteractionV4.kt
          grep -q 'translationX = offsetX' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCollectionPrimitivesV4.kt
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Verify F residual checkpoint
        run: gradle :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit repair and remove all helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCollectionPrimitivesV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCardInteractionV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellSourceEditorV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt
          git rm \
            .github/f-owner-retest-residual-once.py \
            .github/f-residual-retry-fix.py \
            .github/workflows/f-owner-retest-residual-once.yml \
            .github/workflows/f-owner-retest-residual-retry-once.yml
          git commit -m 'fix: close residual F editor and grid drag defects'
          git push
