name: Increment I1 tablet shell repair

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/i1-tablet-shell-repair.yml

permissions:
  contents: write

jobs:
  repair-and-apply-i1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Guard unchanged I1 proposal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:.github/workflows/i1-tablet-shell-apply.yml)" = "ca19e2c1b58333fc65d0d26ac51c048648a146e2"
          test "$(git rev-parse HEAD:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterAdaptiveShellV4.kt)" = "275360c47acb027e4000eb6617ff1bc149a3050d"
          test "$(git rev-parse HEAD:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterLayoutContextV4.kt)" = "def4ebf695db180690b0c0e144c6e4030ec80b5a"
          test "$(git rev-parse HEAD:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterResponsivePreferencesV4.kt)" = "533fcac0619e0cfebb71b657794704b35a167977"
      - name: Materialize the guarded proposal from the original helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          workflow = Path('.github/workflows/i1-tablet-shell-apply.yml').read_text()
          pattern = re.compile(r"          cat > (\S+) <<'EOF'\n(.*?)          EOF\n", re.S)
          matches = pattern.findall(workflow)
          if len(matches) != 3:
              raise SystemExit(f'Expected 3 source payloads, found {len(matches)}')
          for target, body in matches:
              lines = body.splitlines()
              normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
              Path(target).write_text(normalized)
          PY
      - name: Guard product diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterAdaptiveShellV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterLayoutContextV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterResponsivePreferencesV4.kt | sort)"
          test "$changed" = "$expected"
      - name: Focused compile and shared tests
        run: gradle :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit I1 product and remove both helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/i1-tablet-shell-apply.yml .github/workflows/i1-tablet-shell-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterAdaptiveShellV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterLayoutContextV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterResponsivePreferencesV4.kt \
                  .github/workflows/i1-tablet-shell-apply.yml \
                  .github/workflows/i1-tablet-shell-repair.yml
          git commit -m 'feat: add Increment I1 tablet-first adaptive shell'
          git push origin HEAD:implementation/phase4a-successor-cycle
