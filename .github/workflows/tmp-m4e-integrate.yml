name: Temporary M4e rules-source badge integration

on:
  push:
    branches:
      - tmp/phase4-m4e-rules-source-badges

permissions:
  contents: write

jobs:
  integrate-and-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-m4e-rules-source-badges
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact M4e semantic badge patch
        run: python .github/tmp_m4e_integrate.py

      - name: Verify D06 reachability and textual semantics
        run: |
          test "$(grep -F 'CharacterRulesSourceBadgesV4(' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterClassIdentityV4.kt | wc -l)" -eq 3
          grep -F 'characterRulesFamilyBadgeLabel(CharacterRulesFamily.DND_5_5E)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -F 'CharacterSemanticBadgeKindV4.STATE' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -F '"Fuente · $it"' shared/src/commonMain/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterSemanticLabels.kt
          ! grep -F 'SettingsPreviewBadge' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt

      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore

      - name: Run shared tests and application builds
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace

      - name: Type-check backend
        working-directory: backend
        run: |
          npm install
          npm run check

      - name: Commit accepted M4e product tree and remove temporary helpers
        run: |
          rm .github/tmp_m4e_integrate.py .github/workflows/tmp-m4e-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterClassIdentityV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt \
                  .github/tmp_m4e_integrate.py \
                  .github/workflows/tmp-m4e-integrate.yml
          git commit -m 'feat: integrate M4e rules and source badges'
          git push origin HEAD:tmp/phase4-m4e-rules-source-badges
