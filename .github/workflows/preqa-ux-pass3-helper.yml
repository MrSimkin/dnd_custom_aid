name: Pre-QA UX repair pass 3 helper

on:
  push:
    branches:
      - implementation/phase4-preqa-ux-repair

permissions:
  contents: write

env:
  REVIEW_VERSION: "0.4.0-preqa.3"
  REVIEW_BUILD: "40300"
  REVIEW_APK: "DND_Custom_Aid_0.4.0-preqa.3_Build_40300_debug.apk"
  REVIEW_ARTIFACT: "DND-Custom-Aid-0.4.0-preqa.3-build-40300-debug"

jobs:
  repair:
    if: github.event.head_commit.message == 'Execute durable pre-QA UX repair pass 3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Correct transform anchor for current navigation implementation
        run: python tools/preqa_ux_pass3_fix.py

      - name: Apply fail-closed repair pass
        run: python tools/preqa_ux_pass3.py

      - name: Verify repair shape
        run: |
          git diff --check
          if git grep -n "CharacterD20RollButtonV4" -- 'androidApp/src/main/**/*.kt'; then
            echo "Embedded d20 control reference remains" >&2
            exit 1
          fi
          grep -q 'versionCode = 40300' androidApp/build.gradle.kts
          grep -q 'versionName = "0.4.0-preqa.3"' androidApp/build.gradle.kts
          test -f androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterDiceRollTabV4.kt
          test ! -f androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterD20RollUiV4.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: "false"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore

      - name: Build and test Kotlin surfaces
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Type-check backend
        working-directory: backend
        run: npm install --no-package-lock && npm run check

      - name: Prepare identified review APK
        run: |
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "$RUNNER_TEMP/$REVIEW_APK"
          echo "APK_SHA256=$(sha256sum "$RUNNER_TEMP/$REVIEW_APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c%s "$RUNNER_TEMP/$REVIEW_APK")" >> "$GITHUB_ENV"

      - name: Upload review APK
        uses: actions/upload-artifact@v7
        with:
          name: DND-Custom-Aid-0.4.0-preqa.3-build-40300-debug
          path: ${{ runner.temp }}/DND_Custom_Aid_0.4.0-preqa.3_Build_40300_debug.apk
          if-no-files-found: error

      - name: Remove temporary transformation tools
        run: |
          rm tools/preqa_ux_pass3.py
          rm tools/preqa_ux_pass3_fix.py

      - name: Commit tested product repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement pre-QA UX repair pass 3"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Write owner-required pass checkpoint
        run: python tools/preqa_checkpoint_pass3.py

      - name: Remove temporary checkpoint writer
        run: rm tools/preqa_checkpoint_pass3.py

      - name: Commit checkpoint
        run: |
          git add docs/PROJECT_STATE.md docs/checkpoints tools/preqa_checkpoint_pass3.py
          git commit -m "Checkpoint pre-QA UX repair pass 3"

      - name: Push tested repair and checkpoint
        run: git push origin HEAD:implementation/phase4-preqa-ux-repair
