name: Increment F apply once

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - '.maintenance/increment_f.part*'
      - '.github/workflows/increment-f-apply-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: "false"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Reassemble, validate, and apply Increment F patch
        shell: bash
        run: |
          cat .maintenance/increment_f.part* > /tmp/increment_f.patch
          git apply --recount --check /tmp/increment_f.patch
          git apply --recount /tmp/increment_f.patch
      - name: Focused verification
        run: gradle :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit Increment F source delta and self-remove helper
        run: |
          rm -f .maintenance/increment_f.part*
          rmdir .maintenance 2>/dev/null || true
          rm .github/workflows/increment-f-apply-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: compact Conjuros source context for Increment F"
          git push origin HEAD:implementation/phase4a-successor-cycle
