name: Phase 4 pre-QA UX repair helper

on:
  push:
    branches:
      - implementation/phase4-preqa-ux-repair

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Repair Phase 4 pre-QA UX blockers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize temporary helper matching
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/preqa_ux_repair.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'def replace_once(path: str, old: str, new: str) -> None:\n    text = read(path)\n',
              'def replace_once(path: str, old: str, new: str) -> None:\n    old = old.replace("\\\\n", "\\n")\n    new = new.replace("\\\\n", "\\n")\n    text = read(path)\n',
          )
          s = s.replace(
              'def replace_all(path: str, old: str, new: str, minimum: int = 1) -> int:\n    text = read(path)\n',
              'def replace_all(path: str, old: str, new: str, minimum: int = 1) -> int:\n    old = old.replace("\\\\n", "\\n")\n    new = new.replace("\\\\n", "\\n")\n    text = read(path)\n',
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply fail-closed UX repair transformations
        run: python tools/preqa_ux_repair.py

      - name: Check patch whitespace
        run: git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore

      - name: Build and test Kotlin surfaces
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Type-check backend
        working-directory: backend
        run: npm install --no-package-lock && npm run check

      - name: Remove temporary helper machinery
        run: |
          rm tools/preqa_ux_repair.py
          rm .github/workflows/preqa-ux-repair-helper.yml

      - name: Commit tested repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Phase 4 pre-QA UX blockers'
          git push origin HEAD:implementation/phase4-preqa-ux-repair
