name: Increment G1 guarded implementation

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/g1-apply.yml

permissions:
  contents: write

jobs:
  apply-g1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply guarded G1 transformations
        run: python3 .maintenance/g1_apply.py
      - name: Guard diff
        run: |
          git diff --check
          grep -q '"Electrum"' shared/src/commonMain/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterRepository.kt
          grep -q 'Gemas / arte' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt
          grep -q 'CharacterResourcePlacement.EQUIPMENT' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt
      - name: Focused compile and tests
        run: ./gradlew :shared:desktopTest :androidApp:compileDebugKotlin
      - name: Commit G1 product and self-remove helper
        run: |
          rm -f .github/workflows/g1-apply.yml .maintenance/g1_apply.py
          rmdir .maintenance 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: wire Increment G1 equipment canonical state'
          git push origin HEAD:implementation/phase4a-successor-cycle
