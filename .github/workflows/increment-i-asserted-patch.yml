name: Increment I asserted source patch

on:
  push:
    branches:
      - tmp/increment-i-shared-slot-integration
    paths:
      - .github/workflows/increment-i-asserted-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/increment-i-shared-slot-integration
      - name: Apply asserted source patches
        run: python .github/scripts/increment_i_patch.py
      - name: Commit clean source wiring
        run: |
          rm .github/scripts/increment_i_patch.py
          rm .github/workflows/increment-i-asserted-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No patch changes staged"; exit 1; }
          git commit -m "Wire Conjuros to shared spell-slot state"
          git push origin HEAD:tmp/increment-i-shared-slot-integration
