name: Temporary P16 phone physical repair

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: stage P16 phone physical repair patcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - name: Apply exact guarded P16 repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          shell = 'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterAdaptiveShellV4.kt'
          replace_once(
              shell,
              '''        // D01: the compact identity/save header remains outside all scrolling tab content.\n        header()\n\n        when (layoutContext.formFactor) {''',
              '''            val combinePhoneLandscapeHeaderAndTabs =\n                layoutContext.formFactor == CharacterFormFactorV4.PHONE_LANDSCAPE &&\n                    navigationPresentation == CharacterNavigationPresentationV4.TOP_TABS &&\n                    layoutContext.verticalSpace != CharacterVerticalSpaceV4.COMFORTABLE\n\n            // Keep the identity/save controls persistent, but in shallow phone landscape use width\n            // instead of spending a second full row of scarce vertical space.\n            if (!combinePhoneLandscapeHeaderAndTabs) {\n                header()\n            }\n\n            when (layoutContext.formFactor) {''',
          )
          replace_once(
              shell,
              '''                CharacterNavigationPresentationV4.TOP_TABS -> {\n                    CharacterTopTabStripV4(\n                        selectedTab = selectedTab,\n                        spellcasterEnabled = spellcasterEnabled,\n                        visibleModules = visibleModules,\n                        tabOrder = effectiveTabOrder,\n                        onSelect = onSelect,\n                    )\n                    Box(modifier = Modifier.fillMaxWidth().weight(1f)) {\n                        content()\n                    }\n                }''',
              '''                CharacterNavigationPresentationV4.TOP_TABS -> {\n                    if (combinePhoneLandscapeHeaderAndTabs) {\n                        Row(\n                            modifier = Modifier.fillMaxWidth(),\n                            verticalAlignment = Alignment.CenterVertically,\n                        ) {\n                            Box(modifier = Modifier.widthIn(max = 360.dp)) {\n                                header()\n                            }\n                            Box(modifier = Modifier.weight(1f)) {\n                                CharacterTopTabStripV4(\n                                    selectedTab = selectedTab,\n                                    spellcasterEnabled = spellcasterEnabled,\n                                    visibleModules = visibleModules,\n                                    tabOrder = effectiveTabOrder,\n                                    onSelect = onSelect,\n                                )\n                            }\n                        }\n                    } else {\n                        CharacterTopTabStripV4(\n                            selectedTab = selectedTab,\n                            spellcasterEnabled = spellcasterEnabled,\n                            visibleModules = visibleModules,\n                            tabOrder = effectiveTabOrder,\n                            onSelect = onSelect,\n                        )\n                    }\n                    Box(modifier = Modifier.fillMaxWidth().weight(1f)) {\n                        content()\n                    }\n                }''',
          )

          hud = 'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatOperationalV4.kt'
          replace_once(
              hud,
              'import androidx.compose.foundation.text.KeyboardOptions\n',
              'import androidx.compose.foundation.text.BasicTextField\nimport androidx.compose.foundation.text.KeyboardOptions\n',
          )
          replace_once(
              hud,
              'import androidx.compose.ui.graphics.Color\n',
              'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.SolidColor\n',
          )
          replace_once(
              hud,
              '''            val controlHeight = characterCompactSingleLineFieldHeightV4()\n\n            Column(\n                modifier = Modifier.fillMaxWidth().padding(horizontal = 6.dp, vertical = 4.dp),\n                verticalArrangement = Arrangement.spacedBy(appSpacingV4(3.dp)),\n            ) {''',
              '''            val controlHeight = characterCompactSingleLineFieldHeightV4()\n            val compactVerticalSpace = layoutContext.verticalSpace != CharacterVerticalSpaceV4.COMFORTABLE\n            val hudVerticalPadding = if (compactVerticalSpace) 2.dp else 4.dp\n            val hudRowSpacing = appSpacingV4(if (compactVerticalSpace) 2.dp else 3.dp)\n\n            Column(\n                modifier = Modifier.fillMaxWidth().padding(horizontal = 6.dp, vertical = hudVerticalPadding),\n                verticalArrangement = Arrangement.spacedBy(hudRowSpacing),\n            ) {''',
          )
          replace_once(
              hud,
              '''                    OutlinedTextField(\n                        value = amountText,\n                        onValueChange = { amountText = normalizeCharacterUnsignedIntegerInput(it) },\n                        modifier = Modifier.weight(0.72f).heightIn(min = controlHeight),\n                        label = { Text("Cantidad") },\n                        singleLine = true,\n                        keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),\n                    )''',
              '''                    CombatAmountFieldV4(\n                        value = amountText,\n                        onValueChange = { amountText = normalizeCharacterUnsignedIntegerInput(it) },\n                        modifier = Modifier.weight(0.72f),\n                    )''',
          )
          replace_once(
              hud,
              '''        null -> Unit\n    }\n}\n\n@Composable\nprivate fun OperationalInlineMetricV4(''',
              '''        null -> Unit\n    }\n}\n\n@Composable\nprivate fun CombatAmountFieldV4(\n    value: String,\n    onValueChange: (String) -> Unit,\n    modifier: Modifier = Modifier,\n) {\n    Surface(\n        modifier = modifier.heightIn(min = characterCompactSingleLineFieldHeightV4()),\n        shape = MaterialTheme.shapes.extraSmall,\n        border = BorderStroke(1.dp, MaterialTheme.colorScheme.outline),\n        color = MaterialTheme.colorScheme.surfaceContainerLow,\n    ) {\n        Column(\n            modifier = Modifier.fillMaxWidth().padding(horizontal = 8.dp, vertical = 3.dp),\n            verticalArrangement = Arrangement.spacedBy(1.dp),\n        ) {\n            Text(\n                "Cantidad",\n                style = MaterialTheme.typography.labelSmall,\n                color = MaterialTheme.colorScheme.onSurfaceVariant,\n            )\n            BasicTextField(\n                value = value,\n                onValueChange = onValueChange,\n                modifier = Modifier.fillMaxWidth(),\n                singleLine = true,\n                textStyle = MaterialTheme.typography.bodyMedium.copy(\n                    color = MaterialTheme.colorScheme.onSurface,\n                ),\n                keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),\n                cursorBrush = SolidColor(MaterialTheme.colorScheme.primary),\n            )\n        }\n    }\n}\n\n@Composable\nprivate fun OperationalInlineMetricV4(''',
          )
          PY
      - name: Guard diff and commit product repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-p16-phone-repair.yml
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            ".github/workflows/tmp-p16-phone-repair.yml"
            "androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterAdaptiveShellV4.kt"
            "androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatOperationalV4.kt"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            echo 'Unexpected diff; refusing to commit.' >&2
            exit 1
          fi
          git config user.name 'MrSimkin'
          git config user.email 'gustavo.munoz.s@outlook.com'
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterAdaptiveShellV4.kt
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatOperationalV4.kt
          git commit -m 'repair: compact phone landscape shell and Combat HUD'
          git push origin HEAD:implementation/phase4a-successor-cycle
