name: One-time Batch G3 notes background wiring

on:
  push:
    branches:
      - implementation/phase4-character-closure
    paths:
      - .github/workflows/integrate-batch-g3-notes-background.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4-character-closure
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply guarded G3 patch
        run: python scripts/integrate_g3_notes_background.py
      - name: Remove one-time scaffolding
        run: rm .github/workflows/integrate-batch-g3-notes-background.yml scripts/integrate_g3_notes_background.py
      - name: Verify whitespace
        run: git diff --check
      - name: Commit G3 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterNotesTabV4.kt androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterBackgroundTabV4.kt .github/workflows/integrate-batch-g3-notes-background.yml scripts/integrate_g3_notes_background.py
          git commit -m 'feat: integrate Batch G3 notes and background closure UI'
          git push
