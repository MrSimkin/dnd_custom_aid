name: Residual Player acceptance audit

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/acceptance-residual-audit.yml

permissions:
  contents: write

jobs:
  residual-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 4
      - name: Guard clean product boundary
        shell: bash
        run: |
          set -euo pipefail
          base='4c90fcd4f3892b0d9eac799f4acffb537b0f9e47'
          git merge-base --is-ancestor "$base" HEAD
          test "$(git diff --name-only "$base" HEAD | sort -u)" = ".github/workflows/acceptance-residual-audit.yml"
          test ! -e .maintenance
          test ! -e .github/workflows/acceptance-text-density.yml
      - name: Audit repaired Player invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android')

          def read(name):
              return (root / name).read_text()

          def require(text, needle, label):
              if needle not in text:
                  raise SystemExit(f'MISSING|{label}|{needle}')

          def forbid(text, needle, label):
              if needle in text:
                  raise SystemExit(f'RESIDUAL|{label}|{needle}')

          equipment = read('CharacterEquipmentClosureV4.kt')
          traits = read('CharacterTraitsClosureV4.kt')
          notes = read('CharacterNotesTabV4.kt')
          spells = read('CharacterSpellsTabV4.kt')
          spell_list = read('CharacterSpellListClosureV4.kt')
          editor = read('CharacterEditorV4.kt')
          prefs = read('UiPreferences.kt')
          layout = read('CharacterLayoutV4.kt')
          help_src = read('CharacterHelpProvenanceV4.kt')

          # Reorder: grid browsing is preserved, but active reorder is linear/1-D.
          require(equipment, 'val columns = if (reorderMode) {\n                        1', 'equipment-linear-reorder')
          require(equipment, 'CharacterLinearReorderModeControlV4(', 'equipment-linear-control')
          require(traits, 'val columns = if (reorderMode) {\n                                1', 'traits-linear-reorder')
          require(traits, 'CharacterLinearReorderModeControlV4(', 'traits-linear-control')
          require(notes, 'val noteColumns = if (reorderMode) 1 else constrainedCardColumnsV4', 'notes-linear-reorder')
          require(notes, 'CharacterLinearReorderModeControlV4(', 'notes-linear-control')

          # Rasgos provenance: canonical character identity choices feed one shared source value.
          require(traits, 'traitOriginOptionsG5(traitTypeForOriginG2(originType), classes, background)', 'traits-canonical-options')
          require(traits, 'classes: List<CharacterClassLevel>', 'traits-canonical-classes')
          require(traits, 'CharacterOriginOptionV4("class:${classLevel.id}", name)', 'traits-class-id')
          require(traits, 'CharacterOriginOptionV4("race", it)', 'traits-race')
          require(traits, 'CharacterOriginOptionV4("background", it)', 'traits-background')
          require(traits, 'CharacterProvenanceRowV4(', 'traits-shared-provenance')
          require(traits, 'onCustomOriginChange = onSourceChange', 'traits-single-source-authority')

          # Conjuros: per-source casting remains canonical and phone landscape stays phone.
          require(spells, 'SpellSourceContextSelectorV4(', 'spells-source-context')
          require(spell_list, 'collapsibleSearch = true', 'spells-compact-search')
          require(spell_list, 'normalizeCharacterUnsignedIntegerInput(it, maxDigits = 1)', 'spell-level-normalization')
          forbid(spell_list, 'spellLevelInputG2', 'private-spell-level-workaround')
          require(editor, '.generalSpellcastingRows(successorState)', 'canonical-spellcasting-projection')
          require(editor, 'val wide = layoutContext.isTablet', 'phone-landscape-phone-model')

          # Shared help system remains the only contextual-help mode authority.
          require(help_src, 'enum class CharacterHelpModeV4', 'help-mode-enum')
          if sum(p.read_text().count('enum class CharacterHelpModeV4') for p in root.glob('*.kt')) != 1:
              raise SystemExit('DUPLICATE|help-mode-authority')
          require(prefs, 'helpMode: CharacterHelpModeV4 = CharacterHelpModeV4.ALWAYS_VISIBLE', 'help-preference')

          # Settings: rejected fonts stay hidden/selectable-safe and old saved values fall back.
          for choice in ('INTER', 'FIGTREE', 'PUBLIC_SANS', 'CABIN_CONDENSED', 'ENCODE_SANS_CONDENSED'):
              require(prefs, f'AppFontChoice.{choice}', f'hidden-font-{choice}')
          require(prefs, 'SELECTABLE_FONT_CHOICES_V4 = AppFontChoice.entries.filterNot { it in HIDDEN_FONT_CHOICES_V4 }', 'selectable-font-filter')
          require(prefs, 'resolvedFont.takeUnless { it in HIDDEN_FONT_CHOICES_V4 } ?: AppFontChoice.MANROPE', 'saved-font-fallback')
          require(prefs, 'label = { Text("Texto libre") }', 'realistic-settings-preview')

          # App-wide density repair: shared spacing-aware policy and no old giant slabs.
          require(layout, 'characterCompactTextAreaMinLinesV4', 'shared-text-area-density')
          refs = sum(p.read_text().count('characterCompactTextAreaMinLinesV4(') for p in root.glob('*.kt'))
          if refs < 45:
              raise SystemExit(f'INSUFFICIENT|density-coverage|{refs}')
          all_android = '\n'.join(p.read_text() for p in root.glob('*.kt'))
          for old in (
              'heightIn(min = 220.dp, max = 340.dp)',
              'min = if (wide) 260.dp else 220.dp',
              'max = if (wide) 420.dp else 360.dp',
              'min = if (wide) 220.dp else 180.dp',
              'max = if (wide) 380.dp else 300.dp',
          ):
              forbid(all_android, old, 'old-large-text-area')

          # IME-safe editing remains shared and broadly used.
          ime_refs = sum(p.read_text().count('CharacterImeSafeEditorDialog(') for p in root.glob('*.kt'))
          if ime_refs < 10:
              raise SystemExit(f'INSUFFICIENT|ime-safe-editor-coverage|{ime_refs}')

          print(f'PASS|density_refs={refs}|ime_safe_refs={ime_refs}')
          PY
      - name: Verify repository helper hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' acceptance-residual-audit.yml scaffold-check.yml | sort)"
          git diff --check
      - name: Self-remove residual audit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/acceptance-residual-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove residual Player acceptance audit'
          git push origin HEAD:implementation/phase4a-successor-cycle
