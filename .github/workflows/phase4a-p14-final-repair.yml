name: Phase4A P14 final repair

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/phase4a-p14-final-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0

      - name: Apply audited P14 hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}\n--- OLD ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}\n--- OLD ---\n{old}")
              p.write_text(text.replace(old, new))

