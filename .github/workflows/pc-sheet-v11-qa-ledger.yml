name: PC Sheet V11 owner QA traceability

on:
  push:
    branches:
      - main
      - docs/pc-sheet-v11-approved-implementation-handoff
    paths:
      - "docs/pc-sheet-v11/**"
      - "shared/**"
      - "androidApp/**"
      - "desktopApp/**"
      - "assets/fonts/**"
      - "assets/character-sheets/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "docs/checkpoints/2026-09-28_PC_SHEET_MARA_50800_PRE_FIX_ACCEPTANCE_MATRIX.md"
      - "scripts/check_v11_qa_registry.py"
      - "scripts/test_check_v11_qa_registry.py"
      - "scripts/check_v11_pre_qa_gate.py"
      - "scripts/test_check_v11_pre_qa_gate.py"
      - "scripts/test_v11_rasgos_render_contract.py"
      - "scripts/test_v11_attacks_render_contract.py"
      - "scripts/test_v11_p1_skills_cartela_contract.py"
      - "scripts/test_v11_p1_attributes_cartela_contract.py"
      - "scripts/test_v11_ammunition_manual_contract.py"
      - "scripts/test_v11_special_equipment_manual_contract.py"
      - "scripts/test_v11_p2_rasgos_heading_contract.py"
      - "scripts/test_v11_p2_empty_paper_rhythm_contract.py"
      - "scripts/test_v11_p2_paired_column_legend_contract.py"
      - "scripts/test_v11_c2_source_navigation_contract.py"
      - "scripts/test_v11_spellbook_essential_card_contract.py"
      - "scripts/test_v11_spellbook_continuation_label_contract.py"
      - "scripts/test_v11_spellbook_whole_card_contract.py"
      - ".github/workflows/pc-sheet-v11-qa-ledger.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/pc-sheet-v11/**"
      - "shared/**"
      - "androidApp/**"
      - "desktopApp/**"
      - "assets/fonts/**"
      - "assets/character-sheets/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "docs/checkpoints/2026-09-28_PC_SHEET_MARA_50800_PRE_FIX_ACCEPTANCE_MATRIX.md"
      - "scripts/check_v11_qa_registry.py"
      - "scripts/test_check_v11_qa_registry.py"
      - "scripts/check_v11_pre_qa_gate.py"
      - "scripts/test_check_v11_pre_qa_gate.py"
      - "scripts/test_v11_rasgos_render_contract.py"
      - "scripts/test_v11_attacks_render_contract.py"
      - "scripts/test_v11_p1_skills_cartela_contract.py"
      - "scripts/test_v11_p1_attributes_cartela_contract.py"
      - "scripts/test_v11_ammunition_manual_contract.py"
      - "scripts/test_v11_special_equipment_manual_contract.py"
      - "scripts/test_v11_p2_rasgos_heading_contract.py"
      - "scripts/test_v11_p2_empty_paper_rhythm_contract.py"
      - "scripts/test_v11_p2_paired_column_legend_contract.py"
      - "scripts/test_v11_c2_source_navigation_contract.py"
      - "scripts/test_v11_spellbook_essential_card_contract.py"
      - "scripts/test_v11_spellbook_continuation_label_contract.py"
      - "scripts/test_v11_spellbook_whole_card_contract.py"
      - ".github/workflows/pc-sheet-v11-qa-ledger.yml"

permissions:
  contents: read

jobs:
  owner-qa-evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax, registry and historical owner evidence
        run: |
          python3 -m py_compile scripts/check_v11_qa_registry.py scripts/test_check_v11_qa_registry.py
          python3 scripts/check_v11_qa_registry.py --repo-root .
      - name: V11 G4 contract inventory (NOT a compliance PASS)
        run: |
          python3 -m py_compile scripts/check_v11_pre_qa_gate.py scripts/test_check_v11_pre_qa_gate.py
          python3 scripts/check_v11_pre_qa_gate.py --repo-root . --mode inventory
          python3 -m unittest discover -s scripts -p 'test_check_v11_pre_qa_gate.py' -v
      - name: V11 Rasgos G1/G2/G3 Android and Desktop source-contract guard
        run: python3 -m unittest discover -s scripts -p 'test_v11_rasgos_render_contract.py' -v
      - name: V11 P1 attacks G3 parity and real-PDF test inventory
        run: python3 -m unittest discover -s scripts -p 'test_v11_attacks_render_contract.py' -v
      - name: V11 P1 variant B Skills header native parity guard
        run: python3 -m unittest discover -s scripts -p 'test_v11_p1_skills_cartela_contract.py' -v
      - name: V11 P1 A/B Attributes header native parity guard
        run: python3 -m unittest discover -s scripts -p 'test_v11_p1_attributes_cartela_contract.py' -v
      - name: V11 empty ammunition P118 source parity guard
        run: python3 -m unittest discover -s scripts -p 'test_v11_ammunition_manual_contract.py' -v
      - name: V11 P2 empty special equipment P210 parity
        run: python3 -m unittest discover -s scripts -p 'test_v11_special_equipment_manual_contract.py' -v
      - name: V11 P2 Rasgos approved heading Android and Desktop parity
        run: python3 -m unittest discover -s scripts -p 'test_v11_p2_rasgos_heading_contract.py' -v
      - name: V11 P2 empty equipment and treasure native paper rhythm parity
        run: python3 -m unittest discover -s scripts -p 'test_v11_p2_empty_paper_rhythm_contract.py' -v
      - name: V11 P2 Equipment and Treasure column legends parity
        run: python3 -m unittest discover -s scripts -p 'test_v11_p2_paired_column_legend_contract.py' -v
      - name: V11 C2 physical source navigation contract parity
        run: python3 -m unittest discover -s scripts -p 'test_v11_c2_source_navigation_contract.py' -v
      - name: V11 BK06 essential spellbook cards and Android/Desktop parity
        run: python3 -m unittest discover -s scripts -p 'test_v11_spellbook_essential_card_contract.py' -v
      - name: V11 BK05 real spellbook continuation labels and native parity
        run: python3 -m unittest discover -s scripts -p 'test_v11_spellbook_continuation_label_contract.py' -v
      - name: V11 BK04 measured whole spellbook card + physical proof
        run: python3 -m unittest discover -s scripts -p 'test_v11_spellbook_whole_card_contract.py' -v
      - name: Anti-regression checks for the checker
        run: python3 -m unittest discover -s scripts -p 'test_check_v11_qa_registry.py' -v
      - name: Prevent silent edits to owner testimony between branch commits
        if: github.event_name == 'push'
        run: python3 scripts/check_v11_qa_registry.py --repo-root . --compare-ref HEAD^
