name: J2 guarded repository backup patch

on:
  push:
    branches:
      - tmp/phase4-j-backup-import
    paths:
      - .github/workflows/tmp-j2-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-j-backup-import
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Apply guarded J2 patch
        shell: bash
        run: python .github/j2_repository_patch.py
      - name: Run focused repository backup tests
        shell: bash
        run: gradle :shared:desktopTest --tests '*CharacterBackupRepositoryTest' --stacktrace
      - name: Commit product patch and remove helpers
        shell: bash
        run: |
          rm .github/j2_repository_patch.py .github/workflows/tmp-j2-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/src/commonMain/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterBackupRepository.kt \
                  shared/src/desktopTest/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterBackupRepositoryTest.kt \
                  .github/j2_repository_patch.py .github/workflows/tmp-j2-apply.yml
          git diff --cached --check
          git commit -m "feat: add atomic character backup repository"
          git push origin HEAD:tmp/phase4-j-backup-import

# Retry trigger after repairing the demonstrated stale J2 test fixture.
