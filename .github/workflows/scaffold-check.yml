name: Scaffold checks

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-correction-b:
    if: github.event_name == 'push' && github.ref == 'refs/heads/implementation/character-data-foundation' && contains(github.event.head_commit.message, '[apply-correction-b]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/character-data-foundation
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Apply B-01 persisted background identity fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual} for {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          replace(
              'shared/src/commonMain/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterSheet.kt',
              '''data class CharacterBackground(\n    val name: String = "",\n    val summary: String = "",\n    val personalityTraits: String = "",\n''',
              '''data class CharacterBackground(\n    val name: String = "",\n    val summary: String = "",\n    val race: String = "",\n    val religionFaith: String = "",\n    val personalityTraits: String = "",\n''',
          )

          replace(
              'shared/src/commonMain/sqldelight/io/github/mrsimkin/dndcustomaid/shared/db/Character.sq',
              '''    background_name TEXT NOT NULL DEFAULT '',\n    summary TEXT NOT NULL DEFAULT '',\n    personality_traits TEXT NOT NULL DEFAULT '',\n''',
              '''    background_name TEXT NOT NULL DEFAULT '',\n    summary TEXT NOT NULL DEFAULT '',\n    race TEXT NOT NULL DEFAULT '',\n    religion_faith TEXT NOT NULL DEFAULT '',\n    personality_traits TEXT NOT NULL DEFAULT '',\n''',
          )
          replace(
              'shared/src/commonMain/sqldelight/io/github/mrsimkin/dndcustomaid/shared/db/Character.sq',
              '''INSERT OR REPLACE INTO character_background(\n    character_id, background_name, summary, personality_traits, ideals, bonds, flaws, story\n)\nVALUES (?, ?, ?, ?, ?, ?, ?, ?);\n\nselectCharacterBackground:\nSELECT character_id, background_name, summary, personality_traits, ideals, bonds, flaws, story\n''',
              '''INSERT OR REPLACE INTO character_background(\n    character_id, background_name, summary, race, religion_faith, personality_traits, ideals, bonds, flaws, story\n)\nVALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?);\n\nselectCharacterBackground:\nSELECT character_id, background_name, summary, race, religion_faith, personality_traits, ideals, bonds, flaws, story\n''',
          )

          Path('shared/src/commonMain/sqldelight/io/github/mrsimkin/dndcustomaid/shared/db/5.sqm').write_text(
              "ALTER TABLE character_background ADD COLUMN race TEXT NOT NULL DEFAULT '';\n"
              "ALTER TABLE character_background ADD COLUMN religion_faith TEXT NOT NULL DEFAULT '';\n"
          )

          replace(
              'shared/src/commonMain/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterRepository.kt',
              '''                background_name = sheet.background.name,\n                summary = sheet.background.summary,\n                personality_traits = sheet.background.personalityTraits,\n''',
              '''                background_name = sheet.background.name,\n                summary = sheet.background.summary,\n                race = sheet.background.race,\n                religion_faith = sheet.background.religionFaith,\n                personality_traits = sheet.background.personalityTraits,\n''',
          )
          replace(
              'shared/src/commonMain/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterRepository.kt',
              '''        val background = database.characterQueries.selectCharacterBackground(core.id.toString()) {\n                _, name, summary, personalityTraits, ideals, bonds, flaws, story ->\n            CharacterBackground(\n                name = name,\n                summary = summary,\n                personalityTraits = personalityTraits,\n''',
              '''        val background = database.characterQueries.selectCharacterBackground(core.id.toString()) {\n                _, name, summary, race, religionFaith, personalityTraits, ideals, bonds, flaws, story ->\n            CharacterBackground(\n                name = name,\n                summary = summary,\n                race = race,\n                religionFaith = religionFaith,\n                personalityTraits = personalityTraits,\n''',
          )

          replace(
              'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterBackgroundDraftCodecV4.kt',
              '''        .put("name", background.name)\n        .put("summary", background.summary)\n        .put("personalityTraits", background.personalityTraits)\n''',
              '''        .put("name", background.name)\n        .put("summary", background.summary)\n        .put("race", background.race)\n        .put("religionFaith", background.religionFaith)\n        .put("personalityTraits", background.personalityTraits)\n''',
          )
          replace(
              'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterBackgroundDraftCodecV4.kt',
              '''        name = json.optString("name", ""),\n        summary = json.optString("summary", ""),\n        personalityTraits = json.optString("personalityTraits", ""),\n''',
              '''        name = json.optString("name", ""),\n        summary = json.optString("summary", ""),\n        race = json.optString("race", ""),\n        religionFaith = json.optString("religionFaith", ""),\n        personalityTraits = json.optString("personalityTraits", ""),\n''',
          )

          replace(
              'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterBackgroundTabV4.kt',
              '''                    OutlinedTextField(\n                        value = background.summary,\n                        onValueChange = { onBackgroundChange(background.copy(summary = it)) },\n                        modifier = Modifier.fillMaxWidth(),\n                        label = { Text("Descripción / resumen") },\n                        minLines = 2,\n                    )\n''',
              '''                    if (wide) {\n                        Row(\n                            modifier = Modifier.fillMaxWidth(),\n                            horizontalArrangement = Arrangement.spacedBy(7.dp),\n                        ) {\n                            OutlinedTextField(\n                                value = background.race,\n                                onValueChange = { onBackgroundChange(background.copy(race = it)) },\n                                modifier = Modifier.weight(1f),\n                                label = { Text("Raza") },\n                                singleLine = true,\n                            )\n                            OutlinedTextField(\n                                value = background.religionFaith,\n                                onValueChange = { onBackgroundChange(background.copy(religionFaith = it)) },\n                                modifier = Modifier.weight(1f),\n                                label = { Text("Religión / Fe") },\n                                singleLine = true,\n                            )\n                        }\n                    } else {\n                        OutlinedTextField(\n                            value = background.race,\n                            onValueChange = { onBackgroundChange(background.copy(race = it)) },\n                            modifier = Modifier.fillMaxWidth(),\n                            label = { Text("Raza") },\n                            singleLine = true,\n                        )\n                        OutlinedTextField(\n                            value = background.religionFaith,\n                            onValueChange = { onBackgroundChange(background.copy(religionFaith = it)) },\n                            modifier = Modifier.fillMaxWidth(),\n                            label = { Text("Religión / Fe") },\n                            singleLine = true,\n                        )\n                    }\n                    OutlinedTextField(\n                        value = background.summary,\n                        onValueChange = { onBackgroundChange(background.copy(summary = it)) },\n                        modifier = Modifier.fillMaxWidth(),\n                        label = { Text("Descripción / resumen") },\n                        minLines = 2,\n                    )\n''',
          )

          replace(
              'shared/src/desktopTest/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterPhase4FinalRegressionTest.kt',
              '''                        background = CharacterBackground(\n                            name = "Erudito",\n                            summary = "Investigador",\n                            personalityTraits = "Curioso",\n''',
              '''                        background = CharacterBackground(\n                            name = "Erudito",\n                            summary = "Investigador",\n                            race = "Humano",\n                            religionFaith = "Ioun",\n                            personalityTraits = "Curioso",\n''',
          )
          replace(
              'shared/src/desktopTest/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterPhase4FinalRegressionTest.kt',
              '''                assertEquals("Erudito", reopened.background.name)\n                assertEquals("Historia persistente de Phase 4.", reopened.background.story)\n''',
              '''                assertEquals("Erudito", reopened.background.name)\n                assertEquals("Humano", reopened.background.race)\n                assertEquals("Ioun", reopened.background.religionFaith)\n                assertEquals("Historia persistente de Phase 4.", reopened.background.story)\n''',
          )

          Path('shared/src/desktopTest/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterBackgroundIdentityMigrationTest.kt').write_text(r'''package io.github.mrsimkin.dndcustomaid.shared.character

import app.cash.sqldelight.driver.jdbc.sqlite.JdbcSqliteDriver
import io.github.mrsimkin.dndcustomaid.shared.campaign.CampaignRepository
import io.github.mrsimkin.dndcustomaid.shared.db.AppDatabase
import java.io.File
import java.sql.DriverManager
import kotlin.test.Test
import kotlin.test.assertEquals

class CharacterBackgroundIdentityMigrationTest {
    @Test
    fun migrationFromPreCorrectionSchemaPreservesBackgroundAndAddsEmptyIdentityFields() {
        val file = File.createTempFile("dnd-custom-aid-background-identity", ".db")
        file.delete()
        val jdbcUrl = "jdbc:sqlite:${file.absolutePath}"
        val characterId = "00000000-0000-0000-0000-000000000099"

        try {
            DriverManager.getConnection(jdbcUrl).use { connection ->
                connection.createStatement().use { statement ->
                    statement.executeUpdate("CREATE TABLE character (id TEXT NOT NULL PRIMARY KEY)")
                    statement.executeUpdate(
                        """CREATE TABLE character_background (
                            character_id TEXT NOT NULL PRIMARY KEY REFERENCES character(id) ON DELETE CASCADE,
                            background_name TEXT NOT NULL DEFAULT '',
                            summary TEXT NOT NULL DEFAULT '',
                            personality_traits TEXT NOT NULL DEFAULT '',
                            ideals TEXT NOT NULL DEFAULT '',
                            bonds TEXT NOT NULL DEFAULT '',
                            flaws TEXT NOT NULL DEFAULT '',
                            story TEXT NOT NULL DEFAULT ''
                        )""".trimIndent(),
                    )
                    statement.executeUpdate("INSERT INTO character(id) VALUES ('$characterId')")
                    statement.executeUpdate(
                        """INSERT INTO character_background(
                            character_id, background_name, summary, personality_traits, ideals, bonds, flaws, story
                        ) VALUES (
                            '$characterId', 'Erudito', 'Resumen previo', 'Curioso', 'Conocimiento', 'Biblioteca', 'Obsesivo', 'Historia previa'
                        )""".trimIndent(),
                    )
                }
            }

            val driver = JdbcSqliteDriver(jdbcUrl)
            AppDatabase.Schema.migrate(
                driver = driver,
                oldVersion = 5,
                newVersion = AppDatabase.Schema.version,
            )
            val values = AppDatabase(driver).characterQueries.selectCharacterBackground(characterId) {
                    _, name, summary, race, religionFaith, personalityTraits, ideals, bonds, flaws, story ->
                listOf(name, summary, race, religionFaith, personalityTraits, ideals, bonds, flaws, story)
            }.executeAsOne()

            assertEquals(
                listOf(
                    "Erudito",
                    "Resumen previo",
                    "",
                    "",
                    "Curioso",
                    "Conocimiento",
                    "Biblioteca",
                    "Obsesivo",
                    "Historia previa",
                ),
                values,
            )
            driver.close()
        } finally {
            file.delete()
        }
    }

    @Test
    fun repositoryRoundTripPersistsRaceAndReligionFaith() {
        val driver = JdbcSqliteDriver(JdbcSqliteDriver.IN_MEMORY)
        try {
            AppDatabase.Schema.create(driver)
            val database = AppDatabase(driver)
            val campaign = CampaignRepository(database).createCampaign("Identidad")
            val repository = CharacterRepository(database)
            val created = repository.createCharacter(campaign.id, "Vanya")

            val saved = repository.saveCharacter(
                created.copy(
                    background = created.background.copy(
                        race = "Tiefling",
                        religionFaith = "Sin culto formal",
                    ),
                ),
            )
            val reopened = repository.character(saved.id)!!

            assertEquals("Tiefling", reopened.background.race)
            assertEquals("Sin culto formal", reopened.background.religionFaith)
        } finally {
            driver.close()
        }
    }
}
''')
          PY
      - name: Validate shared migration and persistence gate
        run: gradle :shared:desktopTest --stacktrace
      - name: Restore normal workflow and commit correction B
        shell: bash
        run: |
          cat > .github/workflows/scaffold-check.yml <<'YAML'
          name: Scaffold checks

          on:
            push:
            pull_request:

          jobs:
            kotlin:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: "17"
                - uses: android-actions/setup-android@v4
                  with:
                    packages: "platform-tools platforms;android-36"
                    log-accepted-android-sdk-licenses: "false"
                - uses: gradle/actions/setup-gradle@v6
                  with:
                    gradle-version: "9.5.0"
                - name: Prepare stable CI debug keystore
                  run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
                - name: Build and test Kotlin surfaces
                  run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace
                - name: Upload Android debug APK
                  uses: actions/upload-artifact@v7
                  with:
                    name: dnd-custom-aid-debug-apk
                    path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
                    if-no-files-found: error

            backend:
              runs-on: ubuntu-latest
              defaults:
                run:
                  working-directory: backend
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                - name: Install backend dependencies
                  run: npm install
                - name: Type-check Worker
                  run: npm run check
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/src/commonMain/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterSheet.kt \
                  shared/src/commonMain/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterRepository.kt \
                  shared/src/commonMain/sqldelight/io/github/mrsimkin/dndcustomaid/shared/db/Character.sq \
                  shared/src/commonMain/sqldelight/io/github/mrsimkin/dndcustomaid/shared/db/5.sqm \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterBackgroundDraftCodecV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterBackgroundTabV4.kt \
                  shared/src/desktopTest/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterPhase4FinalRegressionTest.kt \
                  shared/src/desktopTest/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterBackgroundIdentityMigrationTest.kt \
                  .github/workflows/scaffold-check.yml
          git commit -m "feat: persist race and religion faith in background"
          git push origin HEAD:implementation/character-data-foundation

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: "false"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Build and test Kotlin surfaces
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: dnd-custom-aid-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: npm install
      - name: Type-check Worker
        run: npm run check
