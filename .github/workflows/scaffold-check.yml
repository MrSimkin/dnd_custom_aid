name: Scaffold checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Guard canonical resume route
        run: python3 scripts/check_resume_route.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: "false"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Guard compact Player control geometry
        run: python3 scripts/check_player_control_geometry.py
      - name: Guard Player reorder target stability
        run: python3 scripts/check_player_reorder_stability.py
      - name: Guard Player checkbox consistency
        run: python3 scripts/check_player_checkbox_consistency.py
      - name: Guard Player spellcasting bootstrap
        run: python3 scripts/check_player_spellcasting_bootstrap.py
      - name: Guard Player class editor controls
        run: python3 scripts/check_player_class_editor_controls.py
      - name: Guard Player application-settings semantics
        run: python3 scripts/check_player_application_settings_semantics.py
      - name: Guard Player wide Combat composition
        run: python3 scripts/check_player_wide_combat.py
      - name: Guard Player Table Mode affordances
        run: python3 scripts/check_player_table_mode_affordances.py
      - name: Guard Player T2 dice presentation and Custom Throw
        run: python3 scripts/check_player_dice_t2.py
      - name: Guard Android PC sheet renderer sync
        run: python3 scripts/generate_android_pc_sheet_renderer.py --check
      - name: Guard Android PC sheet PDF delivery
        run: python3 scripts/check_android_pc_sheet_pdf_delivery.py
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Build and test Kotlin surfaces
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace
      - name: Independent V11 physical-envelope audit of real Desktop App PDFs
        if: github.ref == 'refs/heads/docs/pc-sheet-v11-approved-implementation-handoff'
        run: |
          python3 -m pip install --user 'PyMuPDF==1.26.7'
          python3 scripts/test_audit_v11_pdf_physical_envelope.py
          python3 scripts/audit_v11_pdf_physical_envelope.py --pdf-dir desktopApp/build/pc-sheet-proofs --minimum-pdfs 48 --report desktopApp/build/v11-physical-envelope-audit.json
          python3 scripts/audit_v11_final_notes_golden.py --golden-zip docs/pc-sheet-v11/dnd_custom_aid_V11_Carta_revision.zip --pdf-dir desktopApp/build/pc-sheet-proofs --minimum-pdfs 48 --report desktopApp/build/v11-final-notes-golden.json
          python3 scripts/audit_v11_portrait_placeholder_golden.py --golden-zip docs/pc-sheet-v11/dnd_custom_aid_V11_Carta_revision.zip --pdf-dir desktopApp/build/pc-sheet-proofs --minimum-pdfs 48 --report desktopApp/build/v11-portrait-placeholder-golden.json
          python3 scripts/audit_v11_double_outer_frame_golden.py --golden-zip docs/pc-sheet-v11/dnd_custom_aid_V11_Carta_revision.zip --pdf-dir desktopApp/build/pc-sheet-proofs --minimum-pdfs 54 --report desktopApp/build/v11-double-outer-frame-golden.json
      - name: Upload independent V11 physical-envelope audit
        if: github.ref == 'refs/heads/docs/pc-sheet-v11-approved-implementation-handoff'
        uses: actions/upload-artifact@v7
        with:
          name: v11-independent-physical-envelope-audit
          path: |
            desktopApp/build/v11-physical-envelope-audit.json
            desktopApp/build/v11-final-notes-golden.json
            desktopApp/build/v11-portrait-placeholder-golden.json
            desktopApp/build/v11-double-outer-frame-golden.json
          if-no-files-found: error
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: dnd-custom-aid-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
      - name: Upload PC sheet source renders
        uses: actions/upload-artifact@v7
        with:
          name: pc-sheet-source-renders
          path: |
            assets/character-sheets/templates/renders/original/page-*.png
            assets/character-sheets/templates/renders/v2/page-*.png
          if-no-files-found: error
      - name: Upload populated PC sheet template proofs
        uses: actions/upload-artifact@v7
        with:
          name: pc-sheet-populated-template-proofs
          path: desktopApp/build/pc-sheet-proofs/*
          if-no-files-found: error
      - name: Upload V11 PDFs actually generated by the Desktop app
        if: github.ref == 'refs/heads/docs/pc-sheet-v11-approved-implementation-handoff'
        uses: actions/upload-artifact@v7
        with:
          name: v11-internal-real-app-pdf-proofs
          path: desktopApp/build/pc-sheet-proofs/V11-INTERNAL-PROOF-*.pdf
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: npm install
      - name: Type-check Worker
        run: npm run check

  hosted-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dnd_custom_aid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dnd_custom_aid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: dnd_custom_aid
    steps:
      - uses: actions/checkout@v7
      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
      - name: Apply hosted database migrations
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/0001_integrated_mvp_spine.sql
      - name: Verify hosted database contracts
        run: |
          psql -v ON_ERROR_STOP=1 -f database/tests/0001_integrated_mvp_spine_contract.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/0002_campaign_membership_lifecycle_contract.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/0003_pc_snapshot_contract.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/0004_pc_dm_authority_contract.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/0005_membership_revoke_authorization_contract.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/0006_campaign_membership_administration_contract.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/0007_pc_authority_administration_contract.sql
