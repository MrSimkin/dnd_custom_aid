name: Scaffold checks

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-correction-a:
    if: github.event_name == 'push' && github.ref == 'refs/heads/implementation/character-data-foundation' && contains(github.event.head_commit.message, '[apply-correction-a]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/character-data-foundation
      - name: Apply owner-QA correction A
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual} for {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          replace(
              'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/MainActivity.kt',
              'import androidx.activity.compose.setContent\n',
              'import androidx.activity.compose.BackHandler\nimport androidx.activity.compose.setContent\n',
          )
          replace(
              'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/MainActivity.kt',
              '''    val selectedCampaign = selectedCampaignId?.let { id ->\n        campaignRepository.listCampaigns().firstOrNull { it.id.toString() == id }\n    }\n\n    when (screen) {\n''',
              '''    val selectedCampaign = selectedCampaignId?.let { id ->\n        campaignRepository.listCampaigns().firstOrNull { it.id.toString() == id }\n    }\n\n    BackHandler(enabled = showSettings) {\n        showSettings = false\n    }\n    BackHandler(enabled = !showSettings && screen == AppScreen.CHARACTERS) {\n        selectedCampaignId = null\n        selectedCharacterId = null\n        screenName = AppScreen.CAMPAIGNS.name\n    }\n    BackHandler(enabled = !showSettings && screen == AppScreen.CHARACTER_EDITOR) {\n        selectedCharacterId = null\n        screenName = AppScreen.CHARACTERS.name\n    }\n\n    when (screen) {\n''',
          )

          replace(
              'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt',
              'import androidx.compose.foundation.BorderStroke\n',
              'import androidx.activity.compose.BackHandler\nimport androidx.compose.foundation.BorderStroke\n',
          )
          replace(
              'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt',
              '''    var confirmDisableSpellcasting by rememberSaveable(characterId.toString(), "disable-spellcasting") { mutableStateOf(false) }\n    val selectedTab = resolvedCharacterTabV4(\n''',
              '''    var confirmDisableSpellcasting by rememberSaveable(characterId.toString(), "disable-spellcasting") { mutableStateOf(false) }\n\n    BackHandler(enabled = showPcSettings) {\n        showPcSettings = false\n    }\n\n    val selectedTab = resolvedCharacterTabV4(\n''',
          )

          replace(
              'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatTabV4.kt',
              'import androidx.compose.ui.platform.LocalDensity\n',
              'import androidx.compose.ui.platform.LocalDensity\nimport androidx.compose.ui.platform.LocalFocusManager\n',
          )
          replace(
              'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatTabV4.kt',
              '''    var typeMenuOpen by rememberSaveable { mutableStateOf(false) }\n\n    AlertDialog(\n        onDismissRequest = {},\n''',
              '''    var typeMenuOpen by rememberSaveable { mutableStateOf(false) }\n    val focusManager = LocalFocusManager.current\n\n    AlertDialog(\n        modifier = Modifier\n            .imePadding()\n            .navigationBarsPadding(),\n        onDismissRequest = { focusManager.clearFocus() },\n''',
          )
          replace(
              'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatTabV4.kt',
              '''                modifier = Modifier\n                    .heightIn(max = 480.dp)\n                    .imePadding()\n                    .navigationBarsPadding(),\n                contentPadding = PaddingValues(bottom = 96.dp),\n''',
              '''                modifier = Modifier.heightIn(max = 480.dp),\n                contentPadding = PaddingValues(bottom = 24.dp),\n''',
          )

          replace(
              'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentTabV4.kt',
              'import androidx.compose.ui.platform.LocalDensity\n',
              'import androidx.compose.ui.platform.LocalDensity\nimport androidx.compose.ui.platform.LocalFocusManager\n',
          )
          replace(
              'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentTabV4.kt',
              '''    var customLocation by rememberSaveable(location) {\n        mutableStateOf(location.isNotBlank() && location !in equipmentLocationsV4)\n    }\n\n    AlertDialog(\n        onDismissRequest = {},\n''',
              '''    var customLocation by rememberSaveable(location) {\n        mutableStateOf(location.isNotBlank() && location !in equipmentLocationsV4)\n    }\n    val focusManager = LocalFocusManager.current\n\n    AlertDialog(\n        modifier = Modifier\n            .imePadding()\n            .navigationBarsPadding(),\n        onDismissRequest = { focusManager.clearFocus() },\n''',
          )
          replace(
              'androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentTabV4.kt',
              '''                modifier = Modifier\n                    .heightIn(max = 520.dp)\n                    .imePadding()\n                    .navigationBarsPadding(),\n                contentPadding = PaddingValues(bottom = 96.dp),\n''',
              '''                modifier = Modifier.heightIn(max = 520.dp),\n                contentPadding = PaddingValues(bottom = 24.dp),\n''',
          )
          PY
      - name: Restore normal workflow and commit correction A
        shell: bash
        run: |
          cat > .github/workflows/scaffold-check.yml <<'YAML'
          name: Scaffold checks

          on:
            push:
            pull_request:

          jobs:
            kotlin:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: "17"
                - uses: android-actions/setup-android@v4
                  with:
                    packages: "platform-tools platforms;android-36"
                    log-accepted-android-sdk-licenses: "false"
                - uses: gradle/actions/setup-gradle@v6
                  with:
                    gradle-version: "9.5.0"
                - name: Prepare stable CI debug keystore
                  run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
                - name: Build and test Kotlin surfaces
                  run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace
                - name: Upload Android debug APK
                  uses: actions/upload-artifact@v7
                  with:
                    name: dnd-custom-aid-debug-apk
                    path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
                    if-no-files-found: error

            backend:
              runs-on: ubuntu-latest
              defaults:
                run:
                  working-directory: backend
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                - name: Install backend dependencies
                  run: npm install
                - name: Type-check Worker
                  run: npm run check
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/MainActivity.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatTabV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentTabV4.kt \
                  .github/workflows/scaffold-check.yml
          git commit -m "fix: phase 4 correction A navigation and IME blockers"
          git push origin HEAD:implementation/character-data-foundation

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: "false"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Build and test Kotlin surfaces
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: dnd-custom-aid-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: npm install
      - name: Type-check Worker
        run: npm run check
