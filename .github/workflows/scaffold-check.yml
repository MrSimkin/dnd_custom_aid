name: Scaffold checks

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: "false"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Apply bounded T8 Table Mode migration
        run: |
          python3 scripts/apply_t8_table_mode_affordances.py
          python3 scripts/apply_t8_table_mode_compile_fix.py
      - name: Guard compact Player control geometry
        run: python3 scripts/check_player_control_geometry.py
      - name: Guard Player reorder target stability
        run: python3 scripts/check_player_reorder_stability.py
      - name: Guard Player checkbox consistency
        run: python3 scripts/check_player_checkbox_consistency.py
      - name: Guard Player spellcasting bootstrap
        run: python3 scripts/check_player_spellcasting_bootstrap.py
      - name: Guard Player class editor controls
        run: python3 scripts/check_player_class_editor_controls.py
      - name: Guard Player application-settings semantics
        run: python3 scripts/check_player_application_settings_semantics.py
      - name: Guard Player wide Combat composition
        run: python3 scripts/check_player_wide_combat.py
      - name: Guard Player Table Mode affordances
        run: python3 scripts/check_player_table_mode_affordances.py
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Build and test Kotlin surfaces
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: dnd-custom-aid-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
      - name: Commit verified T8 Table Mode migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/implementation/phase4a-successor-cycle'
        run: |
          if git diff --quiet -- \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterClassIdentityV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterClassIdentitySuccessorV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterGeneralClosureV4.kt; then
            echo "No T8 Table Mode migration diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterClassIdentityV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterClassIdentitySuccessorV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterGeneralClosureV4.kt
          git commit -m "fix: enforce Table Mode structural affordances"
          git push origin HEAD:implementation/phase4a-successor-cycle

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: npm install
      - name: Type-check Worker
        run: npm run check
