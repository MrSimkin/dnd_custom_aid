name: Phase 4A T2 migration

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - scripts/migrate_phase4a_t2.py
      - scripts/migrate_phase4a_t2_retry.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply bounded T2 migration
        run: |
          if [ -f scripts/migrate_phase4a_t2_retry.py ]; then
            python3 scripts/migrate_phase4a_t2_retry.py
          else
            python3 scripts/migrate_phase4a_t2.py
          fi
      - name: Verify migration diff
        run: git diff --check
      - name: Commit T2 product changes
        run: |
          if git diff --quiet; then
            echo "Migration produced no changes" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterDiceRollSuccessorV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt \
            shared/src/commonMain/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterCombatDiceOperations.kt \
            shared/src/commonTest/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterCombatDiceOperationsTest.kt \
            scripts/check_player_dice_t2.py \
            .github/workflows/scaffold-check.yml
          git commit -m "fix: complete T2 dice presentation and custom throw"
          git push origin HEAD:implementation/phase4a-successor-cycle
