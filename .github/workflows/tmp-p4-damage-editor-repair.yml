name: Temporary P4 damage editor physical repair

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - name: Apply exact guarded P4 repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatSuccessorV4.kt')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          def replace_count(old, new, expected):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} matches, found {count}: {old!r}')
              text = text.replace(old, new)

          replace_once(
              'import androidx.compose.foundation.text.KeyboardOptions\n',
              'import androidx.compose.foundation.text.BasicTextField\nimport androidx.compose.foundation.text.KeyboardOptions\n',
          )
          replace_once(
              'import androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\n',
              'import androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.SolidColor\n',
          )

          replace_once(
              '''private val DICE_COMPONENT_REGEX_V4 = Regex("^([+-]?)([0-9]+)[dD]([0-9]+)([+-][0-9]+)?$")\n\nprivate fun parseDiceComponentDraftV4(expression: String): CharacterDiceComponentDraftV4 {\n    val match = DICE_COMPONENT_REGEX_V4.matchEntire(expression.trim())\n    return if (match == null) {\n        CharacterDiceComponentDraftV4(false, "", "", "")\n    } else {\n        CharacterDiceComponentDraftV4(\n            negativeDice = match.groupValues[1] == "-",\n            quantity = match.groupValues[2],\n            sides = match.groupValues[3],\n            modifier = match.groupValues[4],\n        )\n    }\n}''',
              '''// Deliberately accepts incomplete editing tokens such as `1d`, `d8` and `1d8-`.\n// Save-time validation remains strict; this parser only prevents recomposition from erasing\n// neighboring structured controls while the owner is still editing one part.\nprivate val DICE_COMPONENT_DRAFT_REGEX_V4 = Regex("^([+-]?)([0-9]*)[dD]([0-9]*)([+-][0-9]*)?$")\n\nprivate fun parseDiceComponentDraftV4(expression: String): CharacterDiceComponentDraftV4 {\n    val match = DICE_COMPONENT_DRAFT_REGEX_V4.matchEntire(expression.trim())\n    return if (match == null) {\n        CharacterDiceComponentDraftV4(false, "", "", "")\n    } else {\n        CharacterDiceComponentDraftV4(\n            negativeDice = match.groupValues[1] == "-",\n            quantity = match.groupValues[2],\n            sides = match.groupValues[3],\n            modifier = match.groupValues[4],\n        )\n    }\n}''',
          )

          replace_once(
              '''        Column(\n            modifier = Modifier.fillMaxWidth().padding(appSpacingV4(5.dp)),\n            verticalArrangement = Arrangement.spacedBy(appSpacingV4(4.dp)),\n        ) {''',
              '''        Column(\n            modifier = Modifier.fillMaxWidth().padding(\n                horizontal = appSpacingV4(4.dp),\n                vertical = appSpacingV4(3.dp),\n            ),\n            verticalArrangement = Arrangement.spacedBy(appSpacingV4(2.dp)),\n        ) {''',
          )

          replace_once(
              '''}\n\n@Composable\nprivate fun DiceDamageFieldsV4(''',
              '''}\n\n@Composable\nprivate fun CompactDamageFieldV4(\n    label: String,\n    value: String,\n    onValueChange: (String) -> Unit,\n    modifier: Modifier = Modifier,\n    keyboardType: KeyboardType = KeyboardType.Text,\n) {\n    Surface(\n        modifier = modifier.heightIn(min = characterCompactSingleLineFieldHeightV4()),\n        shape = MaterialTheme.shapes.extraSmall,\n        border = BorderStroke(1.dp, MaterialTheme.colorScheme.outline),\n        color = MaterialTheme.colorScheme.surface,\n    ) {\n        Row(\n            modifier = Modifier.fillMaxWidth().padding(horizontal = 6.dp, vertical = 4.dp),\n            horizontalArrangement = Arrangement.spacedBy(4.dp),\n            verticalAlignment = Alignment.CenterVertically,\n        ) {\n            Text(\n                label,\n                style = MaterialTheme.typography.labelSmall,\n                color = MaterialTheme.colorScheme.onSurfaceVariant,\n                maxLines = 1,\n            )\n            BasicTextField(\n                value = value,\n                onValueChange = onValueChange,\n                modifier = Modifier.weight(1f),\n                singleLine = true,\n                textStyle = MaterialTheme.typography.bodyMedium.copy(\n                    color = MaterialTheme.colorScheme.onSurface,\n                ),\n                keyboardOptions = KeyboardOptions(keyboardType = keyboardType),\n                cursorBrush = SolidColor(MaterialTheme.colorScheme.primary),\n            )\n        }\n    }\n}\n\n@Composable\nprivate fun DiceDamageFieldsV4(''',
          )

          replace_once(
              '''        OutlinedTextField(\n            value = parsed.quantity,\n            onValueChange = { value ->\n                updateDraft(parsed.copy(quantity = normalizeCharacterUnsignedIntegerInput(value)))\n            },\n            modifier = Modifier.weight(0.9f).heightIn(min = 48.dp, max = 48.dp),\n            label = { Text("Cant.") },\n            singleLine = true,\n            keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),\n        )''',
              '''        CompactDamageFieldV4(\n            label = "Cant.",\n            value = parsed.quantity,\n            onValueChange = { value ->\n                updateDraft(parsed.copy(quantity = normalizeCharacterUnsignedIntegerInput(value)))\n            },\n            modifier = Modifier.weight(0.9f),\n            keyboardType = KeyboardType.Number,\n        )''',
          )
          replace_once(
              '''        OutlinedTextField(\n            value = parsed.modifier,\n            onValueChange = { value -> updateDraft(parsed.copy(modifier = sanitizeSignedIntegerInputV4(value))) },\n            modifier = Modifier.weight(1f).heightIn(min = 48.dp, max = 48.dp),\n            label = { Text("Mod.") },\n            singleLine = true,\n            keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),\n        )''',
              '''        CompactDamageFieldV4(\n            label = "Mod.",\n            value = parsed.modifier,\n            onValueChange = { value -> updateDraft(parsed.copy(modifier = sanitizeSignedIntegerInputV4(value))) },\n            modifier = Modifier.weight(1f),\n            keyboardType = KeyboardType.Number,\n        )''',
          )
          replace_once(
              '''        OutlinedTextField(\n            value = parsed.sides,\n            onValueChange = { value -> updateDraft(parsed.copy(sides = normalizeCharacterUnsignedIntegerInput(value))) },\n            modifier = Modifier.fillMaxWidth().heightIn(min = 48.dp, max = 48.dp),\n            label = { Text("Caras del dado") },\n            singleLine = true,\n            keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),\n        )''',
              '''        CompactDamageFieldV4(\n            label = "Caras del dado",\n            value = parsed.sides,\n            onValueChange = { value -> updateDraft(parsed.copy(sides = normalizeCharacterUnsignedIntegerInput(value))) },\n            modifier = Modifier.fillMaxWidth(),\n            keyboardType = KeyboardType.Number,\n        )''',
          )
          replace_once(
              '''    OutlinedTextField(\n        value = component.expression,\n        onValueChange = { onChange(component.copy(expression = sanitizeSignedIntegerInputV4(it))) },\n        modifier = Modifier.fillMaxWidth().heightIn(min = 48.dp, max = 48.dp),\n        label = { Text("Daño plano") },\n        singleLine = true,\n        keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),\n    )''',
              '''    CompactDamageFieldV4(\n        label = "Daño plano",\n        value = component.expression,\n        onValueChange = { onChange(component.copy(expression = sanitizeSignedIntegerInputV4(it))) },\n        modifier = Modifier.fillMaxWidth(),\n        keyboardType = KeyboardType.Number,\n    )''',
          )
          replace_once(
              '''            OutlinedTextField(\n                value = current,\n                onValueChange = { onChange(component.copy(typeText = it)) },\n                modifier = Modifier.weight(1f).heightIn(min = 48.dp, max = 48.dp),\n                label = { Text("Otro tipo") },\n                singleLine = true,\n            )''',
              '''            CompactDamageFieldV4(\n                label = "Otro tipo",\n                value = current,\n                onValueChange = { onChange(component.copy(typeText = it)) },\n                modifier = Modifier.weight(1f),\n            )''',
          )

          replace_count(
              'Modifier.fillMaxWidth().heightIn(min = 48.dp, max = 48.dp)',
              'Modifier.fillMaxWidth().heightIn(min = characterCompactSingleLineFieldHeightV4())',
              3,
          )

          if 'heightIn(min = 48.dp, max = 48.dp)' in text:
              raise SystemExit('rigid 48dp damage-editor field remains after repair')

          path.write_text(text)
          PY
      - name: Guard diff and commit product repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-p4-damage-editor-repair.yml
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            ".github/workflows/tmp-p4-damage-editor-repair.yml"
            "androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatSuccessorV4.kt"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            echo 'Unexpected diff; refusing to commit.' >&2
            exit 1
          fi
          git config user.name 'MrSimkin'
          git config user.email 'gustavo.munoz.s@outlook.com'
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatSuccessorV4.kt
          git commit -m 'repair: stabilize and compact structured damage editor'
          git push origin HEAD:implementation/phase4a-successor-cycle
