name: J1 guarded shared backup contract patch

on:
  push:
    branches:
      - tmp/phase4-j-backup-import
    paths:
      - .github/workflows/tmp-j1-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-j-backup-import
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Apply guarded J1 patch
        shell: bash
        run: python .github/j1_backup_patch.py
      - name: Run focused shared backup tests
        shell: bash
        run: gradle :shared:desktopTest --tests '*CharacterBackupTest' --stacktrace
      - name: Commit product patch and remove helpers
        shell: bash
        run: |
          rm .github/j1_backup_patch.py .github/workflows/tmp-j1-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml shared/build.gradle.kts \
                  shared/src/commonMain/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterSheet.kt \
                  shared/src/commonMain/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterClosureDomain.kt \
                  shared/src/commonMain/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterClassCatalog.kt \
                  shared/src/commonMain/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterBackup.kt \
                  shared/src/desktopTest/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterBackupTest.kt \
                  .github/j1_backup_patch.py .github/workflows/tmp-j1-apply.yml
          git diff --cached --check
          git commit -m "feat: add versioned character backup contract"
          git push origin HEAD:tmp/phase4-j-backup-import
