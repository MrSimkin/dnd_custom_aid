name: I2b1 guarded mixed-surface Table mode patch

on:
  push:
    branches:
      - tmp/phase4-i2b-table-mode
    paths:
      - .github/workflows/tmp-i2b1-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-i2b-table-mode
          fetch-depth: 0
      - name: Apply guarded I2b1 patch
        shell: bash
        run: python .github/i2b1_patch.py
      - name: Commit product patch and remove helpers
        shell: bash
        run: |
          rm .github/i2b1_patch.py .github/workflows/tmp-i2b1-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatTabV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterManagementTabV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellsTabV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt \
                  .github/i2b1_patch.py .github/workflows/tmp-i2b1-apply.yml
          git diff --cached --check
          git commit -m "feat: enforce Table mode on mixed character surfaces"
          git push origin HEAD:tmp/phase4-i2b-table-mode
