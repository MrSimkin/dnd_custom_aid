name: Pre-QA UX repair pass 6 audit

on:
  push:
    branches:
      - implementation/phase4-preqa-ux-repair
    paths:
      - '.github/workflows/preqa-ux-pass6-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inventory responsive column caps and editor safety
        shell: bash
        run: |
          set -euo pipefail
          echo '=== constrainedCardColumnsV4 calls ==='
          grep -R -n --include='*.kt' 'constrainedCardColumnsV4' androidApp/src/main/kotlin || true
          echo
          echo '=== likely grid chunking sites ==='
          grep -R -n --include='*.kt' -E '\.chunked\(columns\)|repeat\(columns -|columns[[:space:]]*=' androidApp/src/main/kotlin || true
          echo
          echo '=== fixed/sticky controls ==='
          grep -R -n --include='*.kt' -E 'stickyHeader\(|CharacterCollectionToolbarV4\(|imePadding\(\)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android || true
          echo
          echo '=== text-input files without an obvious local IME-safe marker ==='
          python3 - <<'PY'
          from pathlib import Path
          root = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android')
          for p in sorted(root.glob('*.kt')):
              text = p.read_text(encoding='utf-8')
              has_input = 'OutlinedTextField(' in text or 'BasicTextField(' in text
              if not has_input:
                  continue
              safe = 'CharacterImeSafeEditorDialog(' in text or '.imePadding()' in text
              if not safe:
                  print(p)
          PY
          echo
          echo '=== raw spacing in focused residual files ==='
          grep -n -E 'padding\([^\n]*[0-9]+\.dp|spacedBy\([0-9]+\.dp' \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterLayoutV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatTabV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterNotesTabV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSupercompactV4.kt || true
