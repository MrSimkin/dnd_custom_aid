name: Temporary Increment E Trasfondo patch

on:
  push:
    branches:
      - tmp/increment-e-trasfondo-wiring
    paths:
      - .github/increment-e-trasfondo-patch-trigger

permissions:
  contents: write

jobs:
  patch-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/increment-e-trasfondo-wiring
          fetch-depth: 0
      - name: Apply asserted narrow Increment E patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt')
          text = path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}: {old[:180]!r}')
              return text.replace(old, new, 1)

          text = replace_once(
              text,
              '    var equipmentDraftJson by rememberSaveable(characterId.toString()) {\n'
              '        mutableStateOf(\n'
              '            equipmentDraftToJsonV4(\n'
              '                CharacterEquipmentDraftV4(\n'
              '                    items = stored.inventoryItems,\n'
              '                    currencies = stored.currencies,\n'
              '                ),\n'
              '            ),\n'
              '        )\n'
              '    }\n'
              '    var savedMessage by rememberSaveable(characterId.toString()) { mutableStateOf<String?>(null) }\n',
              '    var equipmentDraftJson by rememberSaveable(characterId.toString()) {\n'
              '        mutableStateOf(\n'
              '            equipmentDraftToJsonV4(\n'
              '                CharacterEquipmentDraftV4(\n'
              '                    items = stored.inventoryItems,\n'
              '                    currencies = stored.currencies,\n'
              '                ),\n'
              '            ),\n'
              '        )\n'
              '    }\n'
              '    var backgroundDraftJson by rememberSaveable(characterId.toString(), "background") {\n'
              '        mutableStateOf(characterBackgroundToJsonV4(stored.background))\n'
              '    }\n'
              '    var savedMessage by rememberSaveable(characterId.toString()) { mutableStateOf<String?>(null) }\n',
              'add saveable background draft state',
          )

          text = replace_once(
              text,
              '    val combatEntries = remember(combatDraftJson) { combatEntriesFromJsonV4(combatDraftJson) }\n'
              '    val equipmentDraft = remember(equipmentDraftJson) { equipmentDraftFromJsonV4(equipmentDraftJson) }\n'
              '    val savable = draft.toSheetOrNull(stored, blankRequiredAsZero = true) != null\n',
              '    val combatEntries = remember(combatDraftJson) { combatEntriesFromJsonV4(combatDraftJson) }\n'
              '    val equipmentDraft = remember(equipmentDraftJson) { equipmentDraftFromJsonV4(equipmentDraftJson) }\n'
              '    val backgroundDraft = remember(backgroundDraftJson) { characterBackgroundFromJsonV4(backgroundDraftJson) }\n'
              '    val savable = draft.toSheetOrNull(stored, blankRequiredAsZero = true) != null\n',
              'decode background draft',
          )

          text = replace_once(
              text,
              '    fun updateCurrencies(updated: List<io.github.mrsimkin.dndcustomaid.shared.character.CharacterCurrency>) {\n'
              '        equipmentDraftJson = equipmentDraftToJsonV4(equipmentDraft.copy(currencies = updated))\n'
              '        savedMessage = null\n'
              '    }\n\n'
              '    fun persist(candidate: CharacterSheet) {\n',
              '    fun updateCurrencies(updated: List<io.github.mrsimkin.dndcustomaid.shared.character.CharacterCurrency>) {\n'
              '        equipmentDraftJson = equipmentDraftToJsonV4(equipmentDraft.copy(currencies = updated))\n'
              '        savedMessage = null\n'
              '    }\n\n'
              '    fun updateBackground(updated: io.github.mrsimkin.dndcustomaid.shared.character.CharacterBackground) {\n'
              '        backgroundDraftJson = characterBackgroundToJsonV4(updated)\n'
              '        savedMessage = null\n'
              '    }\n\n'
              '    fun persist(candidate: CharacterSheet) {\n',
              'add background draft updater',
          )

          text = replace_once(
              text,
              '        val integrated = candidate.copy(\n'
              '            combatEntries = combatEntriesFromJsonV4(combatDraftJson),\n'
              '            inventoryItems = equipment.items,\n'
              '            currencies = equipment.currencies,\n'
              '        )\n',
              '        val integrated = candidate.copy(\n'
              '            combatEntries = combatEntriesFromJsonV4(combatDraftJson),\n'
              '            inventoryItems = equipment.items,\n'
              '            currencies = equipment.currencies,\n'
              '            background = characterBackgroundFromJsonV4(backgroundDraftJson),\n'
              '        )\n',
              'persist background with central save',
          )

          text = replace_once(
              text,
              '        equipmentDraftJson = equipmentDraftToJsonV4(\n'
              '            CharacterEquipmentDraftV4(\n'
              '                items = stored.inventoryItems,\n'
              '                currencies = stored.currencies,\n'
              '            ),\n'
              '        )\n'
              '        savedMessage = "Guardado"\n',
              '        equipmentDraftJson = equipmentDraftToJsonV4(\n'
              '            CharacterEquipmentDraftV4(\n'
              '                items = stored.inventoryItems,\n'
              '                currencies = stored.currencies,\n'
              '            ),\n'
              '        )\n'
              '        backgroundDraftJson = characterBackgroundToJsonV4(stored.background)\n'
              '        savedMessage = "Guardado"\n',
              'reset background draft after save',
          )

          text = replace_once(
              text,
              '                    CharacterTabV4.BACKGROUND -> CharacterDomainShellV4(\n'
              '                        title = "Trasfondo",\n'
              '                        description = "La navegación está lista. El editor persistente de Trasfondo se incorpora en el Incremento E.",\n'
              '                    )\n',
              '                    CharacterTabV4.BACKGROUND -> CharacterBackgroundTabV4(\n'
              '                        background = backgroundDraft,\n'
              '                        onBackgroundChange = ::updateBackground,\n'
              '                        wide = wide,\n'
              '                    )\n',
              'replace Trasfondo shell with persistent tab',
          )

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt
      - name: Commit narrow Increment E patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt
          git commit -m "Wire persistent Trasfondo tab"
          git push origin HEAD:tmp/increment-e-trasfondo-wiring
