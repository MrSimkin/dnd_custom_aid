name: Temporary Phase4A C5 italic correction

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/tmp-phase4a-c5-italic-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - name: Apply guarded italic correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import androidx.compose.ui.text.input.KeyboardType\n',
              'import androidx.compose.ui.text.font.FontStyle\nimport androidx.compose.ui.text.input.KeyboardType\n',
              'font-style-import',
          )
          old = '''        Text(
            "${row.label} ($abbreviation)",
            modifier = Modifier.weight(1f),
            style = MaterialTheme.typography.bodySmall,
            maxLines = 3,
        )'''
          new = '''        Text(
            "${row.label} ($abbreviation)",
            modifier = Modifier.weight(1f),
            style = MaterialTheme.typography.bodySmall.copy(fontStyle = FontStyle.Italic),
            maxLines = 3,
        )'''
          replace_once(old, new, 'custom-skill-label')
          path.write_text(text)
          PY
          git diff --check
      - name: Commit source correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt
          git rm .github/workflows/tmp-phase4a-c5-italic-fix.yml
          git commit -m "fix: italicize custom skills in Habilidades"
          git push origin HEAD:implementation/phase4a-successor-cycle
