name: Increment G2 conditional module compaction

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/g2-modules-apply.yml

permissions:
  contents: write

jobs:
  apply-g2-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Apply guarded G2 module transformations
        run: python3 .maintenance/g2_modules_apply.py
      - name: Guard diff
        run: |
          git diff --check
          test "$(grep -c 'collapsibleSearch = true' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterArtificeModuleV4.kt)" -eq 1
          test "$(grep -c 'collapsibleSearch = true' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterFormsModuleV4.kt)" -eq 1
          test "$(grep -c 'collapsibleSearch = true' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCompanionsModuleV4.kt)" -eq 1
          test "$(grep -c 'collapsibleSearch = true' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterClassOptionModulesV4.kt)" -eq 1
          grep -q 'CharacterHelpV4(config.description)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterClassOptionModulesV4.kt
      - name: Focused compile and tests
        run: gradle :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit G2 module product and self-remove helper
        run: |
          rm -f .github/workflows/g2-modules-apply.yml .maintenance/g2_modules_apply.py
          rmdir .maintenance 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: compact Increment G2 conditional modules'
          git push origin HEAD:implementation/phase4a-successor-cycle
