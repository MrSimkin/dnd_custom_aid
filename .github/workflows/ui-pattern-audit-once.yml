name: UI pattern audit once

on:
  push:
    paths:
      - '.github/workflows/ui-pattern-audit-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Audit repeated UI implementation patterns
        shell: bash
        run: |
          set -u
          echo '=== DIRECT LONG-PRESS DRAG DETECTORS ==='
          git grep -n 'detectDragGesturesAfterLongPress' -- 'androidApp/src/main/kotlin/**/*.kt' || true
          echo '=== VISIBLE DRAG HANDLES ==='
          git grep -n 'StableDragHandle' -- 'androidApp/src/main/kotlin/**/*.kt' || true
          echo '=== SHARED LONG-PRESS DRAG PRIMITIVE CONSUMERS ==='
          git grep -n 'characterLongPressDragV4' -- 'androidApp/src/main/kotlin/**/*.kt' || true
          echo '=== RAW FAVORITE STAR GLYPHS ==='
          git grep -n -E '★|☆' -- 'androidApp/src/main/kotlin/**/*.kt' || true
          echo '=== IME SAFE EDITOR CALLS ==='
          git grep -n 'CharacterImeSafeEditorDialog' -- 'androidApp/src/main/kotlin/**/*.kt' || true
          echo '=== RAW COMPOSE DIALOG CALLS ==='
          git grep -n -E '(^|[^A-Za-z])Dialog\(' -- 'androidApp/src/main/kotlin/**/*.kt' || true
          echo '=== IME PADDING CALLS ==='
          git grep -n 'imePadding()' -- 'androidApp/src/main/kotlin/**/*.kt' || true
          echo '=== LIKELY STACKED SHORT TEXT-FIELD PAIRS (heuristic) ==='
          python3 - <<'PY'
          from pathlib import Path
          root = Path('androidApp/src/main/kotlin')
          for p in sorted(root.rglob('*.kt')):
              lines = p.read_text(encoding='utf-8').splitlines()
              pos = [i for i,l in enumerate(lines) if 'OutlinedTextField(' in l]
              for a,b in zip(pos,pos[1:]):
                  if b-a <= 24:
                      between='\n'.join(lines[a:b+1])
                      if 'Row(' not in between and 'LazyRow(' not in between:
                          print(f'{p}:{a+1}->{b+1}')
          PY
          echo '=== FILES WITH FAVORITE + DUPLICATE/REMOVE ACTION MIX ==='
          python3 - <<'PY'
          from pathlib import Path
          root=Path('androidApp/src/main/kotlin')
          for p in sorted(root.rglob('*.kt')):
              text=p.read_text(encoding='utf-8')
              fav=('★' in text or '☆' in text or 'Favorite' in text or 'favorite' in text)
              actions=sum(x in text for x in ['StableDuplicateIconButton','StableRemoveIconButton','StableEditIconButton'])
              if fav and actions>=2:
                  print(p)
          PY
      - name: Self-remove audit workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/ui-pattern-audit-once.yml
          git add .github/workflows/ui-pattern-audit-once.yml
          git commit -m 'chore: remove one-off UI pattern audit workflow'
          git push
