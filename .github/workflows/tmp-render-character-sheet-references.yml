name: Render character-sheet PDF references

on:
  push:
    branches:
      - implementation/character-data-foundation
    paths:
      - .github/workflows/tmp-render-character-sheet-references.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: implementation/character-data-foundation

      - name: Install PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Render PDF pages at 144 DPI
        shell: bash
        run: |
          set -euo pipefail
          ROOT='assets/character-sheets/templates'
          mkdir -p "$ROOT/renders/original" "$ROOT/renders/v2"
          rm -f "$ROOT/renders/original"/page-*.png "$ROOT/renders/v2"/page-*.png
          pdftoppm -png -r 144 "$ROOT/Hoja de PJ - 5.0 - Simkin.pdf" "$ROOT/renders/original/page"
          pdftoppm -png -r 144 "$ROOT/Hoja de PJ v2 - 5.0 - Simkin.pdf" "$ROOT/renders/v2/page"

      - name: Commit rendered reference images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/character-sheets/templates/renders
          if git diff --cached --quiet; then
            echo 'No rendered-image changes to commit.'
          else
            git commit -m 'Add rendered character-sheet visual references'
            git push origin HEAD:implementation/character-data-foundation
          fi
