name: Temporary Phase4A D sanitizer fix

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/tmp-phase4a-d-sanitizer-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - name: Apply guarded patch
        run: python .github/tmp-phase4a-d-sanitizer-fix.py
      - name: Check diff
        run: git diff --check
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatSuccessorV4.kt androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterDiceRollSuccessorV4.kt
          git rm .github/tmp-phase4a-d-sanitizer-fix.py .github/workflows/tmp-phase4a-d-sanitizer-fix.yml
          git commit -m "fix: use shared signed integer sanitizer in Increment D"
          git push origin HEAD:implementation/phase4a-successor-cycle
