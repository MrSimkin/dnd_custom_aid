name: Post-Pass7 governance reconciliation

on:
  push:
    branches:
      - implementation/phase4-preqa-ux-repair
    paths:
      - '.github/workflows/preqa-governance-reconcile.yml'
      - 'tools/preqa_governance_reconcile.py'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'Execute post-Pass7 governance reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Repair temporary EOF sentinel mechanics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/preqa_governance_reconcile.py')
          text = p.read_text(encoding='utf-8')

          agents_old = '''path = "AGENTS.md"\ntext = read(path)\ntext = replace_section(\n    text,\n    "## 13. Current project stage",'''
          agents_new = '''path = "AGENTS.md"\ntext = read(path)\ntext = text.rstrip() + "\\n\\n__END__\\n"\ntext = replace_section(\n    text,\n    "## 13. Current project stage",'''
          if text.count(agents_old) != 1:
              raise RuntimeError(f'AGENTS sentinel patch anchor count={text.count(agents_old)}')
          text = text.replace(agents_old, agents_new, 1)

          state_old = '''text = replace_section(\n    text,\n    "## 7. Exact continuation",\n    "__END__",'''
          state_new = '''text = text.rstrip() + "\\n\\n__END__\\n"\ntext = replace_section(\n    text,\n    "## 7. Exact continuation",\n    "__END__",'''
          if text.count(state_old) != 1:
              raise RuntimeError(f'PROJECT_STATE sentinel patch anchor count={text.count(state_old)}')
          text = text.replace(state_old, state_new, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Apply fail-closed governance reconciliation
        run: python tools/preqa_governance_reconcile.py

      - name: Verify governance-only shape
        shell: bash
        run: |
          set -euo pipefail
          # Markdown in this repository deliberately uses two-space hard line breaks.
          # Keep whitespace validation strict for non-Markdown files without treating
          # valid Markdown hard breaks as an error.
          git diff --check -- . ':(exclude)**/*.md' ':(exclude)*.md'

          grep -q 'versionCode = 40700' androidApp/build.gradle.kts
          grep -q 'versionName = "0.4.0-preqa.7"' androidApp/build.gradle.kts

          grep -q 'owner staged phone/tablet visual audition' docs/checkpoints/LATEST.md
          grep -q 'PHASE4_PREQA_GOVERNANCE_RECONCILIATION' docs/checkpoints/LATEST.md
          grep -q '## D-0047 — Phase 4 character closure expansion' docs/DECISIONS.md
          grep -q 'formal M6 deferred' docs/PROJECT_STATE.md
          grep -q '0.4.0-preqa.7' README.md
          grep -q 'implementation/phase4-preqa-ux-repair' AGENTS.md
          grep -q 'Current pre-QA owner-audition identity' docs/TESTING.md
          grep -q 'Current Phase 4 pre-QA manual entry point' docs/QA_CHECKLIST.md

          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(androidApp|shared|desktopApp|backend|database)/'; then
            echo 'Governance reconciliation touched product/source paths' >&2
            exit 1
          fi

      - name: Remove temporary reconciliation infrastructure
        run: |
          rm -f tools/preqa_governance_reconcile.py
          rm -f .github/workflows/preqa-governance-reconcile.yml

      - name: Commit and push reconciled governance state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- . ':(exclude)**/*.md' ':(exclude)*.md'
          git commit -m "Reconcile post-Pass7 governance state"
          git push origin HEAD:implementation/phase4-preqa-ux-repair

# Trigger commit for the fail-closed reconciliation gate; Markdown hard breaks are intentional.
