name: J backup header type safety

on:
  push:
    branches:
      - tmp/phase4-j-backup-import
    paths:
      - .github/workflows/tmp-j-header-type-safety.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-j-backup-import
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Apply guarded header type-safety patch
        shell: bash
        run: python .github/j_header_type_safety_patch.py
      - name: Run focused backup tests
        shell: bash
        run: gradle :shared:desktopTest --tests '*CharacterBackupTest' --stacktrace
      - name: Commit product patch and remove helpers
        shell: bash
        run: |
          rm .github/j_header_type_safety_patch.py .github/workflows/tmp-j-header-type-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/src/commonMain/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterBackup.kt \
                  shared/src/desktopTest/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterBackupTest.kt \
                  .github/j_header_type_safety_patch.py .github/workflows/tmp-j-header-type-safety.yml
          git diff --cached --check
          git commit -m "fix: handle non-primitive backup headers safely"
          git push origin HEAD:tmp/phase4-j-backup-import
