name: Window density repair once

on:
  push:
    paths:
      - '.github/workflows/window-density-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Compact shared window interiors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android')

          def function_span(text: str, name: str):
              marker = f'internal fun {name}('
              start = text.index(marker)
              comp = text.rfind('@Composable', 0, start)
              if comp >= 0 and start - comp < 40:
                  start = comp
              next_internal = text.find('\n@Composable\ninternal fun ', start + 12)
              next_private = text.find('\n@Composable\nprivate fun ', start + 12)
              candidates = [x for x in (next_internal, next_private) if x >= 0]
              end = min(candidates) if candidates else len(text)
              return start, end

          def replace_exact(block: str, old: str, new: str, label: str, count: int = 1):
              actual = block.count(old)
              if actual != count:
                  raise RuntimeError(f'{label}: expected {count} occurrences, found {actual}')
              return block.replace(old, new)

          p = root / 'CharacterInteractionPrimitivesV4.kt'
          text = p.read_text(encoding='utf-8')

          s, e = function_span(text, 'CharacterImeSafeEditorDialog')
          block = text[s:e]
          block = replace_exact(
              block,
              '.padding(horizontal = appSpacingV4(10.dp), vertical = appSpacingV4(8.dp))',
              '.padding(horizontal = appSpacingV4(6.dp), vertical = appSpacingV4(4.dp))',
              'editor outer padding',
          )
          block = replace_exact(
              block,
              '.padding(top = 12.dp, start = 12.dp, end = 12.dp, bottom = 8.dp)',
              '.padding(\n                            top = appSpacingV4(8.dp),\n                            start = appSpacingV4(8.dp),\n                            end = appSpacingV4(8.dp),\n                            bottom = appSpacingV4(6.dp),\n                        )',
              'editor surface padding',
          )
          block = replace_exact(
              block,
              'verticalArrangement = Arrangement.spacedBy(appSpacingV4(8.dp)),',
              'verticalArrangement = Arrangement.spacedBy(appSpacingV4(5.dp)),',
              'editor vertical gaps',
              count=2,
          )
          block = replace_exact(
              block,
              'horizontalArrangement = Arrangement.spacedBy(4.dp, Alignment.End),',
              'horizontalArrangement = Arrangement.spacedBy(appSpacingV4(3.dp), Alignment.End),',
              'editor action gap',
          )
          text = text[:s] + block + text[e:]

          s, e = function_span(text, 'CharacterCompactFieldRowV4')
          block = text[s:e]
          block = replace_exact(
              block,
              'horizontalArrangement = Arrangement.spacedBy(appSpacingV4(6.dp)),',
              'horizontalArrangement = Arrangement.spacedBy(appSpacingV4(4.dp)),',
              'compact field row gap',
          )
          text = text[:s] + block + text[e:]

          s, e = function_span(text, 'CharacterConfirmationDialog')
          block = text[s:e]
          block = replace_exact(
              block,
              'modifier = Modifier.padding(appSpacingV4(12.dp)),',
              'modifier = Modifier.padding(appSpacingV4(8.dp)),',
              'confirmation padding',
          )
          block = replace_exact(
              block,
              'verticalArrangement = Arrangement.spacedBy(appSpacingV4(10.dp)),',
              'verticalArrangement = Arrangement.spacedBy(appSpacingV4(6.dp)),',
              'confirmation gap',
          )
          block = replace_exact(
              block,
              'horizontalArrangement = Arrangement.spacedBy(4.dp, Alignment.End),',
              'horizontalArrangement = Arrangement.spacedBy(appSpacingV4(3.dp), Alignment.End),',
              'confirmation action gap',
          )
          text = text[:s] + block + text[e:]

          s, e = function_span(text, 'CharacterUsefulEmptyState')
          block = text[s:e]
          block = replace_exact(
              block,
              'modifier = Modifier.padding(appSpacingV4(10.dp)),',
              'modifier = Modifier.padding(appSpacingV4(8.dp)),',
              'empty state padding',
          )
          block = replace_exact(
              block,
              'verticalArrangement = Arrangement.spacedBy(appSpacingV4(5.dp)),',
              'verticalArrangement = Arrangement.spacedBy(appSpacingV4(4.dp)),',
              'empty state gap',
          )
          text = text[:s] + block + text[e:]
          p.write_text(text, encoding='utf-8')

          p = root / 'UiPreferences.kt'
          text = p.read_text(encoding='utf-8')

          def private_span(text: str, name: str):
              marker = f'private fun {name}('
              start = text.index(marker)
              comp = text.rfind('@Composable', 0, start)
              if comp >= 0 and start - comp < 40:
                  start = comp
              nxt = text.find('\n@Composable\nprivate fun ', start + 12)
              return start, (nxt if nxt >= 0 else len(text))

          s = text.index('internal fun AppSettingsDialog(')
          comp = text.rfind('@Composable', 0, s)
          e = text.find('\n@Composable\nprivate fun AboutBuildDialogV4', s)
          block = text[comp:e]
          block = replace_exact(
              block,
              'contentPadding = PaddingValues(bottom = appSpacingV4(12.dp)),',
              'contentPadding = PaddingValues(bottom = appSpacingV4(6.dp)),',
              'settings bottom padding',
          )
          block = replace_exact(
              block,
              'verticalArrangement = Arrangement.spacedBy(appSpacingV4(12.dp)),',
              'verticalArrangement = Arrangement.spacedBy(appSpacingV4(7.dp)),',
              'settings section gap',
          )
          text = text[:comp] + block + text[e:]

          s, e = private_span(text, 'AboutBuildDialogV4')
          block = text[s:e]
          block = replace_exact(
              block,
              'Column(verticalArrangement = Arrangement.spacedBy(appSpacingV4(8.dp))) {',
              'Column(verticalArrangement = Arrangement.spacedBy(appSpacingV4(5.dp))) {',
              'about gap',
          )
          block = replace_exact(
              block,
              'modifier = Modifier.padding(appSpacingV4(12.dp)),',
              'modifier = Modifier.padding(appSpacingV4(8.dp)),',
              'about card padding',
          )
          text = text[:s] + block + text[e:]

          s, e = private_span(text, 'SettingsSheetPreview')
          block = text[s:e]
          block = replace_exact(block, 'modifier = Modifier.padding(10.dp),', 'modifier = Modifier.padding(appSpacingV4(6.dp)),', 'preview outer padding')
          block = replace_exact(block, 'modifier = Modifier.padding(horizontal = 9.dp, vertical = 7.dp),', 'modifier = Modifier.padding(horizontal = appSpacingV4(7.dp), vertical = appSpacingV4(4.dp)),', 'preview header padding')
          text = text[:s] + block + text[e:]

          s, e = private_span(text, 'SettingsPreviewStatCell')
          block = text[s:e]
          block = replace_exact(block, 'modifier = Modifier.padding(horizontal = 6.dp, vertical = 5.dp),', 'modifier = Modifier.padding(horizontal = appSpacingV4(5.dp), vertical = appSpacingV4(3.dp)),', 'preview stat padding')
          text = text[:s] + block + text[e:]

          s, e = private_span(text, 'FontChoicePicker')
          block = text[s:e]
          block = replace_exact(block, 'modifier = Modifier.padding(horizontal = 8.dp, vertical = 7.dp),', 'modifier = Modifier.padding(horizontal = appSpacingV4(6.dp), vertical = appSpacingV4(4.dp)),', 'font row padding')
          text = text[:s] + block + text[e:]

          s, e = private_span(text, 'ThemePreviewCard')
          block = text[s:e]
          block = replace_exact(block, 'modifier = Modifier.padding(6.dp),', 'modifier = Modifier.padding(appSpacingV4(4.dp)),', 'theme card padding')
          text = text[:s] + block + text[e:]

          s, e = private_span(text, '<T> SettingSelector') if False else (None, None)
          # generic function marker differs because of the type parameter; use a guarded local replacement.
          marker = 'private fun <T> SettingSelector('
          start = text.index(marker)
          comp = text.rfind('@Composable', 0, start)
          block = text[comp:]
          old = 'verticalArrangement = Arrangement.spacedBy(appSpacingV4(4.dp)),'
          if old not in block:
              raise RuntimeError('setting selector gap not found')
          block = block.replace(old, 'verticalArrangement = Arrangement.spacedBy(appSpacingV4(3.dp)),', 1)
          text = text[:comp] + block
          p.write_text(text, encoding='utf-8')
          PY
      - name: Audit explicit font-size bypasses
        shell: bash
        run: |
          echo 'Explicit fontSize assignments in Android UI:'
          grep -RInE 'fontSize[[:space:]]*=' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android || true
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Compile compact window repair
        run: gradle :androidApp:compileDebugKotlin --stacktrace
      - name: Commit repair and self-remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/window-density-repair-once.yml
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterInteractionPrimitivesV4.kt androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt .github/workflows/window-density-repair-once.yml
          git commit -m 'fix: compact shared window interiors'
          git push
