name: Acceptance free-text density audit

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/acceptance-density-audit.yml

permissions:
  contents: write

jobs:
  audit-density:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Guard product boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6c652b58de82906c0a8e1c71414e2917f1ee4acd"
      - name: Audit multiline and fixed-height editor fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android')
          findings = []
          for path in sorted(root.glob('*.kt')):
              lines = path.read_text().splitlines()
              for idx, line in enumerate(lines):
                  if 'OutlinedTextField(' not in line:
                      continue
                  start = idx
                  depth = 0
                  began = False
                  end = idx
                  for j in range(idx, min(len(lines), idx + 90)):
                      s = lines[j]
                      depth += s.count('(') - s.count(')')
                      began = True
                      end = j
                      if began and depth <= 0:
                          break
                  block = '\n'.join(lines[start:end+1])
                  multi = ('minLines' in block or 'maxLines' in block or 'singleLine = false' in block)
                  fixed = ('heightIn(' in block or '.height(' in block)
                  if not multi and not fixed:
                      continue
                  label = ''
                  for candidate in lines[start:min(end+1, start+25)]:
                      m = re.search(r'Text\("([^"]+)"\)', candidate)
                      if m:
                          label = m.group(1)
                          break
                  findings.append((str(path.relative_to(root)), start+1, label, multi, fixed, block))
          print(f'AUDIT_COUNT={len(findings)}')
          for file, line, label, multi, fixed, block in findings:
              props = []
              for raw in block.splitlines():
                  stripped = raw.strip()
                  if any(k in stripped for k in ('label =', 'minLines =', 'maxLines =', '.heightIn(', '.height(', 'min =', 'max =')):
                      props.append(stripped)
              print(f'FIELD|{file}|{line}|{label}|multi={multi}|fixed={fixed}|{'; '.join(props)}')
          print('RAW_APP_SPACING_HEIGHTS')
          for path in sorted(root.glob('*.kt')):
              for i, line in enumerate(path.read_text().splitlines(), 1):
                  if 'heightIn(' in line or '.height(' in line:
                      print(f'HEIGHT|{path.name}|{i}|{line.strip()}')
          PY
      - name: Self-remove audit helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/acceptance-density-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove acceptance density audit helper'
          git push origin HEAD:implementation/phase4a-successor-cycle
