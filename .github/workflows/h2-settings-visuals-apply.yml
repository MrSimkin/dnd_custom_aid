name: Increment H2 settings previews and themes

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/h2-settings-visuals-apply.yml

permissions:
  contents: write

jobs:
  apply-h2-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Apply guarded H2 visual-choice transformations
        run: python3 .maintenance/h2_settings_visuals_apply.py
      - name: Guard diff
        run: |
          git diff --check
          grep -q 'DARK_PURPLE("Púrpura")' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -q 'DARK_CYAN("Cyan")' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -q 'LIGHT_CYAN("Cyan claro")' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -q 'CRIMSON("Carmesí")' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -q 'AMBER("Ámbar")' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -q 'GLACIER("Glaciar")' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -q 'LAVENDER("Lavanda")' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -q 'SLATE("Pizarra")' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -q 'TERRACOTTA("Terracota")' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -q 'private fun ColumnCountSettingV4' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -q 'Aventura · CD 15 · CA 17 · 1d20 + 7' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          ! grep -q 'Tipografía · audición' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          ! grep -q 'Tema · audición' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          ! grep -q 'choice.sourceLabel' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
      - name: Focused compile and tests
        run: gradle :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit H2 product and self-remove helper
        run: |
          rm -f .github/workflows/h2-settings-visuals-apply.yml .maintenance/h2_settings_visuals_apply.py
          rmdir .maintenance 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add Increment H2 settings previews and themes'
          git push origin HEAD:implementation/phase4a-successor-cycle
