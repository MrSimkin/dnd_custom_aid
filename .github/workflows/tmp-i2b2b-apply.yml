name: I2b2b guarded module affordance patch

on:
  push:
    branches:
      - tmp/phase4-i2b-table-mode
    paths:
      - .github/workflows/tmp-i2b2b-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-i2b-table-mode
          fetch-depth: 0
      - name: Apply guarded I2b2b patch
        shell: bash
        run: python .github/i2b2b_patch.py
      - name: Commit product patch and remove helpers
        shell: bash
        run: |
          rm .github/i2b2b_patch.py .github/workflows/tmp-i2b2b-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterArtificeModuleV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterFormsModuleV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterClassOptionModulesV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCompanionsModuleV4.kt \
                  .github/i2b2b_patch.py .github/workflows/tmp-i2b2b-apply.yml
          git diff --cached --check
          git commit -m "feat: lock structural module affordances in Table mode"
          git push origin HEAD:tmp/phase4-i2b-table-mode
