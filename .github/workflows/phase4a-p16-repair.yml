name: Phase4A P16 vertical-space repair

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/phase4a-p16-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - name: Apply audited P16 repair
        run: python3 .github/scripts/phase4a_p16_vertical_space_repair.py
      - name: Validate and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "repair: implement P16 vertical-space policy"
          git push origin HEAD:implementation/phase4a-successor-cycle

# retry-after-list-state-audit
