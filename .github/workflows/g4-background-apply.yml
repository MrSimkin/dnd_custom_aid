name: Increment G4 persistent background images

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/g4-background-apply.yml

permissions:
  contents: write

jobs:
  apply-g4-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Apply guarded G4 background transformations
        run: |
          sed -i 's/contentDescription = image\.originalName?/contentDescription = image?.originalName?/' .maintenance/g4_background_apply.py
          python3 .maintenance/g4_background_apply.py
      - name: Guard diff
        run: |
          git diff --check
          grep -q 'CharacterBackgroundImageCardV4' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterBackgroundTabV4.kt
          grep -q 'ActivityResultContracts.GetContent' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterBackgroundTabV4.kt
          grep -q 'Base64.encodeToString' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterBackgroundTabV4.kt
          grep -q 'contentDescription = image?.originalName' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterBackgroundTabV4.kt
          grep -q 'backgroundImagesRoundTripAsAppOwnedPayloads' shared/src/desktopTest/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterSuccessorRepositoryTest.kt
          grep -q 'backgroundImagePayloadSurvivesBackupCodecAndImportWithFreshIdentity' shared/src/desktopTest/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterBackupV2Test.kt
      - name: Focused compile and tests
        run: gradle :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit G4 product and self-remove helper
        run: |
          rm -f .github/workflows/g4-background-apply.yml .maintenance/g4_background_apply.py
          rmdir .maintenance 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add Increment G4 persistent background images'
          git push origin HEAD:implementation/phase4a-successor-cycle
