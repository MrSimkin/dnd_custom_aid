name: Temporary Phase4A E wire management

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/tmp-phase4a-e-wire-management.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0

      - name: Apply exact guarded wiring patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt")
          text = path.read_text()
          old = '''                        CharacterTabV4.MANAGEMENT -> CharacterManagementTabV4(
                            sheet = stored,
                            closureState = closureState,
                            onSheetChange = ::persistOperationalSheet,
                            onClosureStateChange = ::persistClosureState,
                            structuralEditingEnabled = structuralEditingEnabled,
                            wide = wide,
                            hapticsEnabled = closureState.hapticsEnabled,
                        )'''
          new = '''                        CharacterTabV4.MANAGEMENT -> CharacterManagementSuccessorTabV4(
                            sheet = stored,
                            generalDraftSheet = settingsSheet,
                            closureState = closureState,
                            onSheetChange = ::persistOperationalSheet,
                            onClosureStateChange = ::persistClosureState,
                            structuralEditingEnabled = structuralEditingEnabled,
                            wide = wide,
                            hapticsEnabled = closureState.hapticsEnabled,
                        )'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one Gestión wiring anchor, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          git diff -- androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt
          test -n "$(git status --short androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt)"

      - name: Commit wiring and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-phase4a-e-wire-management.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt .github/workflows/tmp-phase4a-e-wire-management.yml
          git commit -m "feat: wire successor Gestión surface"
          git push origin HEAD:implementation/phase4a-successor-cycle
