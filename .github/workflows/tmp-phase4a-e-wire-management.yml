name: Temporary Phase4A E wire management

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/tmp-phase4a-e-wire-management.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0

      - name: Apply exactly one guarded wiring patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt")
          text = path.read_text()
          pattern = re.compile(
              r"(?P<indent>^[ \t]*)CharacterTabV4\.MANAGEMENT\s*->\s*CharacterManagementTabV4\(\s*"
              r"sheet\s*=\s*stored,\s*"
              r"closureState\s*=\s*closureState,\s*"
              r"onSheetChange\s*=\s*::persistOperationalSheet,\s*"
              r"onClosureStateChange\s*=\s*::persistClosureState,\s*"
              r"structuralEditingEnabled\s*=\s*structuralEditingEnabled,\s*"
              r"wide\s*=\s*wide,\s*"
              r"hapticsEnabled\s*=\s*closureState\.hapticsEnabled,\s*"
              r"\)",
              re.MULTILINE,
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one Gestión wiring anchor, found {len(matches)}")
          indent = matches[0].group("indent")
          inner = indent + "    "
          replacement = "\n".join([
              f"{indent}CharacterTabV4.MANAGEMENT -> CharacterManagementSuccessorTabV4(",
              f"{inner}sheet = stored,",
              f"{inner}generalDraftSheet = settingsSheet,",
              f"{inner}closureState = closureState,",
              f"{inner}onSheetChange = ::persistOperationalSheet,",
              f"{inner}onClosureStateChange = ::persistClosureState,",
              f"{inner}structuralEditingEnabled = structuralEditingEnabled,",
              f"{inner}wide = wide,",
              f"{inner}hapticsEnabled = closureState.hapticsEnabled,",
              f"{indent})",
          ])
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one replacement, got {count}")
          path.write_text(updated)
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          test "$(grep -c 'CharacterTabV4.MANAGEMENT -> CharacterManagementSuccessorTabV4(' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt)" -eq 1
          test "$(grep -c 'CharacterTabV4.MANAGEMENT -> CharacterManagementTabV4(' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt)" -eq 0
          git diff -- androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt

      - name: Commit wiring and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-phase4a-e-wire-management.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt .github/workflows/tmp-phase4a-e-wire-management.yml
          git commit -m "feat: wire successor Gestión surface"
          git push origin HEAD:implementation/phase4a-successor-cycle
