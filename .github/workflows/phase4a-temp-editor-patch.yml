name: Phase4A temporary editor patch

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/phase4a-temp-editor-patch.yml

permissions:
  contents: write

jobs:
  patch-editor:
    if: github.event.head_commit.message == 'chore: stage temporary Phase4A editor patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0

      - name: Apply exact General successor wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt')
          text = path.read_text()

          replacements = [
              (
                  '''    val settingsSheet = draft.toSheetOrNull(stored, blankRequiredAsZero = true) ?: stored\n    val suggestedModules = suggestedCharacterModules(settingsSheet.classes)''',
                  '''    val settingsSheet = draft.toSheetOrNull(stored, blankRequiredAsZero = true) ?: stored\n    val overviewProjectionSheet = settingsSheet.copy(\n        background = backgroundDraft,\n        inventoryItems = equipmentDraft.items,\n        proficiencies = proficiencyDraft,\n        spellcastingSources = spellcastingDraft.sources,\n        spells = spellcastingDraft.spells,\n    )\n    val suggestedModules = suggestedCharacterModules(settingsSheet.classes)''',
              ),
              (
                  '''                        CharacterTabV4.OVERVIEW -> OverviewTabV4(\n                            draft = draft,\n                            stored = stored,\n                            closureState = closureState,\n                            wide = wide,\n                            onDraftChange = ::updateStructuralDraft,\n                            onClosureStateChange = ::persistStructuralClosureState,\n                        )''',
                  '''                        CharacterTabV4.OVERVIEW -> OverviewTabV4(\n                            draft = draft,\n                            stored = stored,\n                            projectionSheet = overviewProjectionSheet,\n                            closureState = closureState,\n                            wide = wide,\n                            onDraftChange = ::updateStructuralDraft,\n                            onOperationalSheetChange = ::persistOperationalSheet,\n                            onClosureStateChange = ::persistStructuralClosureState,\n                        )''',
              ),
              (
                  '''private fun OverviewTabV4(\n    draft: CharacterEditorDraftV4,\n    stored: CharacterSheet,\n    closureState: CharacterClosureState,\n    wide: Boolean,\n    onDraftChange: (CharacterEditorDraftV4) -> Unit,\n    onClosureStateChange: (CharacterClosureState) -> Unit,\n) {''',
                  '''private fun OverviewTabV4(\n    draft: CharacterEditorDraftV4,\n    stored: CharacterSheet,\n    projectionSheet: CharacterSheet,\n    closureState: CharacterClosureState,\n    wide: Boolean,\n    onDraftChange: (CharacterEditorDraftV4) -> Unit,\n    onOperationalSheetChange: (CharacterSheet) -> Unit,\n    onClosureStateChange: (CharacterClosureState) -> Unit,\n) {''',
              ),
              (
                  '''        if (stored.spellcasterEnabled) {\n            item {\n                QuickMagicCardV4(draft, onDraftChange)\n            }\n        }\n        item {\n            CharacterGeneralClosureCardsV4(''',
                  '''        item {\n            CharacterGeneralSuccessorCardsV4(\n                projectionSheet = projectionSheet,\n                onInspirationChange = { enabled ->\n                    onOperationalSheetChange(stored.copy(inspiration = enabled))\n                },\n                onResourceValueChange = { resourceId, value ->\n                    onOperationalSheetChange(\n                        stored.copy(\n                            resources = stored.resources.map { resource ->\n                                if (resource.id == resourceId) resource.copy(currentValue = value) else resource\n                            },\n                        ),\n                    )\n                },\n            )\n        }\n        item {\n            CharacterGeneralClosureCardsV4(''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check

      - name: Commit surgical editor wiring and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/phase4a-temp-editor-patch.yml
          git config user.name 'MrSimkin'
          git config user.email 'gustavo.munoz.s@outlook.com'
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt .github/workflows/phase4a-temp-editor-patch.yml
          git commit -m 'android: wire successor General canonical projections'
          git push origin HEAD:implementation/phase4a-successor-cycle
