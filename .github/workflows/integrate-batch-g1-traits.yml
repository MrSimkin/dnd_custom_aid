name: One-time Batch G1 traits wiring

on:
  push:
    branches:
      - implementation/phase4-character-closure

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply guarded G1 traits patch
        run: python .github/scripts/apply_batch_g1_traits_ui.py
      - name: Remove one-time scaffolding
        run: rm .github/scripts/apply_batch_g1_traits_ui.py .github/workflows/integrate-batch-g1-traits.yml
      - name: Verify whitespace
        run: git diff --check
      - name: Commit G1 traits integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate Batch G1 traits closure UI'
          git push
