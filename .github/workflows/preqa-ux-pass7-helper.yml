name: Pre-QA UX repair pass 7 helper

on:
  push:
    branches:
      - implementation/phase4-preqa-ux-repair

permissions:
  contents: write

env:
  REVIEW_VERSION: "0.4.0-preqa.7"
  REVIEW_BUILD: "40700"
  REVIEW_APK: "DND_Custom_Aid_0.4.0-preqa.7_Build_40700_debug.apk"
  REVIEW_ARTIFACT: "DND-Custom-Aid-0.4.0-preqa.7-build-40700-debug"

jobs:
  repair:
    if: github.event.head_commit.message == 'Execute durable pre-QA UX repair pass 7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply fail-closed final spacing pass
        run: python tools/preqa_ux_pass7.py

      - name: Verify final spacing shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'versionCode = 40700' androidApp/build.gradle.kts
          grep -q 'versionName = "0.4.0-preqa.7"' androidApp/build.gradle.kts
          if grep -R -n --include='*.kt' -E 'Arrangement\.spacedBy\([0-9]+\.dp\)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android; then
            echo 'Raw numeric Arrangement spacing remains after final sweep' >&2
            exit 1
          fi
          grep -q 'Canvas(modifier = Modifier.padding(9.dp))' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt
          grep -q 'modifier = Modifier.padding(horizontal = 6.dp, vertical = 2.dp)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSemanticBadgesV4.kt
          grep -q 'wideMax = if (special) 3 else 5' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt
          grep -q 'constrainedCardColumnsV4(wide = wide, phoneMax = 2, wideMax = 4)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCombatTabV4.kt
          grep -q 'constrainedCardColumnsV4(wide = wide, phoneMax = 2, wideMax = 4)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt
          grep -q 'constrainedCardColumnsV4(wide = wide, phoneMax = 2, wideMax = 4)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterNotesTabV4.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: "false"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore

      - name: Build and test Kotlin surfaces
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Type-check backend
        working-directory: backend
        run: npm install --no-package-lock && npm run check

      - name: Prepare identified review APK
        run: |
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "$RUNNER_TEMP/$REVIEW_APK"
          echo "APK_SHA256=$(sha256sum "$RUNNER_TEMP/$REVIEW_APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c%s "$RUNNER_TEMP/$REVIEW_APK")" >> "$GITHUB_ENV"

      - name: Upload review APK
        uses: actions/upload-artifact@v7
        with:
          name: DND-Custom-Aid-0.4.0-preqa.7-build-40700-debug
          path: ${{ runner.temp }}/DND_Custom_Aid_0.4.0-preqa.7_Build_40700_debug.apk
          if-no-files-found: error

      - name: Remove temporary repair infrastructure
        run: |
          cp tools/preqa_checkpoint_pass7.py "$RUNNER_TEMP/preqa_checkpoint_pass7.py"
          rm -f tools/preqa_ux_pass7.py tools/preqa_checkpoint_pass7.py
          rm -f .github/workflows/preqa-ux-pass7-audit.yml .github/workflows/preqa-ux-pass7-helper.yml

      - name: Commit tested product repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement pre-QA UX repair pass 7"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Write owner-required pass checkpoint and audition guide
        run: python "$RUNNER_TEMP/preqa_checkpoint_pass7.py"

      - name: Commit checkpoint and audition guide
        run: |
          git add docs/PROJECT_STATE.md docs/checkpoints docs/PREQA_OWNER_VISUAL_AUDITION.md
          git commit -m "Checkpoint pre-QA UX repair pass 7"

      - name: Push tested repair and checkpoint
        run: git push origin HEAD:implementation/phase4-preqa-ux-repair
