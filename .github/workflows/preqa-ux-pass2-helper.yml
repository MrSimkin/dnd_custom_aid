name: Pre-QA UX repair pass 2 helper

on:
  push:
    branches:
      - implementation/phase4-preqa-ux-repair

permissions:
  contents: write

env:
  REVIEW_VERSION: "0.4.0-preqa.2"
  REVIEW_BUILD: "40200"
  REVIEW_APK: "DND_Custom_Aid_0.4.0-preqa.2_Build_40200_debug.apk"

jobs:
  repair:
    if: github.event.head_commit.message == 'Execute durable pre-QA UX repair pass 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Keep workflow naming change out of runner push
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/preqa_ux_pass2.py')
          s = p.read_text(encoding='utf-8')
          start_marker = '# Give both the GitHub artifact and the APK payload an unmistakable identity.'
          end_marker = '# ---------------------------------------------------------------------------\n# Proper-name input normalization, shared and tested.'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          s = s[:start] + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply fail-closed repair pass
        run: python tools/preqa_ux_pass2.py

      - name: Check patch whitespace
        run: git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: "false"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore

      - name: Build and test Kotlin surfaces
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Type-check backend
        working-directory: backend
        run: npm install --no-package-lock && npm run check

      - name: Prepare review APK
        run: cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "$RUNNER_TEMP/$REVIEW_APK"

      - name: Upload review APK
        uses: actions/upload-artifact@v7
        with:
          name: DND-Custom-Aid-0.4.0-preqa.2-build-40200-debug
          path: ${{ runner.temp }}/DND_Custom_Aid_0.4.0-preqa.2_Build_40200_debug.apk
          if-no-files-found: error

      - name: Remove temporary ordinary helpers
        run: |
          rm tools/preqa_ux_pass2.py
          rm tools/preqa_checkpoint_pass2.py
          rm tools/execute_pass2.marker

      - name: Commit tested product repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement pre-QA UX repair pass 2"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Write owner-required pass checkpoint
        run: |
          git show HEAD^:tools/preqa_checkpoint_pass2.py > tools/preqa_checkpoint_pass2_runtime.py
          python tools/preqa_checkpoint_pass2_runtime.py
          rm tools/preqa_checkpoint_pass2_runtime.py

      - name: Commit checkpoint
        run: |
          git add docs/PROJECT_STATE.md docs/checkpoints AGENTS.md
          git commit -m "Checkpoint pre-QA UX repair pass 2"

      - name: Push tested repair and checkpoint
        run: git push origin HEAD:implementation/phase4-preqa-ux-repair
