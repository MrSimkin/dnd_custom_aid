name: Owner settings refinement

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/acceptance-settings-refinement.yml

permissions:
  contents: write

jobs:
  refine-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Guard settings boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f .maintenance/acceptance_settings_refinement.py
          test "$(git rev-parse HEAD:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt)" = "2f901e63f234a82d43ba5f658ff43109cffd517a"
      - name: Apply owner settings refinement
        run: python3 .maintenance/acceptance_settings_refinement.py
      - name: Guard product diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt"
          grep -q 'SELECTABLE_FONT_CHOICES_V4' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
          grep -q 'Texto libre para historia' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt
      - name: Focused compile and shared tests
        run: gradle :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit refinement and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .maintenance/acceptance_settings_refinement.py
          rm .github/workflows/acceptance-settings-refinement.yml
          rmdir .maintenance 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refine: tune settings previews fonts and themes'
          git push origin HEAD:implementation/phase4a-successor-cycle
