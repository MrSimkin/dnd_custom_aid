name: One-time Batch G2 spells wiring

on:
  push:
    branches:
      - implementation/phase4-character-closure
    paths:
      - .github/workflows/integrate-batch-g2-spells.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4-character-closure
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply guarded G2 spells patch
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          spells_tab = "androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellsTabV4.kt"
          replace_once(
              spells_tab,
              "import io.github.mrsimkin.dndcustomaid.shared.character.CharacterSpellcastingSource\n",
              "import io.github.mrsimkin.dndcustomaid.shared.character.CharacterClosureState\nimport io.github.mrsimkin.dndcustomaid.shared.character.CharacterSpellcastingSource\n",
          )
          replace_once(
              spells_tab,
              """internal fun CharacterSpellsTabV4(\n    draft: CharacterSpellcastingDraftV4,\n    slotStates: List<CharacterSpellSlotUiV4>,\n    classOptions: List<SpellSourceClassOptionV4>,\n    onDraftChange: (CharacterSpellcastingDraftV4) -> Unit,\n    onSlotSpentChange: (Int, Int) -> Unit,\n    wide: Boolean,\n) {""",
              """internal fun CharacterSpellsTabV4(\n    draft: CharacterSpellcastingDraftV4,\n    slotStates: List<CharacterSpellSlotUiV4>,\n    classOptions: List<SpellSourceClassOptionV4>,\n    closureState: CharacterClosureState,\n    persistedSpellIds: Set<Uuid>,\n    onDraftChange: (CharacterSpellcastingDraftV4) -> Unit,\n    onSlotSpentChange: (Int, Int) -> Unit,\n    onClosureStateChange: (CharacterClosureState) -> Unit,\n    wide: Boolean,\n    hapticsEnabled: Boolean,\n) {""",
          )
          replace_once(
              spells_tab,
              """        CharacterSpellListV4(\n            draft = draft,\n            slotStates = slotStates,\n            selectedSourceId = selectedSource?.id,\n            onDraftChange = onDraftChange,\n            onSlotSpentChange = onSlotSpentChange,\n            wide = wide,\n        )""",
              """        CharacterSpellListClosureV4(\n            draft = draft,\n            slotStates = slotStates,\n            selectedSourceId = selectedSource?.id,\n            closureState = closureState,\n            persistedSpellIds = persistedSpellIds,\n            onDraftChange = onDraftChange,\n            onSlotSpentChange = onSlotSpentChange,\n            onClosureStateChange = onClosureStateChange,\n            wide = wide,\n            hapticsEnabled = hapticsEnabled,\n        )""",
          )

          editor = "androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt"
          replace_once(
              editor,
              """        val liveTraitIds = stored.traits.mapTo(mutableSetOf()) { it.id }\n        val prunedQuickAccess = closureState.quickAccess\n            .filter { reference ->\n                reference.kind != CharacterQuickAccessKind.TRAIT || reference.targetId in liveTraitIds\n            }\n            .mapIndexed { index, reference -> reference.copy(sortOrder = index) }""",
              """        val liveTraitIds = stored.traits.mapTo(mutableSetOf()) { it.id }\n        val liveSpellIds = stored.spells.mapTo(mutableSetOf()) { it.id }\n        val prunedQuickAccess = closureState.quickAccess\n            .filter { reference ->\n                when (reference.kind) {\n                    CharacterQuickAccessKind.TRAIT -> reference.targetId in liveTraitIds\n                    CharacterQuickAccessKind.SPELL -> reference.targetId in liveSpellIds\n                    else -> true\n                }\n            }\n            .mapIndexed { index, reference -> reference.copy(sortOrder = index) }""",
          )
          replace_once(
              editor,
              """                            classOptions = draft.classes.map { SpellSourceClassOptionV4(it.id, it.name) },\n                            onDraftChange = ::updateSpellcasting,""",
              """                            classOptions = draft.classes.map { SpellSourceClassOptionV4(it.id, it.name) },\n                            closureState = closureState,\n                            persistedSpellIds = stored.spells.mapTo(mutableSetOf()) { it.id },\n                            onDraftChange = ::updateSpellcasting,""",
          )
          replace_once(
              editor,
              """                            },\n                            wide = wide,\n                        )\n                        CharacterTabV4.NOTES""",
              """                            },\n                            onClosureStateChange = ::persistClosureState,\n                            wide = wide,\n                            hapticsEnabled = closureState.hapticsEnabled,\n                        )\n                        CharacterTabV4.NOTES""",
          )

          closure_list = "androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt"
          replace_once(
              closure_list,
              """    val editorAssociated = parseSpellIdSetG2(editorAssociatedSourceIds)\n    val editorPrepared = parseSpellIdSetG2(editorPreparedSourceIds)\n    val parsedEditorLevel = editorLevel.trim().toIntOrNull()\n    val editorCanSave = editorName.trim().isNotEmpty() &&\n        parsedEditorLevel != null && parsedEditorLevel in 0..9 && editorAssociated.isNotEmpty()""",
              """    val validEditorSourceKeys = draft.sources.mapTo(mutableSetOf()) { it.id.toString() }\n    val editorAssociated = parseSpellIdSetG2(editorAssociatedSourceIds).intersect(validEditorSourceKeys)\n    val editorPrepared = parseSpellIdSetG2(editorPreparedSourceIds).intersect(validEditorSourceKeys)\n    val parsedEditorLevel = editorLevel.trim().toIntOrNull()\n    val editorCanSave = editorName.trim().isNotEmpty() &&\n        parsedEditorLevel != null && parsedEditorLevel in 0..9 && editorAssociated.isNotEmpty()""",
          )
          PY
      - name: Remove one-time scaffolding
        run: rm .github/workflows/integrate-batch-g2-spells.yml
      - name: Verify whitespace
        run: git diff --check
      - name: Commit G2 spells integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellsTabV4.kt androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt .github/workflows/integrate-batch-g2-spells.yml
          git commit -m 'feat: integrate Batch G2 spells closure UI'
          git push
