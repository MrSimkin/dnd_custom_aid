name: App-wide text-area density repair

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/acceptance-text-density.yml

permissions:
  contents: write

jobs:
  repair-text-density:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Guard density boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "d214d6e1c611cf3960ad2ea048edcd8823add703"
          test -f .maintenance/acceptance_text_density.py
      - name: Apply text-area density repair
        run: python3 .maintenance/acceptance_text_density.py
      - name: Guard product diff and residuals
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | grep -c '^androidApp/.*\.kt$')" -ge 10
          grep -q 'characterCompactTextAreaMinLinesV4' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterLayoutV4.kt
          ! grep -R -n 'heightIn(min = 220.dp, max = 340.dp)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android
          ! grep -R -n 'min = if (wide) 260.dp else 220.dp' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android
      - name: Focused shared tests and Android compile
        run: gradle :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit density repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .maintenance/acceptance_text_density.py
          rm .github/workflows/acceptance-text-density.yml
          rmdir .maintenance 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: compact app-wide multiline text areas'
          git push origin HEAD:implementation/phase4a-successor-cycle
