name: Increment G2 traits guarded implementation

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/g2-traits-apply.yml

permissions:
  contents: write

jobs:
  apply-g2-traits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Apply guarded G2 traits transformations
        run: python3 .maintenance/g2_traits_apply.py
      - name: Guard diff
        run: |
          git diff --check
          ! grep -q 'Especie / raza' shared/src/commonMain/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterTraitOperations.kt
          ! grep -q 'especie/raza' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt
          grep -q 'CharacterResourcePlacement.TRAITS' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt
          grep -q 'CharacterProvenanceRowV4' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt
          grep -q 'characterMeasuredGridReorderDragV4' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt
      - name: Focused compile and tests
        run: gradle :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit G2 traits product and self-remove helper
        run: |
          rm -f .github/workflows/g2-traits-apply.yml .maintenance/g2_traits_apply.py
          rmdir .maintenance 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: repair Increment G2 traits projections'
          git push origin HEAD:implementation/phase4a-successor-cycle
