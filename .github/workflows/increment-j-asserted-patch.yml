name: Increment J asserted editor patch

on:
  push:
    branches:
      - tmp/increment-j-notes-tab
    paths:
      - .github/workflows/increment-j-asserted-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/increment-j-notes-tab
      - name: Apply asserted editor patches
        run: python .github/scripts/increment_j_patch.py
      - name: Commit clean Notes wiring
        run: |
          rm .github/scripts/increment_j_patch.py
          rm .github/workflows/increment-j-asserted-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No patch changes staged"; exit 1; }
          git commit -m "Wire persistent Notes tab into character editor"
          git push origin HEAD:tmp/increment-j-notes-tab
