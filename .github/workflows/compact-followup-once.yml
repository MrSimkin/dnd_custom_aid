name: Compact follow-up once

on:
  push:
    paths:
      - '.github/workflows/compact-followup-once.yml'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Run guarded compact migration
        run: python3 .github/scripts/compact-followup-once.py
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Compile compact follow-up
        run: gradle :androidApp:compileDebugKotlin --stacktrace
      - name: Commit compact follow-up and self-remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/compact-followup-once.yml
          rm .github/scripts/compact-followup-once.py
          rmdir .github/scripts 2>/dev/null || true
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android .github/workflows/compact-followup-once.yml .github/scripts/compact-followup-once.py
          git commit -m 'fix: compact secondary cards and short editor fields'
          git push
