name: One-time G2 density refinement

on:
  push:
    branches:
      - implementation/phase4-character-closure
    paths:
      - .github/workflows/refine-batch-g2-spell-row-density.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4-character-closure
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply guarded density patch
        run: python scripts/refine_g2_spell_row_density.py
      - name: Remove one-time scaffolding
        run: rm .github/workflows/refine-batch-g2-spell-row-density.yml scripts/refine_g2_spell_row_density.py
      - name: Verify whitespace
        run: git diff --check
      - name: Commit density refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt .github/workflows/refine-batch-g2-spell-row-density.yml scripts/refine_g2_spell_row_density.py
          git commit -m 'fix: refine G2 spell row phone density'
          git push
