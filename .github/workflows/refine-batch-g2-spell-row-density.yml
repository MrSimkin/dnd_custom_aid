name: One-time Batch G2 spell row density refinement

on:
  push:
    branches:
      - implementation/phase4-character-closure
    paths:
      - .github/workflows/refine-batch-g2-spell-row-density.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4-character-closure
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply guarded density patch
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt')
          text = path.read_text()
          old = '''                if (selectedAssociation != null && selectedSourceId != null) {
                    Column(horizontalAlignment = Alignment.CenterHorizontally) {
                        Checkbox(
                            checked = selectedAssociation.prepared,
                            onCheckedChange = onPreparedChange,
                        )
                        Text("Preparado", style = MaterialTheme.typography.labelSmall)
                    }
                }
                TextButton(
                    onClick = { onFavoriteChange(!favorite) },
                    enabled = favoriteEnabled,
                    contentPadding = PaddingValues(horizontal = 5.dp, vertical = 0.dp),
                ) {
                    Text(if (favorite) "★" else "☆")
                }
                TextButton(
                    onClick = onDuplicate,
                    contentPadding = PaddingValues(horizontal = 5.dp, vertical = 0.dp),
                ) {
                    Text("Duplicar")
                }
                StableRemoveIconButton(
                    onClick = onDelete,
                    contentDescription = "Eliminar ${spell.name}",
                )
'''
          new = '''                Column(
                    horizontalAlignment = Alignment.CenterHorizontally,
                    verticalArrangement = Arrangement.spacedBy(1.dp),
                ) {
                    if (selectedAssociation != null && selectedSourceId != null) {
                        Row(verticalAlignment = Alignment.CenterVertically) {
                            Checkbox(
                                checked = selectedAssociation.prepared,
                                onCheckedChange = onPreparedChange,
                            )
                            Text("Prep.", style = MaterialTheme.typography.labelSmall)
                        }
                    }
                    Row(verticalAlignment = Alignment.CenterVertically) {
                        TextButton(
                            onClick = { onFavoriteChange(!favorite) },
                            enabled = favoriteEnabled,
                            contentPadding = PaddingValues(horizontal = 5.dp, vertical = 0.dp),
                        ) {
                            Text(if (favorite) "★" else "☆")
                        }
                        StableRemoveIconButton(
                            onClick = onDelete,
                            contentDescription = "Eliminar ${spell.name}",
                        )
                    }
                    TextButton(
                        onClick = onDuplicate,
                        contentPadding = PaddingValues(horizontal = 5.dp, vertical = 0.dp),
                    ) {
                        Text("Duplicar")
                    }
                }
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one spell-row action block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-time scaffolding
        run: rm .github/workflows/refine-batch-g2-spell-row-density.yml
      - name: Verify whitespace
        run: git diff --check
      - name: Commit density refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt .github/workflows/refine-batch-g2-spell-row-density.yml
          git commit -m 'fix: refine G2 spell row phone density'
          git push
