name: Temporary Phase 4A transversal geometry repair

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/tmp-phase4a-preqa11-transversal-geometry-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: "false"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Apply guarded transversal control repair
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import pathlib
          import re

          root = pathlib.Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android')
          primitive = root / 'CharacterCompactControlPrimitivesV4.kt'
          if primitive.exists():
              raise SystemExit(f'{primitive} already exists; refusing ambiguous rerun')

          primitive.write_text(r'''package io.github.mrsimkin.dndcustomaid.android

import androidx.compose.foundation.BorderStroke
import androidx.compose.foundation.clickable
import androidx.compose.foundation.layout.Arrangement
import androidx.compose.foundation.layout.Box
import androidx.compose.foundation.layout.Column
import androidx.compose.foundation.layout.Row
import androidx.compose.foundation.layout.fillMaxWidth
import androidx.compose.foundation.layout.heightIn
import androidx.compose.foundation.layout.padding
import androidx.compose.foundation.layout.weight
import androidx.compose.foundation.text.BasicTextField
import androidx.compose.foundation.text.KeyboardOptions
import androidx.compose.material3.LocalContentColor
import androidx.compose.material3.MaterialTheme
import androidx.compose.material3.ProvideTextStyle
import androidx.compose.material3.Surface
import androidx.compose.material3.Text
import androidx.compose.runtime.Composable
import androidx.compose.runtime.CompositionLocalProvider
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.graphics.SolidColor
import androidx.compose.ui.unit.dp

/**
 * Shared compact Player field geometry for Phase 4A.
 *
 * Material OutlinedTextField defaults previously left editor/form fields with inconsistent
 * internal vertical whitespace. This primitive owns that whitespace directly while preserving
 * the accepted 48dp-or-larger single-line interaction envelope, font-scale growth, multiline
 * content growth, numeric keyboards, disabled/read-only semantics, error state and support text.
 */
@Composable
internal fun CharacterCompactOutlinedTextFieldV4(
    value: String,
    onValueChange: (String) -> Unit,
    modifier: Modifier = Modifier,
    enabled: Boolean = true,
    readOnly: Boolean = false,
    label: (@Composable () -> Unit)? = null,
    placeholder: (@Composable () -> Unit)? = null,
    supportingText: (@Composable () -> Unit)? = null,
    prefix: (@Composable () -> Unit)? = null,
    isError: Boolean = false,
    keyboardOptions: KeyboardOptions = KeyboardOptions.Default,
    singleLine: Boolean = false,
    minLines: Int = 1,
    maxLines: Int = Int.MAX_VALUE,
) {
    val resolvedMinLines = if (singleLine) 1 else minLines.coerceAtLeast(1)
    val resolvedMaxLines = if (singleLine) 1 else maxLines.coerceAtLeast(resolvedMinLines)
    val contentColor = when {
        !enabled -> MaterialTheme.colorScheme.onSurface.copy(alpha = 0.38f)
        else -> MaterialTheme.colorScheme.onSurface
    }
    val secondaryColor = when {
        !enabled -> MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = 0.38f)
        isError -> MaterialTheme.colorScheme.error
        else -> MaterialTheme.colorScheme.onSurfaceVariant
    }
    val borderColor = when {
        !enabled -> MaterialTheme.colorScheme.outlineVariant.copy(alpha = 0.55f)
        isError -> MaterialTheme.colorScheme.error
        else -> MaterialTheme.colorScheme.outline
    }

    Column(modifier = modifier) {
        Surface(
            modifier = Modifier
                .fillMaxWidth()
                .then(
                    if (singleLine) {
                        Modifier.heightIn(min = characterCompactSingleLineFieldHeightV4())
                    } else {
                        Modifier
                    },
                ),
            shape = MaterialTheme.shapes.extraSmall,
            border = BorderStroke(1.dp, borderColor),
            color = MaterialTheme.colorScheme.surfaceContainerLow,
        ) {
            Column(
                modifier = Modifier
                    .fillMaxWidth()
                    .padding(
                        horizontal = 8.dp,
                        vertical = if (singleLine) 3.dp else 5.dp,
                    ),
                verticalArrangement = Arrangement.spacedBy(1.dp),
            ) {
                label?.let { labelContent ->
                    CompositionLocalProvider(LocalContentColor provides secondaryColor) {
                        ProvideTextStyle(MaterialTheme.typography.labelSmall) {
                            labelContent()
                        }
                    }
                }
                Row(
                    modifier = Modifier.fillMaxWidth(),
                    verticalAlignment = if (singleLine) Alignment.CenterVertically else Alignment.Top,
                ) {
                    prefix?.let { prefixContent ->
                        CompositionLocalProvider(LocalContentColor provides contentColor) {
                            ProvideTextStyle(MaterialTheme.typography.bodyMedium) {
                                prefixContent()
                            }
                        }
                        androidx.compose.foundation.layout.Spacer(modifier = Modifier.padding(horizontal = 2.dp))
                    }
                    Box(modifier = Modifier.weight(1f)) {
                        if (value.isEmpty()) {
                            placeholder?.let { placeholderContent ->
                                CompositionLocalProvider(LocalContentColor provides secondaryColor) {
                                    ProvideTextStyle(MaterialTheme.typography.bodyMedium) {
                                        placeholderContent()
                                    }
                                }
                            }
                        }
                        BasicTextField(
                            value = value,
                            onValueChange = onValueChange,
                            modifier = Modifier.fillMaxWidth(),
                            enabled = enabled,
                            readOnly = readOnly,
                            textStyle = MaterialTheme.typography.bodyMedium.copy(color = contentColor),
                            keyboardOptions = keyboardOptions,
                            singleLine = singleLine,
                            minLines = resolvedMinLines,
                            maxLines = resolvedMaxLines,
                            cursorBrush = SolidColor(MaterialTheme.colorScheme.primary),
                        )
                    }
                }
            }
        }
        supportingText?.let { supportingContent ->
            Box(modifier = Modifier.padding(start = 8.dp, end = 8.dp, top = 2.dp)) {
                CompositionLocalProvider(LocalContentColor provides secondaryColor) {
                    ProvideTextStyle(MaterialTheme.typography.labelSmall) {
                        supportingContent()
                    }
                }
            }
        }
    }
}

/**
 * Compact visual glyph selector with a safe interaction envelope.
 * The visible +/- control follows the existing 30-34dp compact step/action grammar while the
 * surrounding hit target remains at least 48dp high, so compact appearance does not mean a tiny
 * touch target.
 */
@Composable
internal fun CharacterCompactGlyphSelectorV4(
    glyph: String,
    onClick: () -> Unit,
    modifier: Modifier = Modifier,
    enabled: Boolean = true,
) {
    val contentColor = if (enabled) {
        MaterialTheme.colorScheme.onSurface
    } else {
        MaterialTheme.colorScheme.onSurface.copy(alpha = 0.38f)
    }
    val borderColor = if (enabled) {
        MaterialTheme.colorScheme.outline
    } else {
        MaterialTheme.colorScheme.outlineVariant.copy(alpha = 0.55f)
    }
    Box(
        modifier = modifier
            .heightIn(min = characterCompactSingleLineFieldHeightV4())
            .clickable(enabled = enabled, onClick = onClick),
        contentAlignment = Alignment.Center,
    ) {
        Surface(
            modifier = Modifier.fillMaxWidth().heightIn(min = 34.dp),
            shape = MaterialTheme.shapes.extraSmall,
            border = BorderStroke(1.dp, borderColor),
            color = MaterialTheme.colorScheme.surfaceContainerLow,
        ) {
            Box(
                modifier = Modifier.fillMaxWidth().padding(horizontal = 4.dp, vertical = 3.dp),
                contentAlignment = Alignment.Center,
            ) {
                Text(
                    glyph,
                    style = MaterialTheme.typography.labelLarge,
                    color = contentColor,
                    maxLines = 1,
                )
            }
        }
    }
}
''', encoding='utf-8')

          migrated = 0
          touched = []
          pattern = re.compile(r'(?<![A-Za-z0-9_])OutlinedTextField\s*\(')
          for path in sorted(root.glob('*.kt')):
              if path == primitive:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace('androidx.compose.material3.OutlinedTextField(', 'CharacterCompactOutlinedTextFieldV4(')
              text, count = pattern.subn('CharacterCompactOutlinedTextFieldV4(', text)
              migrated += count
              text = text.replace('import androidx.compose.material3.OutlinedTextField\n', '')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  touched.append(path.name)

          if migrated != 160:
              raise SystemExit(f'Expected exactly 160 raw OutlinedTextField call sites, migrated {migrated}')

          combat = root / 'CharacterCombatSuccessorV4.kt'
          text = combat.read_text(encoding='utf-8')
          old = '''            OutlinedButton(onClick = { signExpanded = true }, modifier = Modifier.fillMaxWidth().heightIn(min = characterCompactSingleLineFieldHeightV4()), contentPadding = PaddingValues(horizontal = 4.dp, vertical = 0.dp)) {
                Text(if (parsed.negativeDice) "−" else "+")
            }
'''
          new = '''            CharacterCompactGlyphSelectorV4(
                glyph = if (parsed.negativeDice) "−" else "+",
                onClick = { signExpanded = true },
                modifier = Modifier.fillMaxWidth(),
            )
'''
          if text.count(old) != 1:
              raise SystemExit('Structured-dice sign selector source no longer matches guarded pre-repair form')
          combat.write_text(text.replace(old, new), encoding='utf-8')

          guard = pathlib.Path('scripts/check_player_control_geometry.py')
          guard.parent.mkdir(parents=True, exist_ok=True)
          guard.write_text(r'''#!/usr/bin/env python3
from __future__ import annotations
import pathlib
import re
import sys

ROOT = pathlib.Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android')
raw_pattern = re.compile(r'(?<![A-Za-z0-9_])OutlinedTextField\s*\(')
raw_sites = []
material_imports = []
compact_calls = 0
for path in sorted(ROOT.glob('*.kt')):
    text = path.read_text(encoding='utf-8')
    for match in raw_pattern.finditer(text):
        raw_sites.append(f'{path.name}:{text.count(chr(10), 0, match.start()) + 1}')
    if 'import androidx.compose.material3.OutlinedTextField' in text:
        material_imports.append(path.name)
    compact_calls += text.count('CharacterCompactOutlinedTextFieldV4(')

errors = []
if raw_sites:
    errors.append('raw Material OutlinedTextField call sites remain: ' + ', '.join(raw_sites))
if material_imports:
    errors.append('raw Material OutlinedTextField imports remain: ' + ', '.join(material_imports))
# 160 migrated call sites plus the shared primitive declaration at the current repair boundary.
if compact_calls < 161:
    errors.append(f'expected at least 160 compact Player field usages; observed count including declaration={compact_calls}')

combat = (ROOT / 'CharacterCombatSuccessorV4.kt').read_text(encoding='utf-8')
marker = 'var signExpanded by remember { mutableStateOf(false) }'
start = combat.find(marker)
end = combat.find('DropdownMenu(', start)
if start < 0 or end < 0:
    errors.append('structured-dice sign selector boundary not found')
else:
    sign_block = combat[start:end]
    if 'CharacterCompactGlyphSelectorV4(' not in sign_block:
        errors.append('structured-dice +/- selector is not using the compact glyph selector')
    if 'OutlinedButton(' in sign_block:
        errors.append('structured-dice +/- selector regressed to raw OutlinedButton geometry')

if errors:
    for error in errors:
        print('ERROR:', error, file=sys.stderr)
    raise SystemExit(1)
print(f'Player compact-control geometry guard PASS: compactFieldCount={compact_calls - 1}; rawMaterialFields=0; diceSign=shared-compact-glyph')
''', encoding='utf-8')

          scaffold = pathlib.Path('.github/workflows/scaffold-check.yml')
          text = scaffold.read_text(encoding='utf-8')
          needle = '''      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
'''
          insert = '''      - name: Guard compact Player control geometry
        run: python3 scripts/check_player_control_geometry.py
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
'''
          if text.count(needle) != 1:
              raise SystemExit('Scaffold insertion anchor no longer unique')
          scaffold.write_text(text.replace(needle, insert), encoding='utf-8')

          print(f'Migrated raw field sites: {migrated}')
          print('Touched field files:', ', '.join(touched))
          print('Added shared compact field + glyph primitives and persistent source guard.')
          PY

      - name: Focused geometry source guard
        run: python3 scripts/check_player_control_geometry.py

      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore

      - name: Focused Android compile
        run: gradle :androidApp:assembleDebug --stacktrace

      - name: Commit exact product repair
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android \
            scripts/check_player_control_geometry.py \
            .github/workflows/scaffold-check.yml
          if git diff --cached --quiet; then
            echo "No repair diff produced" >&2
            exit 1
          fi
          git commit -m "repair: normalize Player control vertical geometry"
          git push origin HEAD:implementation/phase4a-successor-cycle
