name: Temporary Phase 4A transversal geometry repair

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/tmp-phase4a-preqa11-transversal-geometry-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: "false"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Apply guarded transversal control repair
        shell: bash
        run: |
          set -euo pipefail
          test ! -e androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCompactControlPrimitivesV4.kt
          printf '%s' '' | base64 --decode > androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCompactControlPrimitivesV4.kt
          printf '%s' ' ' | base64 --decode > scripts/check_player_control_geometry.py
          python3 - <<'PY'
          from __future__ import annotations
          import pathlib
          import re

          root = pathlib.Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android')
          primitive = root / 'CharacterCompactControlPrimitivesV4.kt'
          migrated = 0
          touched = []
          pattern = re.compile(r'(?<![A-Za-z0-9_])OutlinedTextField\s*\(')

          for path in sorted(root.glob('*.kt')):
              if path == primitive:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              qualified = 'androidx.compose.material3.OutlinedTextField('
              qualified_count = text.count(qualified)
              text = text.replace(qualified, 'CharacterCompactOutlinedTextFieldV4(')
              text, plain_count = pattern.subn('CharacterCompactOutlinedTextFieldV4(', text)
              migrated += qualified_count + plain_count
              text = text.replace('import androidx.compose.material3.OutlinedTextField\n', '')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  touched.append(path.name)

          if migrated != 160:
              raise SystemExit(f'Expected exactly 160 raw OutlinedTextField call sites, migrated {migrated}')

          combat = root / 'CharacterCombatSuccessorV4.kt'
          text = combat.read_text(encoding='utf-8')
          normalized_old = '            OutlinedButton(onClick = { signExpanded = true }, modifier = Modifier.fillMaxWidth().heightIn(min = characterCompactSingleLineFieldHeightV4()), contentPadding = PaddingValues(horizontal = 4.dp, vertical = 0.dp)) {\n                Text(if (parsed.negativeDice) "−" else "+")\n            }\n'
          new = '            CharacterCompactGlyphSelectorV4(\n                glyph = if (parsed.negativeDice) "−" else "+",\n                onClick = { signExpanded = true },\n                modifier = Modifier.fillMaxWidth(),\n            )\n'
          if text.count(normalized_old) != 1:
              raise SystemExit('Structured-dice sign selector source no longer matches guarded pre-repair form')
          combat.write_text(text.replace(normalized_old, new), encoding='utf-8')

          scaffold = pathlib.Path('.github/workflows/scaffold-check.yml')
          text = scaffold.read_text(encoding='utf-8')
          needle = '      - name: Prepare stable CI debug keystore\n        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore\n'
          insert = '      - name: Guard compact Player control geometry\n        run: python3 scripts/check_player_control_geometry.py\n      - name: Prepare stable CI debug keystore\n        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore\n'
          if text.count(needle) != 1:
              raise SystemExit('Scaffold insertion anchor no longer unique')
          scaffold.write_text(text.replace(needle, insert), encoding='utf-8')

          print(f'Migrated raw field sites: {migrated}')
          print('Touched field files:', ', '.join(touched))
          print('Added shared compact field + glyph primitives and persistent source guard.')
          PY

      - name: Focused geometry source guard
        run: python3 scripts/check_player_control_geometry.py

      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore

      - name: Focused Android compile
        run: gradle :androidApp:assembleDebug --stacktrace

      - name: Commit exact product repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android scripts/check_player_control_geometry.py .github/workflows/scaffold-check.yml
          if git diff --cached --quiet; then
            echo "No repair diff produced" >&2
            exit 1
          fi
          git commit -m "repair: normalize Player control vertical geometry"
          git push origin HEAD:implementation/phase4a-successor-cycle
