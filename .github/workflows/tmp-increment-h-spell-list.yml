name: Temporary Increment H compiler fix

on:
  push:
    branches:
      - tmp/increment-h-spell-list
    paths:
      - .github/increment-h-spell-list-trigger

permissions:
  contents: write

jobs:
  patch-spell-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/increment-h-spell-list
          fetch-depth: 0
      - name: Apply asserted narrow Increment H compiler fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListV4.kt')
          text = path.read_text(encoding='utf-8')
          old = '                                else -> "Revisa los datos del conjuro.",\n                            },'
          new = '                                else -> "Revisa los datos del conjuro."\n                            },'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'compiler-fix target must occur exactly once; found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListV4.kt
      - name: Commit narrow Increment H compiler fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListV4.kt
          git commit -m "Fix Increment H editor validation syntax"
          git push origin HEAD:tmp/increment-h-spell-list
