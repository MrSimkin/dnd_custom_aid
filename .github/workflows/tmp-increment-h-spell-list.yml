name: Temporary Increment H final cleanup

on:
  push:
    branches:
      - tmp/increment-h-spell-list
    paths:
      - .github/increment-h-spell-list-trigger

permissions:
  contents: write

jobs:
  finalize-h-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/increment-h-spell-list
          fetch-depth: 0
      - name: Apply asserted narrow cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          spells_path = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellsTabV4.kt')
          text = spells_path.read_text(encoding='utf-8')
          old = '''        CharacterSpellListV4(
    draft = draft,
    selectedSourceId = selectedSource?.id,
    onDraftChange = onDraftChange,
    wide = wide,
)'''
          new = '''        CharacterSpellListV4(
            draft = draft,
            selectedSourceId = selectedSource?.id,
            onDraftChange = onDraftChange,
            wide = wide,
        )'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Increment H wiring formatting target must occur exactly once; found {count}')
          spells_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          state_path = Path('docs/PROJECT_STATE.md')
          state = state_path.read_text(encoding='utf-8')
          old_status = '**Status:** Phase 3 remains complete/canonical on `main`. Phase 4 character data/persistence is functionally stable. **V4 presentation + D-0046 derived-value implementation is complete and CI-green; manual owner phone QA is now the acceptance gate before PR/merge.**'
          new_status = '**Status:** Phase 3 remains complete/canonical on `main`. Phase 4 continues on `implementation/character-data-foundation`. Increment G (`Conjuros` source management) is closed; Increment H spell list/details has been implemented on a recovery-safe candidate branch and is being closed through Gate H. Manual phone interaction/ergonomics remain a separate owner QA boundary before any Phase 4 PR/merge.'
          count = state.count(old_status)
          if count != 1:
              raise SystemExit(f'PROJECT_STATE status target must occur exactly once; found {count}')
          state = state.replace(old_status, new_status, 1)
          anchor = '\n## 1. Canonical baseline\n'
          note = '''
## 0. Latest implementation checkpoint — Conjuros

Recovery audit on 2026-09-01 established `d71a47822bcbeb0d0aa9ba404ba4fd01af81b510` as the clean Increment G closure boundary. Increment H proceeds from that exact point and implements the conceptual spell list/details layer: level grouping, source-aware filtering, compact search, spell CRUD, multi-source associations, source-specific `Preparado`, manual within-level ordering, and the approved permissive spell fields. The complete validation evidence and final closure status are recorded in the latest Increment H handoff under `docs/handoffs/`.
'''
          if state.count(anchor) != 1:
              raise SystemExit('PROJECT_STATE canonical-baseline anchor must occur exactly once')
          if '## 0. Latest implementation checkpoint — Conjuros' not in state:
              state = state.replace(anchor, note + anchor, 1)
          state_path.write_text(state, encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-increment-h-spell-list.yml .github/increment-h-spell-list-trigger
          git diff --check
          git diff -- androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellsTabV4.kt docs/PROJECT_STATE.md
          git status --short
      - name: Commit clean Increment H Gate candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare clean Increment H Gate H candidate"
          git push origin HEAD:tmp/increment-h-spell-list
