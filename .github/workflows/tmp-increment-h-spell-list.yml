name: Temporary Increment H spell-list wiring

on:
  push:
    branches:
      - tmp/increment-h-spell-list
    paths:
      - .github/increment-h-spell-list-trigger

permissions:
  contents: write

jobs:
  patch-spells-tab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/increment-h-spell-list
          fetch-depth: 0
      - name: Apply asserted narrow Increment H wiring patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellsTabV4.kt')
          text = path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          text = replace_once(
              text,
              '''    val visibleSpellCount = if (selectedSource == null) {
              draft.spells.size
          } else {
              draft.spells.count { spell -> spell.sourceAssociations.any { it.sourceId == selectedSource.id } }
          }

          ''',
              '',
              'remove Increment G placeholder count',
          )

          old = '''        LazyColumn(
              modifier = Modifier.fillMaxSize(),
              contentPadding = PaddingValues(
                  start = if (wide) 10.dp else 5.dp,
                  end = if (wide) 10.dp else 5.dp,
                  top = 7.dp,
                  bottom = 150.dp,
              ),
              verticalArrangement = Arrangement.spacedBy(7.dp),
          ) {
              item {
                  Card(modifier = Modifier.fillMaxWidth()) {
                      Column(
                          modifier = Modifier.padding(horizontal = 10.dp, vertical = 9.dp),
                          verticalArrangement = Arrangement.spacedBy(5.dp),
                      ) {
                          Text(
                              selectedSource?.name ?: "Todos los conjuros",
                              style = MaterialTheme.typography.titleSmall,
                          )
                          Text(
                              if (selectedSource == null) {
                                  "$visibleSpellCount conjuros conceptuales en la ficha."
                              } else {
                                  "$visibleSpellCount conjuros asociados a esta fuente."
                              },
                              style = MaterialTheme.typography.bodySmall,
                          )
                          if (draft.sources.isEmpty()) {
                              Text(
                                  "Aún no hay fuentes de conjuros. Puedes crear una fuente de clase, dote, origen innato o cualquier fuente personalizada.",
                                  style = MaterialTheme.typography.bodySmall,
                              )
                              TextButton(onClick = { managerOpen = true }) { Text("Gestionar fuentes") }
                          } else {
                              Text(
                                  "La navegación y gestión de fuentes están activas. La lista detallada y edición de conjuros se incorporan en el siguiente incremento.",
                                  style = MaterialTheme.typography.bodySmall,
                              )
                          }
                      }
                  }
              }
          }
          '''
          new = '''        CharacterSpellListV4(
              draft = draft,
              selectedSourceId = selectedSource?.id,
              onDraftChange = onDraftChange,
              wide = wide,
          )
          '''
          text = replace_once(text, old, new, 'replace Increment G placeholder with Increment H list')

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellsTabV4.kt
      - name: Commit narrow Increment H wiring patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellsTabV4.kt
          git commit -m "Wire Increment H spell list into Conjuros"
          git push origin HEAD:tmp/increment-h-spell-list
