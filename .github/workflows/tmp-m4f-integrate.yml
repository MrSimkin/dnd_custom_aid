name: Temporary M4f state-badge integration

on:
  push:
    branches:
      - tmp/phase4-m4f-state-badges

permissions:
  contents: write

jobs:
  integrate-and-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-m4f-state-badges
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact M4f state-badge patch
        run: python .github/tmp_m4f_integrate.py

      - name: Verify D07 reachable state grammar
        run: |
          grep -F 'SpellBadgeG2("Concentración", state = true)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt
          grep -F 'SpellBadgeG2("Preparado", state = true)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt
          grep -F 'Quitar ${spell.name} de Favoritos' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt
          grep -F 'stateLabels.forEach' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt
          grep -F 'label = "Concentración activa"' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterManagementTabV4.kt
          test "$(grep -R -F 'CharacterSemanticBadgeKindV4.STATE' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/{CharacterSpellListClosureV4.kt,CharacterEquipmentClosureV4.kt,CharacterManagementTabV4.kt} | wc -l)" -ge 3

      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore

      - name: Run shared tests and application builds
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace

      - name: Type-check backend
        working-directory: backend
        run: |
          npm install
          npm run check

      - name: Commit accepted M4f product tree and remove temporary helpers
        run: |
          rm .github/tmp_m4f_integrate.py .github/workflows/tmp-m4f-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterManagementTabV4.kt \
                  .github/tmp_m4f_integrate.py \
                  .github/workflows/tmp-m4f-integrate.yml
          git commit -m 'feat: integrate M4f state-badge grammar'
          git push origin HEAD:tmp/phase4-m4f-state-badges
