name: One-time Phase 4 Batch D Gestión repair

on:
  push:
    branches:
      - implementation/phase4-character-closure
    paths:
      - .github/workflows/phase4-batch-d-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4-character-closure
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply guarded Gestión repair
        run: python scripts/fix_phase4_batch_d_management.py
      - name: Remove one-time repair scaffolding
        run: |
          rm scripts/fix_phase4_batch_d_management.py
          rm .github/workflows/phase4-batch-d-fix.yml
      - name: Verify patch whitespace
        run: git diff --check
      - name: Commit repaired Gestión
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair Gestión resource validation"
          git push origin HEAD:implementation/phase4-character-closure
