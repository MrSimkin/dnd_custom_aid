name: Temporary Phase4A D3 result mode

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/tmp-phase4a-d3-result-mode.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - name: Apply guarded patch
        run: python .github/tmp-phase4a-d3-result-mode.py
      - name: Check diff
        run: git diff --check
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/UiPreferences.kt androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterDiceRollSuccessorV4.kt
          git rm .github/tmp-phase4a-d3-result-mode.py .github/workflows/tmp-phase4a-d3-result-mode.yml
          git commit -m "feat: add persisted Dice result presentation mode"
          git push origin HEAD:implementation/phase4a-successor-cycle
