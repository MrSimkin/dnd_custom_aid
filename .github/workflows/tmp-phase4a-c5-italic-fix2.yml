name: Temporary Phase4A C5 italic correction 2

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/tmp-phase4a-c5-italic-fix2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - name: Apply patch
        run: python .github/tmp-c5-italic.py
      - name: Check diff
        run: git diff --check
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt
          git rm .github/tmp-c5-italic.py .github/workflows/tmp-phase4a-c5-italic-fix2.yml
          git commit -m "fix: italicize custom skills in Habilidades"
          git push origin HEAD:implementation/phase4a-successor-cycle
