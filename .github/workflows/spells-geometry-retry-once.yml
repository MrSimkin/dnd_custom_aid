name: Spells geometry repair retry once

on:
  push:
    paths:
      - '.github/workflows/spells-geometry-retry-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Execute guarded repair script from rejected helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/spells-geometry-repair-once.yml').read_text(encoding='utf-8')
          marker = "python3 - <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          exec(compile(body, 'spells_geometry_repair_once.py', 'exec'))
          PY
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Compile Conjuros geometry repair
        run: gradle :androidApp:compileDebugKotlin --stacktrace
      - name: Commit repair and remove both helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/spells-geometry-repair-once.yml
          rm .github/workflows/spells-geometry-retry-once.yml
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/IconControls.kt androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCollectionPrimitivesV4.kt androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt .github/workflows/spells-geometry-repair-once.yml .github/workflows/spells-geometry-retry-once.yml
          git commit -m 'fix: compact Conjuros toolbar cards and editor'
          git push
