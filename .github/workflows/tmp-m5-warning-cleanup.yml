name: Temporary M5 warning cleanup gate

on:
  push:
    branches:
      - tmp/phase4-m5-consolidation

permissions:
  contents: write

jobs:
  warning-cleanup-and-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-m5-consolidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact warning cleanup
        run: python .github/tmp_m5_warning_cleanup.py

      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore

      - name: Run full Kotlin regression and assert targeted warnings are gone
        run: |
          set -o pipefail
          gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace 2>&1 | tee /tmp/m5-gradle.log
          ! grep -F "Unnecessary safe call" /tmp/m5-gradle.log
          ! grep -F "Elvis operator (?:) always returns the left operand" /tmp/m5-gradle.log
          ! grep -F "'fun ScrollableTabRow" /tmp/m5-gradle.log
          ! grep -F "Condition is always 'true'" /tmp/m5-gradle.log

      - name: Type-check backend without retaining install artifacts
        working-directory: backend
        run: npm install --no-package-lock && npm run check

      - name: Verify no incidental package lock survived
        run: test ! -e backend/package-lock.json

      - name: Commit accepted helper-free warning cleanup
        run: |
          rm .github/tmp_m5_warning_cleanup.py .github/workflows/tmp-m5-warning-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: clear bounded Phase 4 compiler warnings'
          git push origin HEAD:tmp/phase4-m5-consolidation
