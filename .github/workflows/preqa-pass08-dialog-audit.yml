name: Pre-QA Pass08 dialog spacing audit

on:
  push:
    branches:
      - implementation/phase4-preqa-ux-repair
    paths:
      - '.github/workflows/preqa-pass08-dialog-audit.yml'

jobs:
  audit:
    if: github.event.head_commit.message == 'Execute Pass 08 dialog spacing audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inventory dialogs and raw spacing
        shell: bash
        run: |
          set -euo pipefail
          ROOT=androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android
          echo '=== Dialog callsites ==='
          grep -R -n -E '(^|[^A-Za-z])(AlertDialog|Dialog)\(' "$ROOT" || true
          echo '=== Dialog-related raw padding/gaps ==='
          python3 - <<'PY'
          from pathlib import Path
          root=Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android')
          for p in sorted(root.glob('*.kt')):
              lines=p.read_text(encoding='utf-8').splitlines()
              hits=[i for i,l in enumerate(lines) if 'Dialog(' in l or 'AlertDialog(' in l]
              if not hits: continue
              print(f'--- {p.name} ---')
              for i in hits:
                  lo=max(0,i-3); hi=min(len(lines),i+45)
                  print(f'[{i+1}] {lines[i].strip()}')
                  for j in range(lo,hi):
                      s=lines[j]
                      if '.padding(' in s or 'spacedBy(' in s or 'contentPadding' in s:
                          print(f'  {j+1}: {s.strip()}')
          PY
# trigger
