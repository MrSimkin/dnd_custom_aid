name: Temporary Increment G source wiring

on:
  push:
    branches:
      - tmp/increment-g-source-wiring
    paths:
      - .github/increment-g-source-wiring-trigger

permissions:
  contents: write

jobs:
  patch-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/increment-g-source-wiring
          fetch-depth: 0
      - name: Apply asserted narrow Increment G editor patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt')
          text = path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}: {old[:180]!r}')
              return text.replace(old, new, 1)

          text = replace_once(
              text,
              '    var traitsDraftJson by rememberSaveable(characterId.toString(), "traits") {\n'
              '        mutableStateOf(characterTraitsToJsonV4(stored.traits))\n'
              '    }\n'
              '    var savedMessage by rememberSaveable(characterId.toString()) { mutableStateOf<String?>(null) }\n',
              '    var traitsDraftJson by rememberSaveable(characterId.toString(), "traits") {\n'
              '        mutableStateOf(characterTraitsToJsonV4(stored.traits))\n'
              '    }\n'
              '    var spellcastingDraftJson by rememberSaveable(characterId.toString(), "spellcasting") {\n'
              '        mutableStateOf(\n'
              '            characterSpellcastingDraftToJsonV4(\n'
              '                CharacterSpellcastingDraftV4(\n'
              '                    sources = stored.spellcastingSources,\n'
              '                    spells = stored.spells,\n'
              '                ),\n'
              '            ),\n'
              '        )\n'
              '    }\n'
              '    var savedMessage by rememberSaveable(characterId.toString()) { mutableStateOf<String?>(null) }\n',
              'add saveable spellcasting draft state',
          )

          text = replace_once(
              text,
              '    val backgroundDraft = remember(backgroundDraftJson) { characterBackgroundFromJsonV4(backgroundDraftJson) }\n'
              '    val traitsDraft = remember(traitsDraftJson) { characterTraitsFromJsonV4(traitsDraftJson) }\n'
              '    val savable = draft.toSheetOrNull(stored, blankRequiredAsZero = true) != null\n',
              '    val backgroundDraft = remember(backgroundDraftJson) { characterBackgroundFromJsonV4(backgroundDraftJson) }\n'
              '    val traitsDraft = remember(traitsDraftJson) { characterTraitsFromJsonV4(traitsDraftJson) }\n'
              '    val spellcastingDraft = remember(spellcastingDraftJson) { characterSpellcastingDraftFromJsonV4(spellcastingDraftJson) }\n'
              '    val savable = draft.toSheetOrNull(stored, blankRequiredAsZero = true) != null\n',
              'decode spellcasting draft',
          )

          text = replace_once(
              text,
              '    fun updateTraits(updated: List<io.github.mrsimkin.dndcustomaid.shared.character.CharacterTrait>) {\n'
              '        traitsDraftJson = characterTraitsToJsonV4(updated)\n'
              '        savedMessage = null\n'
              '    }\n\n'
              '    fun persist(candidate: CharacterSheet) {\n',
              '    fun updateTraits(updated: List<io.github.mrsimkin.dndcustomaid.shared.character.CharacterTrait>) {\n'
              '        traitsDraftJson = characterTraitsToJsonV4(updated)\n'
              '        savedMessage = null\n'
              '    }\n\n'
              '    fun updateSpellcasting(updated: CharacterSpellcastingDraftV4) {\n'
              '        spellcastingDraftJson = characterSpellcastingDraftToJsonV4(updated)\n'
              '        savedMessage = null\n'
              '    }\n\n'
              '    fun persist(candidate: CharacterSheet) {\n',
              'add spellcasting draft updater',
          )

          text = replace_once(
              text,
              '    fun persist(candidate: CharacterSheet) {\n'
              '        val equipment = equipmentDraftFromJsonV4(equipmentDraftJson)\n'
              '        val integrated = candidate.copy(\n',
              '    fun persist(candidate: CharacterSheet) {\n'
              '        val equipment = equipmentDraftFromJsonV4(equipmentDraftJson)\n'
              '        val spellcasting = characterSpellcastingDraftFromJsonV4(spellcastingDraftJson)\n'
              '        val integrated = candidate.copy(\n',
              'decode spellcasting at save boundary',
          )

          text = replace_once(
              text,
              '            background = characterBackgroundFromJsonV4(backgroundDraftJson),\n'
              '            traits = characterTraitsFromJsonV4(traitsDraftJson),\n'
              '        )\n',
              '            background = characterBackgroundFromJsonV4(backgroundDraftJson),\n'
              '            traits = characterTraitsFromJsonV4(traitsDraftJson),\n'
              '            spellcastingSources = spellcasting.sources,\n'
              '            spells = spellcasting.spells,\n'
              '        )\n',
              'persist source and spell collections with central save',
          )

          text = replace_once(
              text,
              '        backgroundDraftJson = characterBackgroundToJsonV4(stored.background)\n'
              '        traitsDraftJson = characterTraitsToJsonV4(stored.traits)\n'
              '        savedMessage = "Guardado"\n',
              '        backgroundDraftJson = characterBackgroundToJsonV4(stored.background)\n'
              '        traitsDraftJson = characterTraitsToJsonV4(stored.traits)\n'
              '        spellcastingDraftJson = characterSpellcastingDraftToJsonV4(\n'
              '            CharacterSpellcastingDraftV4(\n'
              '                sources = stored.spellcastingSources,\n'
              '                spells = stored.spells,\n'
              '            ),\n'
              '        )\n'
              '        savedMessage = "Guardado"\n',
              'reset spellcasting draft after save',
          )

          text = replace_once(
              text,
              '                    CharacterTabV4.SPELLS -> CharacterDomainShellV4(\n'
              '                        title = "Conjuros",\n'
              '                        description = "La navegación está lista. La gestión de fuentes y conjuros se incorpora en los Incrementos G y H.",\n'
              '                    )\n',
              '                    CharacterTabV4.SPELLS -> CharacterSpellsTabV4(\n'
              '                        draft = spellcastingDraft,\n'
              '                        classOptions = draft.classes.map { SpellSourceClassOptionV4(it.id, it.name) },\n'
              '                        onDraftChange = ::updateSpellcasting,\n'
              '                        wide = wide,\n'
              '                    )\n',
              'replace Conjuros shell with source-management foundation',
          )

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt
      - name: Commit narrow Increment G editor patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt
          git commit -m "Wire Conjuros source-management foundation"
          git push origin HEAD:tmp/increment-g-source-wiring
