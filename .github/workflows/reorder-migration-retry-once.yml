name: Reorder migration retry once

on:
  push:
    paths:
      - '.github/workflows/reorder-migration-retry-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Run corrected migration body
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/reorder-migration-once.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          body = textwrap.dedent(workflow[start:end])
          body = body.replace("if 'detectDragGesturesAfterLongPress' in t or 'StableDragHandle(' in t:", "if 'detectDragGesturesAfterLongPress(' in t or 'StableDragHandle(' in t:")
          exec(compile(body, '<reorder-migration-retry>', 'exec'))
          PY
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Compile migrated Android UI
        run: gradle :androidApp:compileDebugKotlin --stacktrace
      - name: Commit migration and self-remove helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/reorder-migration-once.yml .github/workflows/reorder-migration-retry-once.yml
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android .github/workflows/reorder-migration-once.yml .github/workflows/reorder-migration-retry-once.yml
          git commit -m 'fix: migrate cards to measured whole-card reorder'
          git push
