name: Spells geometry repair retry 2 once

on:
  push:
    paths:
      - '.github/workflows/spells-geometry-retry2-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Run guarded Conjuros repair
        run: python3 .github/scripts/spells_geometry_repair_retry.py
      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Compile Conjuros geometry repair
        run: gradle :androidApp:compileDebugKotlin --stacktrace
      - name: Commit repair and remove temporary helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/spells-geometry-repair-once.yml
          rm .github/workflows/spells-geometry-retry-once.yml
          rm .github/workflows/spells-geometry-retry2-once.yml
          rm .github/scripts/spells_geometry_repair_retry.py
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/IconControls.kt androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterCollectionPrimitivesV4.kt androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt .github/workflows/spells-geometry-repair-once.yml .github/workflows/spells-geometry-retry-once.yml .github/workflows/spells-geometry-retry2-once.yml .github/scripts/spells_geometry_repair_retry.py
          git commit -m 'fix: compact Conjuros toolbar cards and editor'
          git push
