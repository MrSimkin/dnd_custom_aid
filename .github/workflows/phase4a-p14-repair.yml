name: Phase4A P14 isolated repair

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/phase4a-p14-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - name: Apply P14 repair
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode(''))"
      - name: Validate patch shape
        shell: bash
        run: |
          git diff --check
          grep -q 'Guardar y activar' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt
          grep -q 'Descartar y activar' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt
          grep -q 'enabled = true' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterPcSettingsClosureV4.kt
      - name: Commit repair and remove helper
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/phase4a-p14-repair.yml
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterPcSettingsClosureV4.kt
          git commit -m 'repair: restore P14 table mode transition review'
          git push origin HEAD:implementation/phase4a-successor-cycle