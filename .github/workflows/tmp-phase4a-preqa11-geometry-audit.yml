name: Temporary Phase 4A field-usage audit

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/tmp-phase4a-preqa11-geometry-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Classify Player OutlinedTextField contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import pathlib
          import re
          from collections import Counter, defaultdict

          root = pathlib.Path('androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android')
          paths = sorted(root.glob('*.kt'))
          features = [
              'singleLine', 'minLines', 'maxLines', 'keyboardOptions', 'keyboardActions',
              'enabled', 'readOnly', 'isError', 'supportingText', 'placeholder', 'prefix',
              'suffix', 'leadingIcon', 'trailingIcon', 'visualTransformation', 'textStyle',
              'interactionSource', 'colors', 'shape',
          ]

          def call_block(text: str, start: int) -> str:
              open_i = text.find('(', start)
              if open_i < 0:
                  return ''
              depth = 0
              i = open_i
              in_str = False
              triple = False
              esc = False
              while i < len(text):
                  if not in_str and text.startswith('"""', i):
                      in_str = True; triple = True; i += 3; continue
                  if in_str and triple and text.startswith('"""', i):
                      in_str = False; triple = False; i += 3; continue
                  c = text[i]
                  if in_str:
                      if not triple:
                          if esc: esc = False
                          elif c == '\\': esc = True
                          elif c == '"': in_str = False
                      i += 1; continue
                  if c == '"': in_str = True; triple = False; i += 1; continue
                  if c == '(':
                      depth += 1
                  elif c == ')':
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1]
                  i += 1
              return text[start:]

          sites = []
          feature_counts = Counter()
          signature_counts = Counter()
          per_file = defaultdict(Counter)
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for m in re.finditer(r'(?<![A-Za-z0-9_])OutlinedTextField\s*\(', text):
                  block = call_block(text, m.start())
                  line = text.count('\n', 0, m.start()) + 1
                  present = tuple(f for f in features if re.search(r'\b' + re.escape(f) + r'\s*=', block))
                  for f in present: feature_counts[f] += 1
                  signature_counts[present] += 1
                  per_file[path.name]['sites'] += 1
                  for f in present: per_file[path.name][f] += 1
                  label = '?'
                  lm = re.search(r'label\s*=\s*\{\s*Text\(([^\n\)]*)', block)
                  if lm: label = lm.group(1).strip()
                  sites.append((path.name, line, label, present, block))

          print('=== CONTRACT FEATURE COUNTS ===')
          print('sites', len(sites))
          for f in features:
              print(f'{f}: {feature_counts[f]}')

          print('\n=== SIGNATURE COUNTS ===')
          for sig, count in signature_counts.most_common():
              print(f'{count:3d} :: {", ".join(sig) if sig else "<base only>"}')

          print('\n=== PER FILE CONTRACT FEATURES ===')
          for name, c in sorted(per_file.items()):
              used = ', '.join(f'{f}={c[f]}' for f in features if c[f])
              print(f'{name}: sites={c["sites"]}; {used}')

          print('\n=== NONTRIVIAL SITES ===')
          trivial = {'singleLine', 'minLines', 'maxLines', 'keyboardOptions'}
          for name, line, label, present, block in sites:
              extra = [f for f in present if f not in trivial]
              if extra:
                  print(f'{name}:{line} label={label} features={",".join(present)}')
                  print('  ' + ' '.join(x.strip() for x in block.splitlines())[:700])

          print('\n=== PREFIX / SUPPORT / ERROR / ENABLED / READONLY SITES ===')
          focus = {'prefix','suffix','supportingText','isError','enabled','readOnly','visualTransformation','leadingIcon','trailingIcon','placeholder'}
          for name, line, label, present, block in sites:
              if focus.intersection(present):
                  print(f'{name}:{line} label={label} features={",".join(present)}')
          PY
