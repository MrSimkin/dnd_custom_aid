name: I2a guarded patch runner

on:
  push:
    branches:
      - tmp/phase4-i2a-supercompact
    paths:
      - .github/workflows/tmp-i2a-wire2.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-i2a-supercompact
          fetch-depth: 0
      - name: Apply guarded patch
        run: python .github/tmp_i2a_patch.py
      - name: Commit product change and remove helpers
        shell: bash
        run: |
          rm .github/tmp_i2a_patch.py .github/workflows/tmp-i2a-wire2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSupercompactV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt \
                  .github/tmp_i2a_patch.py .github/workflows/tmp-i2a-wire2.yml
          git diff --cached --check
          git commit -m "feat: wire authoritative Supercompact live state"
          git push origin HEAD:tmp/phase4-i2a-supercompact
