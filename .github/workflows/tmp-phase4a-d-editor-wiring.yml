name: Temporary Phase4A D editor wiring

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/tmp-phase4a-d-editor-wiring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - name: Apply guarded patch
        run: python .github/tmp-phase4a-d-editor.py
      - name: Check diff
        run: git diff --check
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt
          git rm .github/tmp-phase4a-d-editor.py .github/workflows/tmp-phase4a-d-editor-wiring.yml
          git commit -m "feat: wire structured Combat and compact Dice successor surfaces"
          git push origin HEAD:implementation/phase4a-successor-cycle
