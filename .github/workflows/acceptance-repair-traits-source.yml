name: Rasgos source acceptance repair

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/acceptance-repair-traits-source.yml

permissions:
  contents: write

jobs:
  repair-traits-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Guard isolated repair boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f .maintenance/acceptance_repair_traits_source.py
          test -f .github/workflows/acceptance-repair-core-apply.yml
          test "$(git rev-parse HEAD:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterHelpProvenanceV4.kt)" = "182ca6f6975ec79bc12d283e97ee779345f3a576"
          test "$(git rev-parse HEAD:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt)" = "5c849a57ab7b860eef63223d3b279673382e6d4a"
          test "$(git rev-parse HEAD:androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt)" = "c9802af364ae7c50c59a53f431907903e370fb8a"
      - name: Correct canonical class authority in repair script
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'classes = draft.classes' .maintenance/acceptance_repair_traits_source.py)" = "1"
          sed -i 's/classes = draft\.classes/classes = settingsSheet.classes/' .maintenance/acceptance_repair_traits_source.py
          test "$(grep -c 'classes = settingsSheet.classes' .maintenance/acceptance_repair_traits_source.py)" = "1"
      - name: Apply Rasgos single-authority source UI
        run: python3 .maintenance/acceptance_repair_traits_source.py
      - name: Guard source repair product diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterHelpProvenanceV4.kt \
            androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt \
            .maintenance/acceptance_repair_traits_source.py | sort)"
          test "$changed" = "$expected"
      - name: Focused compile and shared tests
        run: gradle :shared:desktopTest :androidApp:compileDebugKotlin --stacktrace
      - name: Commit Rasgos source repair and self-remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm .maintenance/acceptance_repair_traits_source.py
          rm .github/workflows/acceptance-repair-core-apply.yml
          rm .github/workflows/acceptance-repair-traits-source.yml
          rmdir .maintenance 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use canonical character origins in Rasgos editor'
          git push origin HEAD:implementation/phase4a-successor-cycle
