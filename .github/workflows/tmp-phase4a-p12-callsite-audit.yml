name: Temporary Phase4A P12 full-app help callsite audit

on:
  push:
    branches:
      - implementation/phase4a-successor-cycle
    paths:
      - .github/workflows/tmp-phase4a-p12-callsite-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/phase4a-successor-cycle
          fetch-depth: 0
      - name: Audit Player contextual-help callsites
        shell: bash
        run: |
          echo '=== CharacterHelpV4 callsites with context ==='
          grep -R -n -B 8 -A 10 --include='*.kt' 'CharacterHelpV4(' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android || true
          echo '=== Literal pseudo-info glyphs in production Kotlin ==='
          grep -R -n --include='*.kt' 'ⓘ' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android || true
          echo '=== Help-mode usages ==='
          grep -R -n --include='*.kt' 'CharacterHelpModeV4' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android || true
      - name: Remove temporary helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-phase4a-p12-callsite-audit.yml
          git commit -m "chore: remove completed P12 callsite audit helper"
          git push origin HEAD:implementation/phase4a-successor-cycle
