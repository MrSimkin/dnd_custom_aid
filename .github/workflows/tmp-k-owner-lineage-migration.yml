name: K owner-lineage migration gate

on:
  push:
    branches:
      - tmp/phase4-k-stabilization
    paths:
      - .github/workflows/tmp-k-owner-lineage-migration.yml

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-k-stabilization
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Generate exact owner-schema migration regression
        shell: bash
        run: python .github/k_owner_lineage_test.py
      - name: Run focused owner-lineage migration test
        shell: bash
        run: gradle :shared:desktopTest --tests '*CharacterOwnerLineageMigrationTest' --stacktrace
      - name: Commit accepted migration regression and remove helpers
        shell: bash
        run: |
          rm .github/k_owner_lineage_test.py .github/workflows/tmp-k-owner-lineage-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/src/desktopTest/kotlin/io/github/mrsimkin/dndcustomaid/shared/character/CharacterOwnerLineageMigrationTest.kt \
                  .github/k_owner_lineage_test.py \
                  .github/workflows/tmp-k-owner-lineage-migration.yml
          git diff --cached --check
          git commit -m "test: cover owner schema 5 migration lineage"
          git push origin HEAD:tmp/phase4-k-stabilization
