name: Pre-QA UX repair pass 4 helper

on:
  push:
    branches:
      - implementation/phase4-preqa-ux-repair

permissions:
  contents: write

env:
  REVIEW_VERSION: "0.4.0-preqa.4"
  REVIEW_BUILD: "40400"
  REVIEW_APK: "DND_Custom_Aid_0.4.0-preqa.4_Build_40400_debug.apk"
  REVIEW_ARTIFACT: "DND-Custom-Aid-0.4.0-preqa.4-build-40400-debug"

jobs:
  repair:
    if: github.event.head_commit.message == 'Execute durable pre-QA UX repair pass 4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply fail-closed repair pass
        run: python tools/preqa_ux_pass4.py

      - name: Verify repair shape
        run: |
          git diff --check
          grep -q 'versionCode = 40400' androidApp/build.gradle.kts
          grep -q 'versionName = "0.4.0-preqa.4"' androidApp/build.gradle.kts
          grep -q 'stickyHeader(key = "equipment-tools")' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEquipmentClosureV4.kt
          grep -q 'stickyHeader(key = "traits-tools")' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterTraitsClosureV4.kt
          grep -q 'CharacterPassiveSkillsCardV4(calculationSheet)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt
          if grep -q 'item(key = "management-operational")' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterManagementTabV4.kt; then
            echo "Management operational card is still inside the scrolling list" >&2
            exit 1
          fi
          grep -q 'bottom = appSpacingV4(170.dp)' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt
          grep -q 'contentPadding = PaddingValues(' androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterSpellListClosureV4.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: "false"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare stable CI debug keystore
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore

      - name: Build and test Kotlin surfaces
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Type-check backend
        working-directory: backend
        run: npm install --no-package-lock && npm run check

      - name: Prepare identified review APK
        run: |
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "$RUNNER_TEMP/$REVIEW_APK"
          echo "APK_SHA256=$(sha256sum "$RUNNER_TEMP/$REVIEW_APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c%s "$RUNNER_TEMP/$REVIEW_APK")" >> "$GITHUB_ENV"

      - name: Upload review APK
        uses: actions/upload-artifact@v7
        with:
          name: DND-Custom-Aid-0.4.0-preqa.4-build-40400-debug
          path: ${{ runner.temp }}/DND_Custom_Aid_0.4.0-preqa.4_Build_40400_debug.apk
          if-no-files-found: error

      - name: Remove temporary repair infrastructure
        run: |
          cp tools/preqa_checkpoint_pass4.py "$RUNNER_TEMP/preqa_checkpoint_pass4.py"
          rm -f tools/preqa_ux_pass4.py tools/preqa_checkpoint_pass4.py
          rm -f .github/workflows/preqa-ux-pass3-helper.yml .github/workflows/preqa-ux-pass4-helper.yml

      - name: Commit tested product repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement pre-QA UX repair pass 4"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Write owner-required pass checkpoint
        run: python "$RUNNER_TEMP/preqa_checkpoint_pass4.py"

      - name: Commit checkpoint
        run: |
          git add docs/PROJECT_STATE.md docs/checkpoints
          git commit -m "Checkpoint pre-QA UX repair pass 4"

      - name: Push tested repair and checkpoint
        run: git push origin HEAD:implementation/phase4-preqa-ux-repair
