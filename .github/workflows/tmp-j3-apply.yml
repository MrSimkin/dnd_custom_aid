name: J3 guarded Android backup file UX

on:
  push:
    branches:
      - tmp/phase4-j-backup-import
    paths:
      - .github/workflows/tmp-j3-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-j-backup-import
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: "false"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Repair guarded J3 helper call sites
        shell: bash
        run: python .github/j3_fix_helper.py
      - name: Apply guarded J3 patch
        shell: bash
        run: python .github/j3_android_backup_patch.py
      - name: Prepare stable CI debug keystore
        shell: bash
        run: base64 --decode androidApp/ci-debug.keystore.b64 > androidApp/ci-debug.keystore
      - name: Build and test Kotlin surfaces
        shell: bash
        run: gradle :shared:desktopTest :androidApp:assembleDebug :desktopApp:build --stacktrace
      - name: Check backend
        shell: bash
        run: |
          cd backend
          npm install
          npm run check
      - name: Commit product patch and remove helper workflow
        shell: bash
        run: |
          rm .github/j3_android_backup_patch.py .github/j3_fix_helper.py .github/workflows/tmp-j3-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/MainActivity.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterUi.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterEditorV4.kt \
                  androidApp/src/main/kotlin/io/github/mrsimkin/dndcustomaid/android/CharacterPcSettingsClosureV4.kt \
                  .github/j3_android_backup_patch.py .github/j3_fix_helper.py .github/workflows/tmp-j3-apply.yml
          git diff --cached --check
          git commit -m "feat: add Android character backup file flow"
          git push origin HEAD:tmp/phase4-j-backup-import
