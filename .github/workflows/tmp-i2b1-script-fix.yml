name: Fix I2b1 guarded patch anchor

on:
  push:
    branches:
      - tmp/phase4-i2b-table-mode
    paths:
      - .github/workflows/tmp-i2b1-script-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-i2b-table-mode
          fetch-depth: 0
      - name: Narrow Overview callback anchor
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path(".github/i2b1_patch.py"); t=p.read_text(); old="    \"                            onDraftChange = ::updateDraft,\\\\n                            onClosureStateChange = ::persistClosureState,\\\\n\",\n    \"                            onDraftChange = ::updateStructuralDraft,\\\\n                            onClosureStateChange = ::persistStructuralClosureState,\\\\n\",\n    \"overview structural callbacks\",\n"; new="    \"                            onDraftChange = ::updateDraft,\\\\n                            onClosureStateChange = ::persistClosureState,\\\\n                        )\\\\n                        CharacterTabV4.SKILLS\",\n    \"                            onDraftChange = ::updateStructuralDraft,\\\\n                            onClosureStateChange = ::persistStructuralClosureState,\\\\n                        )\\\\n                        CharacterTabV4.SKILLS\",\n    \"overview structural callbacks\",\n"; assert t.count(old) == 1, t.count(old); p.write_text(t.replace(old,new,1))'
      - name: Commit script repair and remove helper
        shell: bash
        run: |
          rm .github/workflows/tmp-i2b1-script-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/i2b1_patch.py .github/workflows/tmp-i2b1-script-fix.yml
          git diff --cached --check
          git commit -m "ci: narrow I2b1 Overview patch anchor"
          git push origin HEAD:tmp/phase4-i2b-table-mode
