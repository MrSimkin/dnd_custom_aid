name: Fix I2b1 guarded patch anchor

on:
  push:
    branches:
      - tmp/phase4-i2b-table-mode
    paths:
      - .github/workflows/tmp-i2b1-script-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/phase4-i2b-table-mode
          fetch-depth: 0
      - name: Narrow Overview callback anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/i2b1_patch.py')
          text = p.read_text()
          old = '''    "                            onDraftChange = ::updateDraft,\\n                            onClosureStateChange = ::persistClosureState,\\n",
    "                            onDraftChange = ::updateStructuralDraft,\\n                            onClosureStateChange = ::persistStructuralClosureState,\\n",
    "overview structural callbacks",
'''
          new = '''    "                            onDraftChange = ::updateDraft,\\n                            onClosureStateChange = ::persistClosureState,\\n                        )\\n                        CharacterTabV4.SKILLS",
    "                            onDraftChange = ::updateStructuralDraft,\\n                            onClosureStateChange = ::persistStructuralClosureState,\\n                        )\\n                        CharacterTabV4.SKILLS",
    "overview structural callbacks",
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one script anchor, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit script repair and remove helper
        shell: bash
        run: |
          rm .github/workflows/tmp-i2b1-script-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/i2b1_patch.py .github/workflows/tmp-i2b1-script-fix.yml
          git diff --cached --check
          git commit -m "ci: narrow I2b1 Overview patch anchor"
          git push origin HEAD:tmp/phase4-i2b-table-mode
